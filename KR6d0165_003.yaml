body:
  text: 唐荊溪尊者釋籤宋四明尊者鈔宋武林沙門可度詳解明天台後學正謐分會三則彼下功成識體則彼此昭著法華行成使功不唐捐所詮可識解科功成識體者十乘起教觀行功成則識所詮三千妙體彼此者彼即止觀此即十妙彼觀此教解行相成昭明顯著法華妙行於茲成就使功不虗棄教下所詮之體可識鈔故知得此相成之意則不唐學問不謾修行教下所詮妙體可識解故知若得前科解行相成之意解成則不唐學問行成則不謾修行也四故更下結示立名使詮旨斯顯四初立門所由故更以十門收攝十妙解科結示立名使詮旨斯顯以十門攝十妙結示立名直申一理使經旨泠然詮旨斯顯也初立門所由十門從十妙立故云所由故更之言承上而來欲令解行俱成故更立十門收攝十妙鈔如文二何者下出門名義何者為實施權則不二而二開權顯實則二而不二法既教部咸開成妙故此十門不二為目解十門何故皆名不二徵釋云為實等在昔四時三教分隔而説皆云二法今經顯實開會而談皆不二也鈔理事三千本皆融即實機未熟權化宜施佛順物情分隔而説故云不二而二半滿諸法暫有差殊權化若成實理須顯佛隨自意開會而談故云二而不二境等十法即是所通既約教部判後開之俱圓俱妙故能通門宜名不二解理事至而説釋為實施權初二句明一實理次二句明施權意後二句正明施權諸佛慈悲不與世諍物情差別亦以差別之法逗之從一清淨道施出二三四故云分隔而説此施權當分義也半滿至而談釋開權顯實意初二句明權法次二句明開顯意後二句正明開權會二三四咸歸於一故云開會而談此開權跨節意也與妙玄二會異科明施開意同初明諸法本實云一切諸法無不皆妙衆生情隔於妙耳今云理事等次大悲施權云大悲順物不與世諍是故明諸權實不同今云實機等三今經開顯云今開方便門示真實相今云半滿等境等去釋法既教部等門為能通境等即所通約教判三粗一妙約部判昔粗今妙約教開偏入圓約部開四味粗即醍醐妙俱圓則約教論開俱妙乃約部義也所通之法既俱圓妙門由妙立故能通門宜名不二也三各自高深一一門下以六即檢之解各自高深者該修德之極為高究竟徹性德之源為深理即門門皆用六即檢校高下故云各自須六即檢者以十妙不出三千三千不離一念既以十門收攝十妙則門門之下的指一念三千為今觀體故須六位揀其高下也鈔一家所判法門名義無間高下己他無不理性本具全性起修分顯究盡故今十門一一如是皆為觀體其義更明然事異故六理一故即此宗學者誰不言之而的當者無幾應知圓家明理已具三千而皆性不可變約事乃論迷解真似因果有殊故下文云三千在理同名無明三千果成咸稱常樂約事明六三千無改無明即明三千並常俱體俱用約理明即若見斯旨稍可持論解一家等者天台一家判諸經論一切法門能詮名字所詮義理無論高下己他皆用六即揀判止觀云圓觀諸法皆云六即故以圓意約一切法悉用六即判位文高下己他即心佛衆生十界依正佛界為高九界為下心法為己生佛為他理性本具理即全性起修名字觀行相似分顯初住至等覺究盡究竟既諸法門皆用揀判故今十門亦以六即撿之故云一一如是十門既約六即乃顯門門攝歸一念三千皆可修證則十門皆為觀體前四為十乘觀體後六為起教觀體其義至此猶更分明驗知起教初心不可不修矣然事下北峯分四初標迷二正示三引證四結示初文即止觀大意文此二句自荊溪發明之後凡稟山家學者皆能言之而得旨者少故云無幾以由淨覺以空中為理同俗假為事異此義雖在雜編以在四明輪下已有此語故暗斥之應知等者三千法門理性本具不可改變荊溪云萬法是真如由不變故隨緣即不變乃全事成理理同故即也約事乃論迷解等即變造三千全理成事遂分六位之差即事異故六也理即名迷名字觀行屬解真即分證似謂六根因即前五果即究竟引因果門四句釋之鈔下釋曰三千在理為染作因縱具佛法以未顯故同名無明該前五即因中三千也三千離障八倒不生一一法門皆成四德故咸常樂究竟即果上三千也此二句既將因果對分必該六位故注云約事明六三千實相皆不變性迷悟理同故曰無明即明此明因果只一三千三千世間一一常住理具三千俱名為體變造三千俱名為用故云俱體俱用此明因果三千俱能起用因中三千起於染用果上三千起於淨用此二句示三千之性在迷在悟未始改易雖在於體體不離用全用是體也故注云約理明即原夫事理兩種三千本圓融相即之義理即迷此名字解此乃至究竟顯此今以理同事異對兩種三千者不分而分以事異故六即理之事對事造三千理同故即即事之理對理造三千也若謂兩種三千之外更有迷悟之事則兩種三千攝法不盡何名妙法耶六即義蘊大經名出智者止觀一引如來性品云譬如貧人家有寶藏而無知者知識示之即得知也耘除草穢漸漸得近近己藏開盡取用之文經文甚廣大師撮略而引輔行委釋義雖蘊經諸師莫知吾祖深悟圓宗發明此義故於止觀發大心約六即顯是觀經疏約六即釋佛字荊溪云此六即義起自一家深符圓旨文即之為義輔行云如前引體不二故名即指要云當體全是方名為即文吾祖立六即義有二一顯圓詮諸法事理不二生佛體同免生退屈故明即字雖全體是迷悟因果其相有殊免生上慢故明六字止觀云若智信具足聞一念即是信故不謗智故不懼初後皆是若無信高推聖境非己智分若無智起增上慢謂己均佛初後俱非為此事故須知六即文二革文字暗禪之蔽世間暗證禪人撥棄修行唯云即心是佛不辨階位淺深多濫上聖為救斯蔽故明六位文字法師封文滯意唯守名相推功上人自謂絶分為此等故故明即字以示初後理同輔行云暗禪者多增上慢文字者推功上人並由不曉六而復即文此六即與兩種三千如何會同雜編云理同者三千空中之理迷悟咸同也事與者三千即假之事因果有異也文霅川之説分割三諦已死之義置而勿論南屏云兩種三千法體皆不思議名理同六位淺深情分高下名事異北峯評曰不二門云名智淺深何嘗云情北峯因南屏之説又詳究妙宗指要之文曰理同者事造三千法體與理同故即也事異者情智迷悟淺深所見事異故六也改情分為情智也蓋圓詮生佛迷悟緣起變造諸法皆事三千並由理起全事即理事與理同故云理同故即也而事造上有迷有悟逆順事殊悟仍淺深真似相別故云事異故六是則理同故即通事理兩種三千事異故六別指事造三千分迷悟淺深事異也文今恐理事三千攝法周遍豈事造外更有情智淺深應屬緣生虗假非圓家即理之事也鑑堂云應知理同故即是理造三千事異故六是事造三千以事造不出逆順二修權實二造皆是即理之事全性起修雖迷解真似乍分當處無非理性本具故即不妨六六不妨即一一無異故事造三千始終不缺正由迷解法上當處點即也文今依此説更助顯之理同事異非單理單事蓋由全性起修故有六位迷悟高下之殊故曰事異其實皆當處即理也全修成性故六皆即理故曰理同是則理同故即即事之理對理造三千事異故六即理之事對事造三千若爾何名俱體俱用耶答俱用之言正彰理同故即能即體起用因中全三千之體起於染用果上全三千之體起於淨用其實正意明理造三千也四明云第四句明圓最顯體用之名本相即之義文問三千乃圓融法體今以六位迷悟高下會事造三千將非差別法而會圓融法乎答全性起修雖分六位其實當處即理故四明曰理則本具三千性善性惡也事則變造三千修善修惡也既以修善修惡為事造何妨以六位高下對之復次四明於妙宗發明蛣𧏙六即之義文云六即之義不專在佛一切假實三乘人天下至蛣𧏙地獄色心皆須六即辨其初後所謂理蛣𧏙乃至究竟蛣𧏙等文潤師指瑕云理即在迷故則有蛣𧏙等名字在悟則五即皆佛如何却於此五而立蛣𧏙等名字乎淨覺時在四明輪下作抉膜書委破潤師後來背宗還同他見故雜編云六即之名本為揀濫雖一切法通於六位若名有叨濫故須甄之若名不濫者不必揀也且蛣𧏙蝮蠆是畜趣之微物俱是迷逆之號固無叨濫之理何須用六位甄分良為他人見涅槃疏中蛣𧏙蝮蠆具於四分例彼四分立此六即蟲名雖同分之與即二義敻殊何者彼之四分既名為作蓋約權造事用而言此之六位既名為即須從實證理體而説文北峯破云有三失初至不揀是一切不遍失止觀云圓觀諸法皆云六即何云蛣𧏙等不必揀耶二從且蛣𧏙至何須甄分是圓見同凡夫失圓見含靈皆毗盧體豈同凡夫三從良為至盡文是妄破例四分失四明不曾例涅槃四分乃成加誣草菴扶成云十方虗空生我心內空生大覺如海一漚覺體周涵無乎不在然佛名曰覺覺遍十方毗盧遮那即一切法者也夫如是圓頓初心莫不即是若唯即是上慢彌滋六位甄分革斯叨濫於是圓觀諸法皆須六即也四明達此則曰不惟顯佛九亦同彰下至蛣𧏙皆須六即蓋佛以十界為通體蛣𧏙即佛界別相十皆究竟不舍蛣𧏙至果圓成名體不轉以如來終日與蛣𧏙同而𧏙𧏙終日與如來異故曰三千在理至咸稱常樂茲乃唯心觀體無法不收六即相須深符圓旨文蓋圓詮十界初後不二迷則俱迷悟則俱悟毗盧身土不逾凡心阿鼻依正全處極聖一佛成道法界無非此佛依正一成一切成故妙宗曰以論十界皆理性故無非法界一一不改故名字去不唯顯佛九亦同彰乃至果成十皆究竟文解謗云蛣𧏙名相至究竟者此名理性具十界也文忠法師云廣智傳四明曰約一人唯心觀體説也文四直彰宗趣本門已廣引誠證此下但直申一理使一部經旨皎在目前鈔如文二一者下第二列門解釋二初列門對妙二初列門一者色心不二門二者內外不二門三者修性不二門四者因果不二門五者染淨不二門六者依正不二門七者自他不二門八者三業不二門九者權實不二門十者受潤不二門鈔可見二是中下對妙是中第一從境妙立名第二第三從智行立名第四從位法立名第五第六第七從感應神通立名第八第九從説法立名第十從眷屬利益立名解十門從十妙立前云立門對妙互有多少即今文鈔七科之境不出色心此二不二則諸境皆妙故云第一從境立名智行二法正論修相儻二境不融修性有異則不成妙故二三從智行立名位多在因三法唯果若了始終理一此二皆妙故第四從位法立名通應是事果後利他既是淨用依正必融縱是他機亦同自體此之妙事在今染心能如是觀妙用方顯故五六七從感應神通立名三業是能説之人權實是所説之法此二若融説法方妙故八九從説法立名眷屬是三草二木利益由法雨所滋若知本一地雨則權實益等故第十從眷屬利益立名立此十門意成十妙解行故也解玄文明境具有七科今以色心二法收盡故云不出今經開權色心諸法咸成不二門顯七科無非妙法依境發智以智導行是正論起修今明內外二境互融修全性起故使智行方稱妙法鈔中反顯云不融有異也位妙實通因果為對三法極果故多在因若了始因終果一理無殊位法方妙故因果門從二妙立神通感應是果後利他之事果上全三千之體起於淨用其用既淨故依正不相妨他機同自體此之淨用在今染心能以利他之法攬入一心妙觀觀之果用方顯故此三門從通應二妙而立此初心修起教觀之相也能説之人三輪設化所説之法權實不融今經開之咸名不二三草二木是能受法雨是能潤今皆一地所生一雨所潤即利益平等結意云荊溪立此十門為成妙解行也二一色下釋門旨趣十段初色心不二門三初標一色心不二門者鈔一切諸法無非妙境本文七科亦且從要七科尚廣妙旨難彰今以色心二法收盡故大論云一切世間中唯有名與色若欲如實説但當觀名色此二不二諸法皆妙故今攝別入總特指心法明乎不二以此為門則解行易入也解釋標文初釋色心此二下釋不二以此下釋門初文從寬至狹示境之要法華開顯三千諸法無非妙境天台從要總作七科次明法相該博故云尚廣今以略顯廣故用色心收盡心法為門解行易入即以易通難也論云一切諸法中但有名與色更無有一法出於名色者若欲求真實但當觀名色文箋要曰大論云名色者謂心但有名故若望假名此名即實文攝別入總者攝色心之別入一念之總故就心法以明不二解行易入者攬法歸心無法不趣解易入也即心成觀觀無不通行易入也二且十下釋二初約諸境明總別二初雙標且十如境乃至無諦一一皆有總別二意總在一念別分色心解總科云約諸境明總別謂約七科諦境明乎總別別則分色分心總乃的指一念今且通分總別下方別開事理諸師不得此意便就此分事理將理為總以事為別致與一家文義相違鈔總在一念者若論諸法互攝隨舉一法皆得為總即三無差別也今為易成觀故故指一念心法為總然此總別不可分對理事應知理具三千事用三千各有總別此兩相即方成妙境解初句牒文若論下通論諸法皆總今為下正明一念為總然此下遮異説應知下顯正義諸法互攝者三千諸法以即性故趣舉一法攝一切法則法法皆得為總即心佛衆生三無差別諸法雖多不出三法故用此結也然雖諸法皆得為總今意為成妙觀故指一念玄文揀難從易之義也不可等者以山外以理為總事為別以理同故論理總事異故論事別俟下評破四明建立則理具三千一法為總諸法為別事用三千總別亦爾故云各有相即者理中總別即事總別事中總別即理總別方得稱妙皆由理具方有事用故也事理總別文云總在一念別分色心以一家事理如何分對孤山以理總事別而釋以理同故論總由事異故論別一念是理屬能造故名理總生佛依正是事屬所造名事別淨覺亦云理總事別但以空中為理俗假為事舊破云以彼不曉性具諸法法法宛然故無理別不曉事相本來圓妙故無事總如毛吞巨海芥納須彌豈非事相能總諸法耶破義未盡別出義章四明立義理具三千事用三千各有總別性具諸法總別相收緣起諸法總別亦爾等尊者之説符文得旨符文者不二門當知心之色心即心名變妙樂記四句立法金錍圓見事理一念具足皆蘊乎事理各論總別之義又深得一家圓頓解行之旨以圓論諸法事理不二趣舉一法咸具事理理體具足名理總雖同趣一理而諸法宛然名理別此性具三千也緣起諸法以即性故隨舉一法諸法咸趣名事總雖同趣一法而諸法宛然名事別此變造三千也是則三千諸法法法即性法法起修法法終日不失自體法法終日同趣剎那雖各有總別其實事理互融圓解雖爾若欲修觀必須揀難從易的指一念心法為總則妙觀易成故四明云若事若理皆以事中一念為總則又得一家立行造修之旨然此既約兩種三千會之則修性體用無住本法不變隨緣皆一揆矣又知荊溪明乎總別之意欲顯諸法互攝一一性遍故也以互攝故法法為總以性遍故別體宛然故四明云諸法不失自體為別即性遍也同趣剎那為總即互攝也二何者下雙示二初別何者初十如中相唯在色性唯在心體力作緣義兼色心因果唯心報唯約色十二因緣苦業兩兼惑唯在心四諦則三兼色心滅唯在心二諦三諦皆俗具色心真中唯心一實及無準此可見解前雙標中先總次別今雙示中乘其義便先別次總又欲攝別入總故也十如中本末究竟文略不對鈔中點出因緣束為三道鈔十如中相可別故屬色性據內故屬心觀音玄義指心為體而諸文中雙取色心力作單不能運緣或指愛或指具度既存兩説義必雙兼若云業為因者則似兼色今從習邊故因果皆心五陰皆報則須兼心今從受身約色義強本末究竟文雖不對既論三等同後三諦因緣中現未七支皆須雙具識名雖獨必含中陰故亦兩兼行有是業不可偏屬無明愛取唯心可知諸諦中苦同七支集既兼業道亦含戒皆具色心俗論諸法兼二可知滅及真中一實無諦體唯是理無相可表並心證故故不兼色然上所對不可永殊欲成別義故且從強解初消文然上下明意相性二法玄云相以據外攬而可別性以據內自分不改指心為體玄下云心覺苦樂故以當體文雙取者玄云地獄界以摧折色心為體人天以安樂色心為體等力作者功用名力搆造名作動作須是色心相應故云單不能運緣或指愛者止觀云無明愛等能潤於業即心為緣也玄云二乘以無明為緣六度菩薩以煩惱為緣或指具度妙玄云緣助也所謂諸惡我我所所有具度皆能助成習業文業因兼色者善惡之業皆以意為方便身口七支所造故兼色心今從習因而説故唯在心玄云如是因者惡習因也自種相生習續不斷以習發故為惡易成故名如是因文果屬心者玄云習果也如多欲人受地獄身見苦具謂為欲境便起染愛此習果也文五陰皆報既四陰屬心一陰屬色合兼色心今取受身為報故唯屬色亦從強而説本末等者妙玄初相為本後報為末所歸趣為究竟等文既論等者玄云若作如義初後皆空為等若作性相義初後相在為等若作中義初後皆實相為等文同後者真中唯心俗兼色心也七支皆名苦道須兼色心現五果中識本唯心今取含中陰色故亦兩兼此識託胎乘於中陰陰義屬色天眼能見身口屬色意業屬心故不偏屬無明等惑唯在心也諸諦者四二三一無諦通總而示四諦中苦同前因緣理須雙具集兼業者四諦法相合惑業二皆集諦收集是煩惱只唯在心既兼於業故通色心道即三學戒體屬色故雙具此釋三兼色心二諦三諦俗該依正故兼色心四諦中滅二諦中真三之真中一實無諦體並屬理無形相表故不兼色並內心證故唯在心示意者上將七科分配色心欲成別義一往從強若論諸法本來相攝又不可謂條然永殊二既知下次總既知別已攝別入總一切諸法無非心性一性無性三千宛然解既解上科別分色心今當攝諸法差別歸剎那之總一切諸法別也無非心性總也既云諸法無非心性豈非攝別入總心屬事性屬理今欲於事顯理是故雙舉一性下正釋攝別入總之所以良由一性圓融無決定堅住之性立理事三千故能攝別以歸總也前云一念今云一性理事相顯也鈔前約諸法不失自體為別今明諸法同趣剎那為總終日不失終日同趣性具諸法總別相收緣起諸法總別亦爾非謂約事論別以理為總又復應知若事若理皆以事中一念為總以衆生在事未悟理故以依陰心顯妙理故解釋攝別入總文相稍廣初釋前四句次釋後二句初又二初正釋二揀顯初文有三節初對前明攝別入總二性具下示事理各有總別三又復下明並以事念為總前別分色心為顯法法宛然不相混濫不失自體今明諸法元同一性故同趣剎那妄念別時常總總時常別總別同時故云終日亦為成觀故云剎那據圓詮妙旨法法為總亦可云同趣一塵也此之總別若事若理皆有此義故云性具等本具三千一法為總諸法為別一攝一切故云相收緣起三千既全性起亦以一法為總諸法為別亦皆融攝故云亦爾非謂下如前敘破應知理事三千皆以心法為總就迷而辨故云事念衆生全體在迷未嘗悟理須指事念不可以心為真心以依陰心觀顯不思議理故曰事念豈可不立陰等直觀不思議耶上云若事是事造緣起之事下云事念是迷妄之事現前一念云何能總事理諸法須知約此一念能具諸法名為理總所具諸法名為理別約此一念能造諸法名事總所造諸法名事別如此分之兩重總別自然不濫鈔云本具三千為別至咸趣一念也又序云介爾之心為事理解行之要即此謂也鈔問他云一念即一性也一念靈知性體常寂又云性即一念謂心性靈寂性即法身靈即般若寂即解脫又云一念真如妙體又云並我一念清淨靈知據此等文乃直指文中一念名真淨靈知是約理解今云屬事是陰入法與他所指賖切如何解二揀顯中初問起他云者引示珠指文對今一念屬事並難凡引四文初是釋今總在一念云一性即一念也一念靈知性體常寂次釋修性門界如一念云性即一念德即法身般若解脫皆常樂我淨也今敵體示性德相謂心性靈寂性即法身靈即般若寂即解脫文第三文是未入文前懸敘不二唯心實相科云一一法界皆即一心真知妙體又云當知諸法不二唯心唯心無相具一切法故此十門門門之法皆名不二一一諸法當體通入名之曰門若一法入此一法外更無九門之法為異並我一念清淨靈知文據此四文並約理解今云屬事與他所見遠近如何賖遠切近鈔答此師祇因將此一念約理釋之致與一家文義相違且違文者一違玄文彼判心法定在因佛法定在果衆生法一往通因果二往則局因他執心法是真性故乃自立云心非因果又礙定在因句復自立云約能造諸法故判為因佛定在果者乃由研修覺了究盡為果今問既將因果分判法相何得因果却不相對果若從覺因須指迷何得自立理能造事而為因邪既不相對何名分判又違華嚴心造之義彼經如來林菩薩説偈云心如工畫師造種種五陰一切世間中無法而不造如心佛亦爾如佛衆生然心佛及衆生是三無差別輔行釋云心造有二種一者約理造即是具二者約事即三世變造等心法既有二造經以心例於佛復以佛例於生故云如心佛亦爾如佛衆生然是則三法各具二造方無差別故荊溪云不解今文如何銷偈心造一切三無差別何忽獨云心造諸法得名因邪據他所釋心法是理喻論能具能造生佛是事唯有所具所造則心造之義尚虧無差之文永失矣又若約能造釋因則三法皆定在因以皆有二造故此文是今家立義綱格若迷此者一家教旨皆翻倒也焉將此解定教文之欠剩耶二違大意及金剛錍他自引云隨緣不變名性不變隨緣名心引畢乃云今言心即真如不變性也今恐他不許荊溪立義何者既云不變隨緣名心顯是即理之事那得直作理釋若云雖隨緣邊屬事事即理故故指心為不變性者佛法生法豈不即耶若皆即理何獨指心名不變性故金錍云真如是萬法由隨緣故萬法是真如由不變故故知若約萬法即理則生佛依正俱理皆不變故何獨心是理耶若據衆生在事則內外色心俱事皆隨緣故何獨心非事邪他云生佛是因果法心非因果驗他直指心法名理非指事即理生佛二事會歸心故方云即理亦非當處即具三千是知他師雖引唯色之言亦祇曲成唯真心爾解答中總斥他解違文背義別破初違文二違義初又二一違玄文二違大意金錍初引玄籤三法因果之文如前示他執等者敘他謬見示珠指云心法定在因者心非因果約能造諸法判為因也華嚴云一切唯心造心造諸如來等豈非十法界皆由心造佛定在果者由覺自心研修究竟名佛故云定在果也文今問下徵斥因果相對者對迷説覺既以研修究了名果則合判迷為因何云心法是理能造生佛之事故判為因耶又違等者前云心造諸法故判為因豈但違玄文又違華嚴心造一切三無差別之義須知心佛衆生三皆能造故云無差豈可獨云心能造耶故引彼經輔行委破輔行五中引經十八如來林菩薩説偈云心如工畫師至是三無差別若人欲了知三世一切佛應當如是觀心造諸如來不解今文如何消偈心造一切三無差別文如工畫師者畫師即無明心能造十界五陰故云種種一切世間即十法界假實國土等輔行釋初偈云言心造者不出二意一者約理造即是具二者約事不出三世三世又三一者過造於現過現造當二者現造於現三者聖人變化所造亦令衆生變心所造彼文甚廣今云三世變造指前二義等即等於聖人權造也問華嚴只云心造荊溪得何文意便作事理而釋答正得天台引造證具之義如下辨經以下四明例釋次偈別行玄記上云經文先示心造一切便以此心而例於佛示佛權造同心實造次復以佛而例於生示生實造同佛權造權實雖異因果暫殊三皆能造一切世間故得結云三無差別文不解天台引造證具之文如何消釋華嚴經偈心造一切指初偈三無差別指次偈輔行又云若無今家諸圓文意彼經偈旨理實難消文通指一家諸部圓文今此正指不思議境文也蓋清涼華嚴大疏解釋此文以心為理為能造生佛是事為所造故斥云不解今文等也荊溪釋意三皆能造山外何獨以心為能造耶據他等者然示珠指本無顯文指心是理四明據他立義核而破之義書六引珠指云佛名真覺生名不覺心即生佛之心非離生佛外別有心為生佛之本經示本末因果不二故云三無差別耳文止此四明斷云豈非謂心是非迷非悟之真心注云心唯屬理今云心法是理能具能造義書云此心迷則為生悟則為佛今云生佛是事所具所造此則只得一人心法少分注以唯知事造生佛不知理具生佛二造雙明方明全分今云心造尚虧殊不識法界有情十方諸佛生佛之全分因嗟珠指棄於大海而取一漚所得者如爪上土所失者如大地土今云無差之文永失故指要斷云心造之義尚虧無差之文永失以我一念及一切衆生十方諸佛各各論於事造人人説於理具而皆互具互攝方名三無差別文問心造義虧為理為事若云虧理他云心法是理若云虧事義書云唯知事造答義書明云唯知事造不知理具正當虧理他謂心是非迷非悟之真心此心迷則為生悟則為佛心能作生作佛豈非事造以約迷悟説故迷悟屬事也他云心法是理者他謂非迷非悟之真心故云心唯屬理非圓詮性具三千之理也問既云能具豈非理耶答他計真心遍一切處名之為具但有具名而無具義也又若等者若謂心能造法釋心在因應須生佛亦定在因以三法皆具二造故也以三無差別之文是一家所立不思議境觀心具造等義之綱格若以非迷非悟之理以釋心法乃成緣理斷九偏指真如則抑挫圓宗反同歷別之行故云翻倒也欠剩者山外謂妙玄類通十種三法合有觀心之文文無者略也光明玄十種三法圓談法性若更立觀心則是剩也義書十云妙玄但以三軌類通十法而已合有觀心一科彼文無者略也今之玄文雖帶十種法相並以一性貫之法性無外即我一心豈此之外而有法相不融更須附法作觀乎文焉可將此等見解定教文中之欠剩耶只緣山外才見言心便作真理而釋謂圓談法性便是觀心故此斥之二造問大師於止觀不思議境引華嚴心造之文荊溪得何文意便作二造而釋況造謂造作正屬於事云何理中説造答荊溪得義符文蓋圓宗大旨法理當然以一切法並由理具方有事用只一心造任運有事有理此得義也符文者止觀初明陰境引此文證正示境相即心生十界事造義也不思議境又引此文證心具十界理造義也輔行科云重牒初引示境相文前云心造即是心具故引造文以證心具又云不解今文如何消偈心造一切三無差別文故知正得引造證具文意乃作二造而釋也問指的妙境出自法華何故止觀正明妙境却引華嚴文耶答三千妙境出法華心造揀境出華嚴從所揀境以示妙境故重牒華嚴文雖引彼義歸法華以今經説因緣果報皆是實相因緣是能造果報是所造此之造義既在實相是故造義理本具足以此理造方有事造別行玄文問緣生事造其相易知理具三千其相如何答理無所在遍在於事即世間諸法是理造之相若爾以何為事造耶曰事造亦不出此若爾二造不分曰只一十界據心而分事理之殊以由此心有起有具約心體本具諸法即指諸法無非理造之相約起心變造十界即指十界諸法是事造之相諸法是一但約此心而分事理故曰只一非事非理之三千趣事趣理之不同輔行云一一修具無非理具鑑堂云理造之相不可別求只於事上覔也二違大意金錍示珠指釋色心門心之色心引止觀大意云隨緣不變名性不變隨緣名心今言心即真如不變性也之色心即隨緣也文雖不引金錍由二文並明不變隨緣之義既違大意亦違金錍也隨緣不變名性即事之理也不變隨緣名心即理之事也他云心即不變之性直作理釋即不許荊溪立義也若云下縱釋以三法無差破之若言心法即理生佛亦然若知三法無差不可獨指心名不變性也引金錍文以顯事則俱事理則俱理既云萬法是真如則心與生佛俱理不獨指心為理既云真如是萬法則心與生佛皆隨緣事不可云生佛是事心非事也他云生佛是因果法者珠指云佛名真覺生名不覺心非因果如前引驗他所解既謂非迷非悟之真心正是指心為理他謂會生佛歸心方名事即於理須知一家圓説色心依正生佛剎塵一切諸法趣舉一法當處具足三千所以大師圓四念處六塵皆唯唯者無外之稱舉色則諸法趣色色外無法香等亦然四明云唯色之言非權唯實山外不曉雖引唯色之言克論其義只是唯心以不明諸法當處圓具須攝色歸心方具故也鈔況復觀心自具二種即唯識觀及實相觀因何才見言心便云是理又實相觀雖觀理具非清淨理乃即事之理也以依陰等顯故問若爾二觀皆依事如何分耶答實相觀者即於識心體其本寂三千宛然即空假中唯識觀者照於起心變造十界即空假中故義例云夫觀心法有理有事從理則唯達法性更無餘途從事則專照起心四性叵得亦名本末相映事理不二又應知觀於內心二觀既爾觀於外境二觀亦然此皆止觀及輔行文意非從臆説他云真心具三千法乃指真如名不思議境非指陰入也金錍云旁遮偏指清淨真如那得特偏指耶又云夫唯心之言豈唯真如心耶須知煩惱心遍第一記云專緣理性而破九界是別教義那得句句唯於真心又此標一念乃作一性真如釋之後文多就剎那明具三千亦作真如釋耶解以事理二觀破他指心為理初示觀心具事理因將此心作真理釋違背諸文況復一家所明觀心具乎二種謂唯識歷事實相觀理因何才見言心便云是理次明觀理即事而顯今雖觀理非同他見清淨真如之理即迷事而顯理也三簡二觀皆依事答釋二觀之相此二各具能觀所觀所顯之義識心是境體是於觀本寂三千所顯也照是於觀起心是境變造十界所顯也云識云起即二觀皆依事也雖皆依事今以具變而分故云本寂三千變造十界也引義例心境釋疑例云問即此文中或云諸法即是法性或云四運四性推檢何者為要答夫觀心法等文直觀本寂三千不推四運故云更無餘途用自他共離四性推檢四運起心畢竟不可得故云專照等四運局事觀四性通事理然理觀亦觀起心但投足制縱不同今縱其所起屬已未正等故云專照理觀雖通四性但推本具理心且約所起對理自具而為研核四運是所觀四性是能觀本末相映者本即理觀末謂事觀能觀皆是一心所緣莫非三諦故云相映不二者義書云須知事理不二之語得意之者隨修一觀必含二義如修理觀者雖云但觀理具須知全修在性則善修實相觀也修事觀者雖觀能造十界之心須知全性成修則善修唯識觀也豈令九旬常坐之徒皆須縱任善惡之念四運推檢耶豈令公私匇遽之徒皆須靜室觀理然後方名事理不二耶文四示外境具二觀孤山唯識觀外真如觀內直以內外二境分對事理四明立義內外皆修事理二觀內心二觀者上三三昧及諸經行法是理觀縱任三性是事觀外境二觀者觀色等諸法本具三千即理觀觀色等變造十界即事觀先輩或約外色生滅例心四運或約大經琉璃光菩薩非青現青等文殊云此光即是智慧大師謂是有分別色或云推過在心今謂內心約四運推檢者只緣此心但起慮想無色質可見故須推之若外境色法摐然在目何必推之但直觀一色變造十界即空假中即外境事觀也止觀輔行文意者結上內外各具二觀備見大師荊溪文中非任胸臆如隨自意歷六作六受即見色等豈非外境事觀耶他云等者重復結斥真心具法之謬前云心法是理能具能造驗他約真心攝於色具正指清淨真如名不思議境具足三千非指現前妄念陰入之心也傍遮等者義書云荊溪立於無情有性正謂顯圓妄染即佛性傍遮偏指清淨真如珠指正當金錍所遮云何將所遮之義為能釋之文如以毒刺損衆生之佛眼殊非金錍抉四眼之惑瞙文唯心等者義書云此則遮於世人約於真心説唯心義故云唯心之言豈唯真心應知唯字正屬唯心乃今約煩惱心説唯心不可約真如心説唯心豈非金錍本示無情有於佛性無情色與煩惱心二法俱約隨緣義説於隨緣中煩惱心為能造生死色為所造所造即理故既遍能造即理豈不遍耶文第一記者文句約教釋阿若憍陳如阿若翻無生別觀無生中云依於法界修菩提行記釋云依境起行專緣理性等謂緣佛界清淨真如而破九界自是別義今偏指真心正當此責今云總在一念以一性釋後文云三千因果不離剎那亦是真耶事理二觀義蘊經祖名出荊溪占察經云唯心識觀者所謂一切時一切處隨身口意有所作業悉當觀察等真如實觀者思惟心性無生無滅不住見聞覺知永離一切分別之相文義例引東陽大士詩云獨自精其實離聲名三觀一心融萬品荊棘叢林何處生理觀獨自作問我心中何所著推檢四運併無生千端萬纍何能縛事觀止觀上三三昧及諸經行法是理觀第四縱任三性是事觀荊溪據茲文義而立顯名義例如前引輔行二下云觀有二種一者唯識謂一切唯心二者實相謂觀真如唯識歷事真如觀理文約何義分事理孤山據經唯識觀成得色寂三昧真如觀成得心寂三昧以二觀直對二境唯被一機謂先修內心觀成以此淨心歷外諸法即名事觀此説違文背義義書破云若以唯識為外觀者唯色之觀為在於何四念處約唯識唯色分於內外非不顯然上人何得故違宗教堅令唯識為外觀耶又義例顯云事觀專照起心四性叵得那對外境文又占察二觀雙被利鈍二機若謂觀成歷於外境名事觀者是則唯有理觀之機事觀無用也又不曉義例觀成歷法之文致茲謬説義例意云修內觀成內心若淨以此淨心歷外諸法任運泯合內觀既然外觀亦爾如義書三云自有初心便宜修外觀等如後內外門引占察唯識觀成得色寂三昧等者神智圓通記云須知占察知唯是心則於色界及諸外境不起分別所以經云色寂三昧非謂事觀專觀外色真如實觀思惟心性不生不滅以能超過無色四空心及心所二俱寂滅是故經云心寂三昧非謂理觀唯在內心文此説據經深可依用淨覺亦以二觀分對二境但約三諦分事理孤山義壞淨覺例然四明云觀於內心二觀既爾觀於外境二觀亦然如前消文二觀之相先達約二義分之制縱定投足具變分事理如上三三昧制心從理而修理觀隨自意中縱任三性名修事觀初義也鈔云實相觀者體其本寂三千宛然即空假中唯識觀者照於起心變造十界即空假中義書云事理二造既其不分事理二觀因何而起文次義也逸堂約起心不起心推運不推運分之如指要觀本寂三千為理觀照起心變造十界名事觀義例從理唯達法性從事專照起心是約起不起分之也上三三昧直觀一念本具三千名理觀隨自意縱任三性用於四運推檢起心變造十界名事觀推運不推運也或云二觀皆觀起心以衆生無始未嘗離念止觀修德境云心起必託緣文此心何嘗不起今謂才言心起必有四運雖衆生日用妄心常起若修理觀直觀當念本具三千既云唯達法性體其本寂則知理觀非觀起心若云心起必託緣輔行釋云且約所起對理自具而為研核其實但推本具理心文問上三三昧既唯理觀輔行何云或唯觀理答此釋第四三昧云是隨自意中從末從事而修觀法意謂自有諸經行法一科豈亦屬事故釋云如常坐等或唯觀理此正點諸經行法而言也問既以四三昧分對事理輔行何云修三昧者於此二途一不可廢答凡修三昧人有此二向於此二途須修一種不修理觀則修事觀故云也鈔問永嘉集既用今家觀法彼奢摩他云一念即靈知自性他立正合於彼何謂不然答彼文先於根塵體其本寂作功不已知滅對遺靈知一念方得現前故知彼之一念全由妙止所顯不爾何故五念息已一念現前秪如五念何由得息那得將彼相應一念類今剎那念邪況奢摩他別用妙止安心毗鉢舍那別用妙觀安心優畢叉方乃總用止觀故出觀體中一念正是今之陰識一念也何者彼文序中先會定慧同宗法爾中乃云故即心為道可謂尋流得源矣故出觀體云秪知一念即空不空非空非不空言祇知者乃即體止也了觀也現今剎那是三諦理不須專亡根境顯其靈知亦不須深推緣生求其空寂故云秪知此乃即心為道也若奢摩他觀成顯出自性一念何用更修三觀問彼云若於相應一念起五陰者仍以二空破之那云不更修觀答於真知起陰以觀破之不起陰者何用觀之彼二空觀乃是觀陰非觀真知故知解一千從迷一萬惑若欲廣引教文驗其相違不可令盡書倦且止解永嘉大師與左溪同時嘗學天台教有集見行其間暗用天台三觀故云用今家等恐山外謬據彼文靈知自性以釋今文一念故茲料揀彼集有十大章第四奢摩他妙止第五毗鉢舍那妙觀第六優畢叉止觀彼奢摩他云得此五念停息之時名為一念相應一念者靈知之自性也文答中釋出彼文靈知一念乃是所顯與今文一念屬陰不同先於根塵等者彼云夫念非忘塵而不息塵非息念而不忘塵忘則息念而忘念息則忘塵而息忘塵而息息無能息息念而忘忘無所忘忘無所忘塵遺非對息無能息念滅非知知滅對遺一向冥寂閴爾無寄妙性天然文文中念即是根故云根塵息無能息忘無所忘故云體其本寂進修無間故云作功不已能知之念既滅所對之塵亦遺故云知滅對遺妙性天然即今靈知一念方得現前故彼靈知一念由修奢摩他妙止體其根塵本來寂滅五念停息方顯也五念者文云復次初修心人入門之後須識五念一故起二串習三接續四別生五即靜故起念者謂起心思惟世間五欲串習念者謂無心故憶忽爾思惟接續念者謂串習忽起知心馳散又不制心更復續前思惟不住別生念者謂覺知前念是散亂即生慚愧改悔之心即靜念者謂初坐時更不思惟世間善惡及無記等事即此作功故云即靜四念為病即靜為藥雖復藥病有殊總束俱名為念得此五念停息之時名為一念相應一念者靈知之自性也文斥彼謬據並難之非故云那得等也別用妙止者以彼所明止觀二法有於總別別則先止次觀總則止觀雙修對優畢叉總用故云別也對散用止對昏用觀總用止觀是彼正意故前云況次云方乃也出觀體中一念乃指摘彼文觀體中之一念恰與今文陰識一念是同彼第六優畢叉中十門初則言其法爾次則出其觀體定慧同宗者彼序云夫定亂分歧動靜之源莫二愚慧乖路明暗之本非殊至暗動之本無差靜明由茲合道愚亂之源非異定慧於是同宗文定即是止慧即是觀同宗即總用止觀也法爾者注云今古常然名為法爾謂真如之法法爾隨緣萬法俱興法爾歸性本自如斯故云法爾文即心為道者彼云一心深廣難思何出要而非路是以即心為道者可謂尋流而得源矣文即心為道鈔文自釋以妙觀體了一心是三諦理也立觀體者即文云第二出其觀體者只知一念即空不空非空非不空文立三觀之體也祇知者今釋即是用於止觀體了見前一念是三諦理故云即空等體了即能觀剎那是所觀三諦是所顯兩重能所蘊乎其中不須等者異奢摩他亡根境也彼一念對塵即是根境塵念俱忘靈知斯顯彼云忘緣之後寂寂靈知之性歷歷文深推等者亦不同毗鉢舍那也彼云一切諸法悉假因緣因緣所生皆無自性一法既爾萬法皆然境智相從于何不寂文此即推緣生求空寂也謂唯用止觀體了一念是三諦理故云只知等即法爾中即心為道之義也然若奢摩他中塵念俱忘顯出自性靈知相應一念則不須優畢叉中更修三觀因茲並難彼奢摩他既云此五陰者舉體即是一念此一念者舉體全是五陰歷歷見此一念之中無有主宰即人空慧見如幻化即法空慧文是則仍修二空之觀破其五陰何云不修觀耶答於相應一念起陰用觀破之不起則何須修觀況彼二空正是觀陰非是觀真初亦無妨故知下總結斥由不知一念是妄才見言心便云是理故於諸文觸途成礙矣鈔二違義者問據上所引衆教雖見相違且如立此十門欲通妙理亡於名相若一念屬事豈但通事將不違作者意乎答立門近要則妙理可通若敻指真如初心如何造趣依何起觀邪今立根塵一剎那心本具三千即空假中稱此觀之即能成就十種妙法豈但解知而已如此方稱作者之意若也偏指清淨真如偏唯真心則杜初心入路但滋名相之境故第一記云本雖久遠圓頓雖實第一義雖理望觀屬事他謂圓談法性便是觀心為害非少今問一念真知為已顯悟為現在迷若已顯悟不須修觀十乘觀法將何用邪若現在迷全體是陰故金錍云諸佛悟理衆生在事既其在事何名真淨然誰不知全體是清其奈濁成本有應知觀心大似澄水若水已清何須更澄若水未清須澄濁水故輔行釋以識心為妙境云今文妙觀觀之令成妙境境方稱理又解安於世諦云以正觀安故世諦方成不思議境故知心雖本妙觀未成時且名陰入為成妙故用觀體之若撥棄陰心自觀真性正當偏指清淨真如之責復招緣理斷九之譏且如今欲觀心為今剎那便具三千為須真知體顯方具三千若即剎那何不便名陰心為於妙境而須止真心邪又大師親令觀於陰等諸境及觀一念無明之心何違教邪應是宗師立名詮法未的故自別立邪又若謂此中一念不同止觀所觀陰等諸心者此之十門因何重述觀法大體觀行可識斯言謾設也又中諦一實別判屬心與總真心如何揀邪解假設問辭以理難事意在答出即事通理以顯專理則違義問中先領上違文次設難難意立此十門意令學者從門入理不滯名言今釋一念既屬於事莫違述作元意乎初總答初二句明觀妄之得正約一念近而復要即陰妄而通妙理也次三句明觀真之失若遠指佛界真如為所通初心何能造入抑亦觀無所託矣次今立下別答至作者之意廣上總中觀妄之得今文正意乃是趣舉根塵和合一剎那心當處具足三千三諦稱性而觀即能成就玄文因果自他十妙法相即以易通難之義若云十門通於妙理亡名離相但是開解荊溪述意為成妙行豈但解耶即妄顯真方稱述作之意若也至名相之境廣上總中觀真之失敻指真心而為所觀正同偏指真如唯於真心則杜絶衆生入理之門起觀之處但滋名相耳故第下引證理觀為要若以一念為真則不須修觀如云攬玄文教義歸止觀行心俾乎行者識法相之有歸達修造之無壅此但解知而已今立根塵一念為境妙觀觀之顯此十妙故知觀心為要文句四釋消經前之三釋望後觀心並屬事境妙樂釋疏因緣約教本迹觀心四釋文意云本雖久遠本迹圓頓雖實約教第一義雖理因緣中世界為人對治並事第一義屬理望觀屬事三釋望觀心並屬事他謂下舉妄毀觀心結斥蓋有宋景德年間光明玄廣略二本並行於世慈光恩師製記曰發揮專解略本廢廣本十法觀心之文謂後人擅添清昭已下皆承其説謂十種三法是圓談法性不須觀心義書斥曰若剛廢此文則杜衆生入理之門趨果之路全迷一家解行之要故今云為害非少也今問下徵問一念為迷為悟初二句定若已下核問金錍下引證衆生在事既其在事則一念屬妄何名真耶然誰下約譬顯染淨門云清濁雖即由緣而濁成本有濁喻迷中染心清喻果後淨心從來未悟故濁在前以驗此心是妄輔行下重引證觀妄顯真以識心為境如輔行五中初云前雖示體但直指心心為一切法之本故示體是心至是故今文妙觀觀之令成妙境境方稱理文此以前簡示境體一念識心為不思議境正是達陰成不思議也安住世諦如前釋故知下示觀妄意心雖本妙合全體是清觀未成時全體是迷須名陰妄今為成就妙法故用妙觀體之若撥下結斥成失既其棄妄觀真正當今錍傍遮之責復招妙樂專緣理性而破九界之譏且如下以今文止觀皆觀陰入徵斥只問今欲觀心為現今剎那妄陰即具三千為須顯悟真理方具若即妄示真正是以識心為妙何須別立真心又天台説止觀親令行人觀現前陰入并所發下之九境及四念處節節皆云觀一念無明心何得固違宗教別立真心恐是祖師立陰等名詮示行法未為的當而自立耶又若等者為防轉計若謂今文一念不同止觀陰等諸境猶更不可重述十門令觀行可識觀法大體行正解傍與止觀同成觀體等言皆成虗設矣又中等者以他立義反難於他彼謂理總事別今別分色心中諦一實諦體唯是理別屬於心今問此別中真心與總真心如何揀異若云是異皆是真心若云是同則總別不分況別判屬心正當理別何謂理中無別耶鈔心性二字不異而異既言不變隨緣名心即理之事也隨緣不變名性即事之理也今欲於事顯理故雙舉之例此合云不變隨緣名佛隨緣不變名性生性亦然應知三法俱事俱理不同他解心則約理為通生佛約事為別此乃他家解心佛衆生之義不深本教濫用他宗妨害既多旨趣安在解釋無非心性心性二字通迷通悟楞嚴云常住真心性淨明體屬悟也義書云專是凡夫一念陰識之性矣在迷也今云心性不異而異事理相即故不異性屬不變之理心是隨緣之事而異也大意云不變隨緣名心乃即理之事隨緣不變名性乃即事之理今文雙舉欲就事顯理故也次以此心例彼生佛俱是即不變之隨緣皆即理之事亦應不變隨緣名佛名生故云亦然應知一家所論心佛衆生事則俱事理則俱理不同等者結斥山外濫用他宗華嚴大疏以心性為理為能造生佛是事是所造此是他宗解心佛衆生三無差別之義慈光不深台教兼講華嚴濫用此義妨害今家三法各具事理二造之旨鈔一性等者性雖是一而無定一之性故使三千色心相相宛爾此則從無住本立一切法應知若理若事皆有此義故第七記釋此文云理則性德緣了事則修德三因迷則三道流轉悟則果中勝用如此四重並由迷中實相而立今釋曰迷中實相即無住本乃今文一性無性也上之四重即立一切法乃今文三千宛然也第一重既以性德緣了為一切法須以正因為無住本餘之三重既將逆順二修為一切法必以性德三因為無住本此即理事兩重總別也問既以迷中實相為一性對三千為別正當以理為總何苦破他答以三千法同一性故隨緣為萬法時趣舉一法總攝一切也衆生無始全體在迷若唯論真性為總何能事事具攝諸法而專舉一念者別從近要立觀慧之境也若示一念總攝諸法則顯諸法同一真性故釋籤云俗即百界千如真則同居一念須知同一性故方能同居一念故以同居一念用顯同一真性非謂便將一念名為真諦豈同居一塵非真諦邪今文以一性為總前後文以一念為總蓋理事相顯也此之二句正出攝別入總之所以也由一性無性立理事三千故故兩重三千同居一念也豈同他釋直以一念名真性耶解釋後二句初文性雖至宛然是正釋一性即性體也無定性乃性計之性也以性有二真常不變隨緣染習上云一性不變性也下云無性染習性也謂此性體雖是真常一理而其性融妙不決定亦是三德祕藏無堅住性也故此妙性具足三千次會同本法今文一性無性即無住本三千宛然即所立法應知理事三千各有本法故云皆有引第七記四句立法因疏釋經一相一味云一相即無住本立一切法無住無相即無差別立一切法即有差別文記釋云一相即無住本立一切法理則性德緣了事則修德三因等此之四句即是兩重立法初云理則性德緣了性德正因為本性德緣了為所立法事則修德三因順修迷則三道流轉逆修悟則果上勝用亦屬順修從因至果果必化他故云勝用次三重皆以性德三因為無住本四句立法皆本經疏如下委辨今釋等者會釋今文彼云四重並由迷中實相而立即無住本且前三重可得由迷第四果用亦從迷立耶曰果由因克故亦由迷理以果地融通並由理本上之四重不出理事三千各有本法修有逆順因必克果故有四重此即下會同事理總別者初以性中正因為本即理總性德緣了為所立法即理別次以性德三因為本即事總逆順二修為所立法即事別今問次重既云性德何名為事既云三因安得目總答雖云性德全體在迷雖曰三因只一實相故云並由迷中實相而立若爾初重正因亦是迷中實相那云理總答正由若事若理皆以事念為總其義宛齊問答去料揀事理初約性本同理總問既將本法會釋今文迷中實相乃今文一性無性則一性是總三千是別一性既是實相正當理總答謂諸法性同俱得為總今為成觀從要指心以三千色心同一真常不變之性全不變性隨緣變造諸法諸法既同一性故趣舉一法總舉一切衆生從本已來未曾離念須就迷點示若以真理為總何能諸法互攝故今專指一念是於諸法中別就近而復要立乎觀境既知一念總攝方顯同一真性乃即妄而顯真故引籤文證今一念為總彼文因明七二諦境初約跨節意存略而示故云但點法性為真諦無明十二因緣為俗諦於義即足籤釋云唯一法性以對無明至只點一法二諦宛然俗即百界千如真則同居一念文帖今文意百界千如乃今文三千宛然也同居一念乃今文一性無性也功由諸法同一真性故得同居一念之總今以事顯理達妄成真故以一念用顯一真山外何得作真理釋須知圓詮諸法互攝互具今為成觀故的指心且云同居一念若同居一塵豈非真邪今文下結示初後點文意前云總在一念後云寧乖一念前後文也一性是理一念指事即事之理故云一性即理之事故云一念即相顯也此一性無性三千宛然二句正明所以由於從總立法故得攝別入總也無住本諸大乘經出處非一文義最顯莫若淨名經中卷觀衆生品文殊問淨名曰善不善孰為本答曰身為本見一切住地又問身孰為本答曰欲貪為本欲愛住地又問欲貪孰為本答曰虗妄分別為本色愛住地又問虗妄分別孰為本答曰顛倒想為本無色愛住地又問顛倒想孰為本答曰無住為本無明住地又問無住孰為本答曰無住則無本文殊師利從無住本立一切法文楞嚴第七佛語阿難本此無住建立世界及諸衆生文大師不見法華藥草喻品一相一味亦其義也天台引用一如妙玄約理事明本迹二如文句釋經一相一味三如文句釋方便品十雙權實初約理事四如光明玄逆順兩番生起無住本義四明約無堅住義釋捨遺記上云都由三德祕密法性無堅住性是故大聖以此法性無住為本文別行玄記下云以本覺性元離住著即無住本指要云性雖是一而無定一之性文淨覺義編云有云無住本者謂性不定住也真如非寂非照而寂而照是性不定住無明體空立一切法亦是性不定住此釋無據蓋未看本疏也疏解無住則無本云無明依法性法性即無明無二無別豈得性還依性當知無明則無本又解無住義云即無始無明也以身見等惑皆有所依而起起則有始此無所依起亦無始故云無始無明即是無住以此明之無住是無依義何嘗云性不定住耶文破四明無據自憑本疏是無依義今謂疏約無依義釋經無住則無本何得錯引以釋無住本耶四明無堅住義深得荊溪文意妙樂云此無住本具如釋籤第七已釋籤云法性即無明法性無住處無明即法性無明無住處無明法性雖皆無住而與一切法作本文妙樂云無住即本名無住本文次辨四句立法妙樂因釋疏一相即無住本立一切法云理則性德緣了事則修德三因迷則三道流轉悟則果中勝用如此四重並由迷中實相而立文荊溪立此四句正得經疏元意理性本法即經云一相至寂滅相疏釋云衆生心性即是性德解脫遠離寂滅三種之相修德三因即經云一味疏釋云如來一音説此三法即是三味此三相則為境界緣生中道之行記云由佛説故此性可修重指性三以為修境三道流轉即疏云性德只是本有三道解脫相者即是業道解脫德離相者即是煩惱道般若德寂滅相者即是苦道法身德果中勝用即經云究竟至于一切種智疏云終則得為一切智果經疏但云自行證果既有自證後必化他故云勝用又符圓詮教旨初重為彰性德本具故以正因為本緣了為所立法即理具三千次重為彰全性起修故以性三為本修三為所立法即全體起用變造三千也指要引此會釋一性無性三千宛然者蓋為他師指心為理生佛是事理唯是總事唯是別故特引修性各有本法以顯事理皆有總別也又四明直作兩重而用如云第一重既以性德緣了為所立法須以正因為無住本餘之三重即將逆順二修為所立法必以性德三因為無住本文初重約性中三法自分次重約修性相對淨覺不許雜編云近人持論多任胸臆無住差乎一性立法謬於二修本末相紛源流一混又云初重可爾餘三不然他意謂餘之三重是離三法門既將修德三因為所立法必以性德三因各相主對為無住本斯乃不知修性離合之旨何者約性雖離對修須合由性中了因未曾發心緣因未曾加行同名正因修中正因即了因所照緣因所嚴只是無住本耳記云事則修德三因對本兼舉也例如智者解無量義經從一法生四果荊溪云圓佛為一而生三權能所相對故云四佛今亦如是正因為本而生緣了修性相對故云三因又修性不二門云修雖見九九只是三例今修雖具三三只是一文淨覺意謂無住只是一性立法但可二修若判餘三重以性三為本即是以二修差雜一性故云無性差乎一性修三為所立法即以一性謬亂二修故云立法謬於二修以修差法故末紛於本以性謬修故本紛於末故云本末相紛今謂四重立法是荊溪本經疏元意既將三因三道為所立法必以性三為無住本若破四明即破荊溪也約性恆開對修方合是性種三道敵對三德對卻類種合性三為一即修性相形義今文是修性各三法相修性相對義何得妄破四明不知修性離合耶又若謂修德三因是對本兼舉者三道流轉亦應爾邪淨覺立義皆為不善圓實教中修性法體各具三法未嘗聞性但正因修但緣了進不成圓退不成別也會光明玄十種三法逆順兩番生起初約施教逆推理顯由事是逆生起次約立行造修反妄歸真是順生起初從法性無住本立一切教法二從無明無住本立一切行法以四句會之拾遺記云今之初番是彼第四果中勝用今之次番是彼第二修德三因文淨覺謂十種三法中三因佛性即初二兩句正因佛性本具二修即性德緣了緣了二修共發一性即修德三因逆順兩番生起即三四二句無明為本立十種三法即三道流轉句法性為本立十種三法即果中勝用句如此會釋本法顛亂何得於十種中特取三因分折對當初之二句其餘九重何不對耶二從無明無住立一切行法乃立行造修是順生起何云三道流轉耶會兩重總別指要云第一重性德緣了為所立法須以正因為本餘三重以逆順二修為所立法必以性三為本此即理事兩重總別也文舊問兩重之本並屬於理兩重之總並在於事又次重本法性三為本兩重之總並是一念事理不同三一有異如何會同北峰云兩重總別就法故並以事念為總兩重本法推功故並以理性為本何者兩重總別並由一性故能總在一念就法在迷在事以事為總推功歸性亦得以理為總故四明云今文以一性為總事理相顯也兩重立法雖推功由理以理為本既以實相在於迷中當知就法亦得以事為本夫如是則從總別推功與本法齊從本法在事與總別等問淨名疏云法性即無明無二無別當知無明無本籤云法性即無明法性復以無明為本文淨名即故無本籤云即故為本何耶答淨名疏釋無住則無本籤釋無住本故法性無明相即互得為本問妙樂明四句立法之後云具如釋籤第七已釋且籤文無四句立法何虗指耶答正指釋無住本義非指四句立法也二當知下就理事明諦境二初約理事明三諦二初明理事當知心之色心即心名變變名為造造謂體用解大科就理事明諦境者前明總別未分事理今明事理俱有總別初約事理明三諦者理具事造咸空假中故先明理事次結三諦也初言心者能具剎那之心即理總也色心者所具三千即理別也即心者即上能具三千剎那之心事總也名變者即事造三千事別也變名為造者此變亦名為造隨緣變造非搆造也此即事理兩重總別此之變造乃全體之用故云造謂體用鈔心之色心者即事明理具也初言心者趣舉剎那也之者語助也色心者性德三千也圓家明性既非但理乃具三千之性也此性圓融遍入同居剎那心中此心之色心乃秪心是三千色心如物之八相更無前後即同止觀心具之義亦向心性之義三千色心一不可改故名為性此一句約理明總別本具三千為別剎那一念為總以三千同一性故故總在一念也解先正釋次料簡初又三初釋初句理具總別心之至念也初句牒文即事明具總標也即事標心字理具標色心初言下釋圓家下出意圓論性德非別教但中之理具法之性也圓融遍入者無一法偏謂之圓無一法異謂之融法法周遍法法互入只由諸法性體圓融互遍互入故同居剎那也此心下絶能所上明色心諸法同居一心謂有能具所具今絶此計故云只能具心即是所具三千色心如彼八相遷物不分前後相在物前物在相前則不被遷只物論相遷只遷相論物謂無前後是故云祗具如止觀不思議境止觀心具正指妙境文也止觀云一念即三千三千即一念一念不在前三千不在後文八相者大小各四謂生住異滅輔行釋云相為能遷物為所遷俱舍云此謂生生等於八一有能謂本四相及隨四相名之為八大相為本小相為隨以此八故令一切法成有為相言生生者謂小生生大生於八一有能者謂小相於一有能能生大相大相於八有能謂一大相起時必與三大相及小四相俱起并一本法故云八相餘三大相亦復如是故此八相望於本法不前不後心具三千亦復如是三千如八相一心如本法文亦向心性指上無非心性此三千色心在因在果不可改變故名性德此一下結成總別此理總別亦事念為總鈔即心名變等者即上具三千之心隨權淨緣不變而變非造而造能成修中三千事相變雖兼別造雖通四今即具心名變此變名造則性屬圓不通三教此二句則事中總別變造三千為別剎那一念為總亦以三千同一性故故咸趣一念也解釋即心名變名事總別即心名變者牒文即上下釋即心也即上來具德剎那之心隨染下釋變造文謂真如不變之性能隨染淨二緣變造十界諸法不變等者全性變造故云不變非造變雖下釋變造義金錍云變義唯二故云兼別造通於四藏通論業惑搆造造變雖通具義則局以通從局即具名變變亦名造三義俱圓也此二下結成事中總別鈔造謂體用者指上變造即全體起用故因前心具色心隨緣變造修中色心乃以性中三千為體修起三千為用則全理體起于事用方是圓教隨緣之義故輔行云心造有二種一者約理造即是具二者約事乃明三世凡聖變造即結云皆由理具方有事用此文還合彼不解釋造謂體用初句牒文指上至起用者總標故因下釋因前心具色心指上理具隨緣變造修中色心指上事造乃以下二句釋今體用則全下二句釋出全體起用即不變隨緣方成圓教隨緣之義引文證同者一者約理同今心之色心二者約事同今即心名變等皆由理具方有事用同今造謂體用二文若合符節矣鈔問變名本出楞伽彼云不思議熏不思議變故造名本出華嚴彼云造種種五陰故華嚴唯有二教楞伽合具四教何故金錍云變義唯二造通於四答部中具教多少雖爾今約字義通局不同何者大凡云變多約當體改轉得名故變名則局若論造者乃有轉變之造亦有搆集之造故造名則通別圓皆有中實之性是故二教指變為造藏通既無中實之體但明業惑搆造諸法不云變也大乘唯心小乘由心故云變則唯二造則通四解簡變造所出用與所出謂二經用與如金錍正約部中具教多少以難不思議熏理具也如云真如內熏輔行云真如常熏內具亦云舊熏不思議變即事造楞伽部屬方等故具四教金錍云變義唯二今云等者等上熏義答中謂不約部中具教多少以論乃約字義通局而説先釋變義變謂轉變由中道實性妙不決定故受熏變當體改轉義也此義唯局別圓次出造義有二轉變搆集別圓同詮中道實性當體改轉名造此釋轉變名造藏通灰斷不談常住故云無中實體但明見思煩惱潤有漏業搆六凡生死非轉變造此釋搆集造也金錍云藏通造六業惑造也別圓造十轉變造也唯心結上轉變由心結上搆集大乘所説諸法唯心故論轉變小乘由業力造造遍三界故云搆集鈔問他云造謂體同及改此文二十來字而云收得舊本又云勘契多同今何違舊答舊本諸文全無錯邪應是荊溪親書本邪又多本同者止如杭州十藏中台教頃曾略讀錯字不少豈非初將一本寫之一本或錯十處皆訛又云日本傳來別行十門題云國清止觀和尚録出亦云體同等者未審止觀和尚又是誰耶此人深諳一家教不始録之本全不錯不豈以先死之人遵之為古所立之事皆可依耶如乾淑所録邃和尚止觀中異義乃以三界為無漏總中之三可盡遵不況諸異義特違輔行自立己見故皆云記文易見和尚云云此師又稱第七祖故知止觀和尚多是此師若其是者則全不可依既暗荊溪深旨必有改易也又日本教乘脫誤亦多唯有別行十不二門則全同他所定之本他既曾附示珠指往於彼國必是依之勘寫爾設是舊本須將義勘莫可專文解簡謬本改字違文示珠指云有別行本云造謂體用者近人謬故也或者意云造是體之用而不知此文正示色心全真如變色心不異本性故云體同及改二十來字者下文多一差字內外門除兩假字改終自炳然為終日炳然修性門藉智起修為藉知曰修一期為其字因果門三千並常為三身並常染淨門除二與字自他門形事不通為未通三業門若信因果除因果二字此皆示珠指據舊本改除也以舊本多同為問先答舊不可依次答多本同者錯字亦多日本傳來等者亦契勘多同中義故亦云體同也國清等者淨覺雜録名義云唐貞觀十一年有日本僧最澄乃天台道邃門人邃即荊溪弟子澄初傳教歸國以道邃為始祖封山曰天台造等曰國清自是教法大行於彼今云止觀和尚即邃師也乾淑僧名有文集抄録邃師所釋止觀異義邃師暗於止觀之義多有異見與荊溪所釋相違如釋止觀無漏總中三謂於三界有漏法上證於無漏止觀一明漸次止觀云先修歸戒翻邪向正止火血刀達三善道次修禪定止欲散網達色無色定道次修無漏止三界獄達涅槃道次修慈悲止於自證達菩薩道後修實相止二邊偏達常住道輔行云此中番數但有五重義則十三初番有六謂三善三惡第三番四謂兩教二乘并前六義合為十也餘三不開合為十三於十三中實相是所緣之境望頓是同不應數為不同之限文止觀下文料揀三種止觀騰疑者云教境名同相頓爾異釋曰然同而不同漸次有六善惡各三無漏總中三凡十二不同從多而言故言不定輔行云兩教二乘是無漏四而今乃云無漏總中三者何耶別而言之離為四人若總名無漏則合郤三人但存一位今舉總合開一中兼三故名無漏總中三也若沒本位離而為四并善惡各三及以禪定慈悲各一故成十二文和尚云云者乾淑所録異義甚多今不煩引故此指之稱第七祖者謂天台已下至邃師當第七也設如所言收得舊本須以義勘豈可專文而害於義鈔問文縱難定義復相違何者此文攝別入總合云變造體同若云從體起用還是開總出別既失不二之義便無開會之功也答若得前之總別意者則是不執舊訛文也豈理體唯總事用唯別如常坐中修實相觀既云唯觀理具文中廣辨三千還有總別不若無者那云一心具三千邪隨自意中修唯識觀觀於起心即約變造事用而説還有總別不若無那云一切法趣檀等那云觀一念善惡心起十界邪豈隨自意三昧非不二開會觀耶應知立茲體用欲於理體及以事用皆明三諦事用若即空假中還成不二圓妙不既於理事兩重總別皆顯絶妙那將攝別入總而為難邪又夫開顯乃示法法皆妙若知即具而變用豈不妙耶解揀謬釋從訛暗義初依謬立難此文攝別入總者他不明事理各有總別乃指前別為歷境顯示別相從即知下為攝別入總正示歸宗從當知下為結顯不二故云此文攝別入總也只由他謂理總事別故攝別入總是攝事歸理也合云變造之事與理體同若云從體起用還成開理總而出事別他謂體同等文正是結顯不二故云則失結顯不二之義他云今文變造體同唯約法華圓門開顯以同示體令曉變造色心性常不二故云若作從體起用則無開會之功也二據正決答初總示正斥邪若得前文正釋總別之意謂理具事用各有總別也豈理唯總事唯別耶如常下徵事理總別文義正指下文不思議境以下十乘名通四行常坐居首故先言之唯觀理具者荊溪云實相觀理廣辨三千正是不思議境一心是總三千是別理中總別也隨自意乃五略修大行縱任三性推四運心即唯識觀歷諸善中不出六度一切法是別趣檀是總等謂餘五度也止觀云一切法趣檀成摩訶衍是菩薩四運又一念是總十界是別四種三三昧妙行皆依法華絶待妙義而為觀體豈非不二開會觀耶應知下彰事理總別皆妙應知今明理事總別欲於體用結成三諦故下文云非色非心等法法皆妙者正示事造諸法全具而變理具既妙事變亦然鈔問他云之猶往也即全真心往趣色心則全理作事此義如何答非唯消文不婉抑亦立理全乖何者心不往時遂不具色心耶又與心變義同正招從心生法之過況直云心是真理者即乖金錍釋心既云不變隨緣名心何得直云真理又造謂體用方順文勢如何以同釋造解簡謬執訓釋乖理他云等者珠指云之往也非助語也謂全性往趣故云之色心爾雅云之者往也般若云一切法趣色是趣不過文答中初斥消文立理俱非若云真心往趣殊非性德本具次斥義同生法心之色心正明理具若云往趣卻與即心名變義同全同別教從心生法則四性計中墮自性過次斥指心為理公違大意金錍不變隨緣之義金錍云萬法是真如由不變故故知諸法皆理何獨指心為理如前已明今但云即乖彼文不變隨緣名心乃即理而事何得直作理釋又造下重破體同之謬以全體起用名造謂體用文方宛順鈔問若真心往作色心有從心生法之過者文云即心名變亦有此過邪答不明剎那具德唯執真心變作灼然須招斯過今先明心具色心方論隨緣變造乃是全性起修作而無作何過之有解揀心變對謬顯正問中牒前生法以難心變初至過者牒前真心往趣義同生法次文云至過耶並難即心名變亦應招過答中約心變異性具通難初順問答謂若不明具單云心變豈免斯過今先下違問答今既先云心之色心即是理具次云心變是隨緣變造全具而變全性起修何過之有鈔問即心名變此心為理事邪若理者上約隨緣名心若事者乃成事作於事那言全理起事答止觀指陰入心能造一切而云全理成事者蓋由此心本具三千方能變造既云心之色心已顯此心本具三千今即此心變造乃是約具名變既非但理變造自異別教也解揀即心名變全理成事答中以止觀例顯今文蓋由此心本具三千方能變造即並由理具方有事用也今既先明心之色心已顯心具次云心變即全具而變既非等者以由變造義通別圓復須此揀既全具而變不同別教但中之理隨染緣造九界也二是則下結成三諦者是則非色非心而色而心唯色唯心良由於此解結成三諦結上事理總別無非妙三諦也鈔上之事理三千皆以剎那心法為總心空故事理諸法皆空即非色非心也心假故事理諸法皆假即而色而心也心中故事理諸法皆中即唯色唯心也故輔行云並由理具方有事用今欲修觀但觀理具俱破俱立俱是法界任運攝得權實所現言良由於此者即由心之色心故理也即心名變故事也全體起用故理事合也方能一空一切空一假一切假一中一切中也他解此文分擘對當大義全失仍不許對三諦而云此中未論修觀故設未修觀立諦何妨況此色心本是諦境更有人互對三諦云得圓意蓋不足言也解初正釋上云心之色心即心名變心及即心豈非剎那為總色心即理具三千變造即事用三千非色非心破也而色而心立也唯色唯心法界絶待也引輔行文初二句證事理三千俱破等證結成三諦只觀性具三千任運攝得事造三世變造是九界實造聖人變化是佛界權造權實皆事猶同示現俱破等者若云三千俱破是空俱立是假法界是中即名隨德用若云三諦俱彰蕩相故云俱破三諦俱彰立法故云俱立三諦皆顯絶待故俱法界即體一互融一空一切空等可見他解下斥謬珠指云非色非心顯上心性也上云一切諸法無非心性而色而心顯上之色心唯色唯心顯上體同唯心不二也文不許對諦彼云有人用對三觀三諦非色非心對空真而色而心對俗假唯色唯心對中今謂此是圓法若隨自意何法不通豈止三觀諦耶此門本依諸諦境立既攝別入總以明色心唯顯色心不二至內外門對境明智方辨觀智文互對者昱師注文云淨光大師點讀云非色非心真諦也而色而心俗諦也唯色唯心中諦也豫之書曰非色非心中諦也而色而心俗諦也唯色唯心真諦也一家妙旨三諦讀經愚今注曰是相如色即真諦如是相色即俗諦相如是色即中諦一如三諦等乃至不縱不橫不並不別如斯消釋奇哉暢哉快樂哉何法華三昧之遠乎旋陀羅尼之異耶文故斥云云得圓意蓋不足言二故知下會生佛居一念故知但識一念遍見己他生佛他生他佛尚與心同況己心生佛寧乖一念解理事三千全心本具即具而變全體之用故知但了見前剎那為諸法總則能遍見理事三千己他生佛者九界為生極果為佛心具十界名己生佛生佛各具十界名他生佛以他況己謂生佛三千之高廣尚與心同況近在自心之所具寧乖一念鈔己生佛者心法三千他生佛者佛法衆生法並名為他各具三千三千不出生佛也以理攝事同趣我心蓋心之具故即心變故全體用故故識一念即能遍見也解釋云以理攝事謂理具攝得事造既全理成事理既舉一全收故使事中同趣一念此釋但識一念遍見己他生佛三故彼下結不二故彼彼境法差差而不差解結上不二彼彼等者己他生佛之境迷悟高下之別既同一心故云差而不差也鈔可見他云此本多一差字存略無妨不須苦諍解他云者珠指云有別行本多一差字亦近人添也文四明意謂存略無在
