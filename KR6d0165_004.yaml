body:
  text: 唐荊溪尊者釋籤宋四明尊者鈔宋武林沙門可度詳解明天台後學正謐分會二內外不二門三初標二內外不二門者智行鈔正約三法立內外境也衆生諸佛及以依報名為外境自己心法名為內境故觀音玄義立所觀境有二所謂自他他者謂衆生佛自者即心而具乃引華嚴心如工𦘕師等為證有人立佛界為內九界為外乃引此經或說己事或說他事證之而不知彼明果後垂迹乃以佛界為己九界為他今論初心觀所依境既未成佛安用佛為己耶據觀音玄方為允愜問前引大部揀於佛法太高衆生太廣今何取之答辨其難易故且揀之若論機入不同故須雙列復為顯其妙義必須內外互融隨觀一境皆能遍攝故名不二此之不二悉得稱門泛論雖爾一家觀法多用內心妙義為門也解釋初標分三初釋內外二復為下釋不二三此之下釋門初又三初正釋正約下一句標起衆生下釋出生佛該十界正報及依報兼自他依報亦屬於外唯取自己一念心法為內引證如玄上云此境復為二所謂自他等如今引記云一家明觀不出二境四念處心對色陰而分內外此文心對生佛而分自他十不二門以心對彼依正色心而分內外則依報生佛及己色陰皆名為外荊溪特會兩處之文立外境也文觀音玄明菩薩所觀之境不出十界故約三法而分自他念處所觀身受心法不出五陰故以色心而分內外此門以心為內依報生佛及自己色陰亦屬於外特會二文者念處但以己色為外不言生佛觀音玄但言生佛為外不及自色今文既云依正色心則生佛依正及自己色皆屬於外故知荊溪特會二文立外境也內境則二文皆是內心故不俟言二有人下斥謬昱師注云九法界即外境也佛法界即內境也文三問下料揀機入不同者下界衆生心粗散故多著外色宜觀內心上界衆生味禪定故多著內心宜觀外色有此二機故雙列二境復為等者即以略顯廣之意此門從智行二妙而立倘內外不融則不成妙內外融攝妙義方彰釋門中先釋今文泛論下的示今意義書云但不二門都為示於觀法大體以今家觀法正在內心傍託外境以捨傍取正所以特取內心為總文一家觀法揀難從易多明觀心也內外二境義書云只一非內非外之三千隨乎觀慧趣內趣外之不同一家境觀近而復要雖多就內心蓋機緣不同自有宜於外境修觀者故須雙列故不二門云凡所觀境不出內外云云四念處四云衆生有兩種一者多著外色少著內識二者少著外色多著內識如上界多著內識下界著外色多內識少文別行玄上云此境復為二所謂自他等如前記上云一家明觀至立外境如前引荊溪特會兩處之文立外境如上略示若論二境被機者義書三云修內觀時先用圓解攬於萬法唯心然後觀心若宜修外觀先攬萬法唯色而觀於色文此得天台唯色唯心荊溪一念具足一塵不虧等諸圓文旨豈同孤山獨頭之色不具三千等又義書云且內外境略以四義論之自有推過在心故先於內心修觀伏斷五住則以伏斷淨心歷彼色等諸法任運自見一一法具三千三諦則不論於外境修觀此如義例必先內心內心若淨以此淨心遍歷諸法任運泯合亦即止觀識陰觀成遍歷界入依正一一皆結三諦也自有內外兼修如方等懺儀正修內觀若對外境乃用內心正觀之法傍歷尊容道具皆成三昧也自有正約內心修觀不入乃捨內境專修外觀如破法遍文後例餘陰界入修圓破遍既例破遍亦例十乘但文在破遍中示爾此則外色若淨將此淨色歷一切法及以內心任運泯合也自有初心便宜修外觀如先得色無色定若發心修圓頓止觀此人已著內心重故須以外觀破之於外色等觀成理顯還將淨色歷一切法及以內心任運泯合也此如四念處唯色唯識二種觀法被二根機也文雖具四義不出內外二境也孤山淨覺之說不暇評破二凡所下依門釋二初明內外境觀二初標示者凡所觀境不出內外解凡所下科標示者初句標次句示鈔大小乘中所明觀法二境收盡故云不出今非偏小也解釋標示云大小等者四教之機能觀觀智隨教詮示析體漸頓不同若所觀境初無有異故云不出內外今明圓人所觀揀非偏小二外謂下釋相二初明外境觀相外謂託彼依正色心即空假中即空假中妙故色心體絶唯一實性無空假中色心宛然豁同真淨無復衆生七方便異不見國土淨穢差品而帝網依正終自炳然解別明外境觀相的論修觀多在內心今被二機內外雙列隨標語便先明外境初句正立外境即空假中去是能觀三觀亡照色心宛然下明觀成理顯託者依也文從通總但云依正色心其實生佛色心及以依報與自己色陰皆名為外也彼字正指外境色心體絶是亡所觀無空假中是泯能觀境觀雙亡三千理顯故云色心宛然等是則正報無非遮那法身豈有七方便衆生之異依報無非寂光更無下三土淨穢之殊而色心相入依正互融如帝網珠交相輝映故云炳然義書云依正若不互具互攝豈可如帝網耶文鈔言託者依也彼者既以內心為自乃指依報及生佛色心為彼此乃正立外境即空假中去即是妙觀及觀成相於依等四隨託一境皆以圓融三觀觀之此觀既妙故令陰入染體泯淨即前依正等全為妙體一實圓理故云體絶及一實等所觀陰境既絶能觀妙觀亦寂則病去藥亡能所雙絶故云無空假中於雙絶之處融妙三千一時顯現豁然同皆真淨法法皆實故真皆非染礙故淨故云宛然等如是則一切衆生皆毗盧體一切國土悉常寂光有何定法名三五七九及淨穢耶故云無復至差品也而彼彼三千圓融互入猶因陀羅網終自炳然即是外觀功成之相觀行已上至於妙覺節節無非如此顯發不爾安云發心畢竟二不別耶解釋分二初正釋言託至別耶初句釋託字託有表託如王舍耆山輔行云歷事觀法結云託事見理今文不同前二乃依託之託彼者下釋彼依正色心此乃下分節境觀於依下釋初二句此觀下釋即空假中妙故色心體絶即前下釋唯一實性所觀下釋無空假中所觀陰絶結前色心體絶能觀亦寂正釋無空假中病去譬陰絶藥亡譬觀寂能即觀藥所即陰病於雙下釋色心宛然豁然下釋豁同真淨鈔文雙結故云宛然等如是下釋無復至差品衆生國土是總三五七九及淨穢等是別先以遮那寂光點示依正次方云有何定法等聲聞緣覺菩薩為三加人天為五兩教二乘三教菩薩為七或合二乘取人天為七九即九界同居等三土傳作淨穢而彼下釋帝網依正炳然因陀羅者帝釋有千名一名釋迦因陀羅殿前有衆寶珠網一目一珠一一珠內現帝釋宮殿莊嚴如是衆珠互相映入衆珠咸現一珠之內一一珠內皆具衆珠帝釋依正彼彼不雜以譬三千理顯圓融互入義書云況外觀中全無攝外法歸內心之言而自云帝網依正豈外色不具三千不具內心耶文即是下結外觀成相觀行下示正斥謬下文引他解外觀成相文云同者似也乃似其分真破云豈外觀功成止齊相似故今云觀行已上節節顯發但分四位明昧淺深耳因明正義暗斥邪說鈔問他云舊本無兩假字唯云即空即中空中妙故而云以空中亡彼依正之假此本何得妄加耶答雖欲依於舊本其如義理殘缺必是往時讀者不諳境觀故妄有改削矣且文標所觀境有內外豈以依正色心陰入之境而為假觀耶遍尋荊溪之意必不闕此一觀何者如止觀破思假之中云因緣生法即空即中輔行云且以法性空中對幻假說其實幻假即不思議假既云且以知非盡理須即妙假故云其實文中不云即假尚欲據義加之豈自著述而特略之況彼云因緣生法方有幻假之義今直云依正等且未成幻假況妙假乎又第一記中釋十二入各具千如中云境據假邊空中尚無其數安在然必約假以立空中此雖將境為假然與今文不同何者彼約十二入各具千如為境即已成不思議假故非此例恐未解者以此為據故粗引之仍出其意又上若不立假觀下何亡之而云無空假中耶又若更云空中兼上依正俱亡故云無空假中者文已自云色心體絶何繁重乎若以色心體絶亡所觀陰境無空假中泯能觀妙觀則無是過也又準內體三千即空假中三千已是妙境猶尚更立三觀今但云依正等未結成妙境那更略茲假觀耶解對舊料揀除兩假字初有三重問答次然且下斥舊釋義乖違三引染淨門義例三文徵釋初云舊本者珠指云依正三千是假以空中亡彼依正之假故云即空即中有別行本添即假二字謬也此正用空中以亡彼假豈又云即假乎文答中先斥不諳境觀依等是境即空假中是觀豈以所觀陰妄便為能觀妙假驗他不諳定境修觀之異也次遍尋文意須存假觀初且通標云遍尋等次引輔行妙記當文示之初止觀破思假文在第五卷二十九紙引大經六句明無生門破法遍經釋云何生生不可說生生故生生生故不生故不可說大師解生生故不生者因緣生法即空即中輔行五下五釋云生生故不生等者明不可說有漏之生即是空中空中不可言思所得故不可說但云空中者且以法性空中對幻假說其實須云幻假即是不思議假文今先引文次類今文不略假觀次以因緣生法幻假之義並今依正色心尚未成幻假寧是妙假且幻假與賴緣緣生建立妙假等諸名言如何區別須知賴緣緣生義只是一謂賴緣而生隨稱不同幻假之體既是有漏之生亦緣生也但境隨觀轉幻名雖殊通是緣生無體幻別名一理隨緣幻圓名以性奪修幻今是圓無生門正當以性奪修名隨德用空彰蕩相中彰絶待假彰立法名建立假若約體一互融一假一切假名妙假也第一記者疏釋經萬二千人觀心釋中以十二入各具千如成萬二千法門記文有六句初四句明三諦俱亡第一義中無有一法故云境據假邊等下二句明三諦俱照故云約假以立空中此即空中還寄妙假而立正同輔行三諦無形俱不可見然即假法可寄事辨文雖云將境為假乃取千如妙假正是能觀以十二入是所觀故如云具即是假又上等者引當文泯能觀觀只由先明俱照故有次文俱亡上若不立下何亡之又若等者縱他轉計他問此既云無空假中上有假字何妨答此是示觀成唯一性體能所俱亡故須云無空假中文今牒他云兼上依正俱亡云無空假中其如文中已有色心體絶句是泯所觀豈非繁重若以等者示文正義又準下復將內境具有三觀顯今外觀須有假字三千妙境已是妙假尚明三觀依正色心但名陰入尚非妙境安可略觀鈔問前門心之色心云是三千妙體今云依正色心何非妙境答上云心之色心即剎那念本具七科色心此非妙境更指何耶今但云依正等乃是直論外陰入界故不例上解次重料揀因答作並前釋依正色心未結成妙境故以前門心之色心三千妙境為難答意者既指剎那本具正是妙境今直明外境陰入不可比例鈔問既將佛法衆生法為外境佛已離陰何得皆是陰入耶答修觀行者外境未亡已來見有他佛故起信論云以依轉識故說為境界則知過在於我何關佛耶解因上答文定彼依正色心是外陰入界故以佛已離陰何名陰入為難果佛亦有非漏非無漏陰今言離生死陰耳答中推過歸己在佛非陰蓋修觀行者直至等覺皆有內外色心之別猶見他佛則屬陰境唯至妙覺更無彼此色相迭相見唯一真如智獨存方能離陰故義書云若修外觀須觀妄色成真色若衆生諸佛為外境則觀衆生陰入色心成真淨色心諸佛雖離陰入行人所觀須將應身色心為境文故知才屬所觀雖是佛境亦屬陰攝引起信證文云以依轉識故說為境界而此證者無有境界唯真如智名為法身文鈔然且置所定之文試論能定之義還合一家教宗不秪如他於諭迷顯正決中指色心門為外境者豈可內境離色心門耶又解外觀成相豁同真淨文云同者似也乃似其分真即六根淨也豈外觀功能止劑相似又解內觀先了外色心一念無念謂外境亡唯內體三千即空假中謂內體顯既全不約解行分文先了之言乃是牒前外觀內體已下方觀於內是則六根淨後方修內觀則識陰十乘初心絶分又若謂外境亡時內體必顯者則唯有外觀不須觀內又成內觀初心後心皆不修也此等相違請當宗匠者觀之還可將此見解定教文之是非乎或須云終日炳然有何損益而苦諍之境觀乖失而全不知況依正本融迷情疆隔觀成情遣且云不見塵去鑑淨現像非磨故云終自炳然此則自勝於日他莫知之解次斥舊中初舉他釋義乖違次破妄改終自為終日初至宗否先總標置文用義且置假字有無之文試論所釋內外觀相之義還合一家妙教之宗不只如下引他所釋一一別破一不合指色心門為外境諭迷顯正清師文也初句引他釋義豈可下鈔主徵詰色心門正明諦境內外兼收故知內境豈離於此二錯解豁同真淨文又解下引他釋義豈外下破據茲釋義外觀功成只齊相似則後心不修外觀何云發心畢竟不別耶節節顯發如前所明三錯解內境觀相文初引他釋外境亡與內體顯是珠指釋內境科語既全下斥解行不分下文正釋先了之言是先開妙解內體已下正修內觀故也先了下是他所釋是則下以位分齊斥前外觀成齊相似位次修內觀是六根淨後是則止觀於內心陰境明十乘觀法初心無分矣又若下牒他所見則唯下定唯有外觀前破內觀名字觀行初心絶分今又見不須觀內又成相似已上後心不修故云皆也此等下總結斥如上衆釋文義顯然相違豈可將此見解定文中假字有無耶或須下破他改字珠指云終日互映交涉如珠珠常各炳然也有本云終自炳然字之誤也既云終則知是終日字若言自則終字無力思之文今斥意者一字是非未害大義何必於此間緩字義而苦諍之若定境用觀立行之要却不諳練致成乖失況依下自出正義性具三千本來融攝迷情下二句約迷悟說妄情既遣故云不見等約離相說一往言之障體即德無障可論也塵去譬情亡鑑淨譬體顯三千妙用互入無妨發得本有修德無功故云現像非磨終自炳然所謂但復本時性也辭不迫切但云自勝於日不同他徑廷言之鈔問染淨不二門云照故三千常具遮故法爾空中又云亡淨穢故以空以中又義例云觀此一運即具十界百界千如即空即中此文何須添假字耶答因徵彼文驗知舊本是往人改削何者若不解彼之文意須據彼文除今假字今人既然往人亦爾不足疑也嗚呼不解境觀以至於斯且如染淨門云故須初心而遮而照照故三千常具遮故法爾空中蓋三觀相成也既云照故三千常具照是觀不三千是妙假不既不可單修假觀遂須空中成之故云遮故法爾空中因茲遮照妙用現前故云遍應無方既於妙假歷於淨穢復須空中亡之故云亡淨穢故以空以中義例照此一運即具十界百界千如者即於內心唯識之境用不思議假觀照之方顯百界千如仍須遮之故云即空即中正是三觀相成則與染淨門中觀相恰同也故彼三文有即是剩此文無即是缺何者今文標云凡所觀境不出內外即云外謂託彼依正色心既無心具及百界等言未成妙境又無觀照之義因何便云是假觀耶黨理之者見斯曉諭更何由執解引染淨門并義例對今文料揀假字有無珠指據染淨門文除今假字故也義例照此等者五心境釋疑例第三問起已望前心相可識未起望後有後可望則名欲起何名未起答對於後境知心未起名為未起心相欲生即是欲起是故二心心相全別觀此一運即具十界百界千如即空即中故知雖觀十界四運亡界亡運唯觀三千即空即中無三觀名字能所泯合文答中初至於斯先斥今昔不解文意謬據三文除今假字且如下出三文義只作一意消通所謂三觀相成初文以妙假照其法體故云恆具以空中遮其情執故云法爾空中即自然無相也如空中名遮一相不立假觀名照三千宛然以妙假成空中以空中成妙假故曰相成若無空中亡泯絶待妙假未免建立若無妙假照性乃成偏空但中然空中二觀俱名為遮那分二耶空以離性相計為遮中以絶待為遮一法之外更無餘法故名絶待次文先以妙假歷彼淨穢法體復以空中遮其淨穢分別之相故名為亡亦三觀相成也義例亦與此門觀相同也問事觀合以事造三千為觀體今照一運即具百界亦觀具耶答照此一運即具界如正當假觀具即是假次云空中正是三觀相成非觀理具也故彼下結判彼此文相有無缺剩二所言下明內境觀相者所言內者先了外色心一念無念唯內體三千即空假中解明內境觀相初句標先了下先須開解唯內下正修內觀行者先用妙解了達外境全我心造能造之心本無四性故鈔云本無念性謂無造念之自性也唯內體三千是內境即空假中是妙觀外境色心能造所造皆無自性唯有內體三千宛然妙觀觀之觀成理顯鈔先了等者初心行人欲依內心修觀先須妙解了達外法唯一念造此能造念本無念性能造既無所造安有外法既虗唯有內體三千實性如是解已方依內心修乎三觀故內體二字亦事理雙舉內即內心隨緣義故對外立也體即是性不變義故非內外也故義例云修觀次第必先內心乃至云又亦先了諸法唯心方可觀心又彼文云唯於萬境觀一心故知若無此解如何知心具足諸法若不知具但直觀心何殊藏通藏通何曾不云觀心縱知心體是中若不云具未異別教教道也故止觀先開六科妙解然始正修觀心之義如是如何釋云先修外觀至六根淨方修內觀耶又此內觀含於唯識實相兩觀之義學者尋之解初正釋內境觀相初約解行申文從初至唯一念造釋先了等外法謂生佛依正色心唯心所造此能下釋一念無念本無念性謂無造念之自性也能造所造既皆虗寂唯見三千法體如是下正明修觀初句結前開解方依下修觀故內下點內體二字則內體三千該於事理既云並由理具方有事用若明理觀任運攝得事造所謂善修實相觀者知全修在性也故義下引證初文正內心修觀次文證先解次行第三雙證解行故義書於一念無念下注先了萬法唯心即空假中下注方可觀心故知下明須妙解止觀所明四教皆觀根塵一念故云藏通豈不觀心即具唯圓故不談具別教教道也輔行問既知心具但觀於心何須觀具答一家觀門永異諸說該攝一切十方三世若凡若聖一切因果良由觀具具即是假假即空中問若不觀具為屬何教答別教教道從初已來但從心生十界斷亦次第乃至藏通此等皆不觀具文故止下以祖意示正斥謬止觀十章前六重依修多羅以開妙解第七正修方依妙解以立妙行山外何云外觀功成止齊相似卻見六根淨後方修內觀耶前已破斥又此下兼示文含事理山外內心理觀外境事觀四明謂今內觀具含事理二觀之義不可云單修理觀鈔云既內體三千事理雙舉內心隨緣即變造三千唯識觀也體性不變即理具三千實相觀也意令尋文見義鈔問外觀何不先明解了而直修三觀耶答據義合有但是文略何者若不先了唯色唯香如何觀外依正等耶但為外觀攝機須故為對內故顯不二故故且並列今之文意正明內觀以十門妙理唯指心法故諸部中皆云觀心解以內例外徵問外觀何無先了之言答中先明文略義書三云然內觀合有三觀亡照及觀成相外觀合有妙解先了萬法唯色之言蓋綺文互映故互闕也文但為下明雙列意攝機者或有得色無色定之機著內心重須令從易先觀外色次對內立外故有外境三者十門皆顯不二若不雙列何能顯其不二耶今之下正出今意泛論雖通內外一家觀法從近從要多明觀故內觀文中先明妙解也十門妙理唯指心者鈔云此文與止觀同成觀體專約心法說之所以節節云一念等特指心法妙為門也豈唯今文諸部皆以觀心為正意也二是則下明內外融泯二初互融是則外法全為心性心性無外攝無不周十方諸佛法界有情性體無殊一切咸遍解生佛依正色心等法全為心性諸法唯心故云無外心佛衆生趣舉一法融攝三千故科云互融先明心攝心攝既爾生佛亦然次十方下明生佛各攝所具三千性體初無二致只由性體無殊故能彼彼各遍鈔三法體性各具三千本來相攝前雖解了心攝一切今觀稱性包攝灼然故是則下先明內心融於外法既云互攝生佛亦然故十方下次明若生若佛各自遍融又此性體非謂一性蓋三千性也以佛具三千方攝心生生具三千方融心佛心具三千豈隔生佛若心無佛性豈能攝佛佛無生性何能攝生故性體無殊之語有誰不知一切咸遍之言須思深致他解唯論融外歸內名不二者一何局哉一切咸遍如何銷之況餘九門皆歸一邊全傷大體解先總標互融意心佛衆生同一法界圓融體性從本以來互具互攝前雖等者却指先了之言前明外法唯心但解而已今觀之不已灼然稱性融攝無妨故是下釋初四句明心攝故十下釋生佛各攝又此下釋性體無殊等非謂定一之性蓋具足三千圓融妙性也以佛下廣上三法各具三千相攝義若心下反顯故性下寄正義誡斥謬解先誡云有誰不知等他解下斥融外歸內者清師云心性融攝攝彼三千即我三千孤山云攝色歸心所見同也一切咸遍如輔行云縱知我心具三千法不知我心遍彼三千彼彼三千互遍亦爾文若云融外歸內此文莫消況例餘九皆歸一邊融色歸心融修歸性則傷害大體二誰云下俱泯誰云內外色心己他鈔既各融即不可定分故稱理觀誰云有二然內外等三雙但泛舉相對令皆融泯亦可云內色心為己外色心為他更用己他揀其內外解釋俱泯泛舉內外等三雙皆約色心相對此等二法俱泯即不二也亦可下又作一義消之更用己他揀上內外故云內外色心己他且上文以心為內餘皆名外今云內色心為己何相違耶須知亦不出上科文意前既云三法本來相攝各具三千今云內色心為己即心具三千外色心為他即生佛各具三千也亦同前門己心生佛他生他佛之義謂內心所具三千外境各具三千皆融泯也此則下結門所從此即用向色心不二門成解用向門成者前門明所觀境此門正明觀法從境立觀故也鈔十門理一莫不相由今從依境修觀內外二境皆色心故此二妙故內外不二也解門門皆顯三千三諦故云十門理一由七科色心皆成妙境今依境立觀故內外不二也鈔十不二門指要鈔卷上鈔十不二門指要鈔卷下宋四明沙門知禮述三修性不二門三初標三修性不二門者智行鈔修謂修治造作即變造三千性謂本有不改即理具三千今示全性起修則諸行無作全修在性則一念圓成是則修外無性性外無修互泯互融故稱不二而就心法妙為門解釋標文初釋修性今示下釋不二而就下釋門造行曰修不改曰性修性義也變造理具三千修性體也只一十界三千諸法在性在修得名雖殊其體是一妙樂云鏡明性十界像生修十界文只一大圓鏡體非背非面取鏡明邊喻性具十界取像生邊喻起修十界故文云在性則全修成性起修則全性成修然一家事理修性體用三雙名異體一故諸文凡釋事理必以修性申之凡釋修性必以事理明之凡釋體用必兼事理修性如今修性以變造理具三千而釋義書釋二造云此之二造各論三千理則本具三千性善性惡也事則變造三千修善修惡也鈔云理具三千俱名為體變造三千俱名為用籤云理體無差差約事用鈔云性體具九起修九用釋不二中初互融以性融修修雖造作既全性起以性奪修修德無功作而無作次二句以修融性性雖不改既修德相貌在性德中則諸法縱然圓成互具也次是則下互泯初句以修泯性次句以性泯修互泯下結上融泯顯不二義融謂虗融泯謂泯淨謂無修性隔異曰融亦無修性名相曰泯門義者諸法皆可論於修性亦為成觀從近要故心法為門二性德下釋二初修性雙立三初修性對論二初直明性德性德祇是界如一念此內界如三法具足解科直明性德若不識性以何為修皆由理具方有事用故先明性德本具三千不可敻異故名性法法皆常樂我淨名為德略舉界如具攝三千諸法皆具三千今為成觀故指一念此內心所具界如三千皆即三諦有軌持義故名三法鈔言德者即本具三千皆常樂我淨故界如一念即前內境具德剎那心也界如即即空假中任運成於三德三軌等即空是般若清淨義故即假是解脫自在義故即中是法身究竟義故諸三例之然諸法皆可論於修性亦為成觀唯指一念應知前二門直明依境立觀此門及因果不二乃委示前二令成圓行始終也何者性德豈出色心不二修德莫非一心三觀今示修性互成成妙智行以此智行從因至果則位位無作方名如夢勤加等即自行始終皆妙也解初消文然諸下示意應知下對辨初句釋性德本具三千釋性常等性德不變故常離二死苦故樂具八自在故我一切染法不相應故淨界如下釋界如一念即前者指前門內體一念界如下釋此內界如三法具足界如三千既即三諦故成三德三軌等即等諸三法般若是智能破煩惱故云清淨解縛得脫故云自在法法圓具故云究竟諸三者略則十種三法廣則無量三法也示意中為成觀體的取心法對於諸法故云唯指對上二門一念為總內體三千故云亦也對辨何故有此修性一門故對前後辨其來意以此四門成前五妙今委示之初總判依色心境立內外觀色心即所依妙境內外即能觀妙觀修性因果委示色心內外令成圓行則全性起修全修在性行始為因行終為果也問染淨門鈔云色心門攝別入總專立識心為所觀故今云依境立觀何故總將色心為所依妙境耶答據徵釋中性德豈出色心不二即妙境也又文云心之色心乃至結成三諦等豈非妙境下文因明十門皆為觀心而設故的指識心為境也徵釋中色心不二即初門一心三觀即次門此門正論觀法也故修性互成即今門從因至果指第四門二三兩門從智行二妙而立故云成妙智行因果門從位妙立故云位位無作如夢勤加即因果門譬無作行如夢作為前四門正明自行因果故云始終皆妙問色心門約理事明三諦心之色心性德也即心名變修德也今何直云性德耶答乃約境觀分於修性拾遺記上云云文自應知下總將五妙四門會通修性也二性雖下以修對辨二初明相成者性雖本爾藉智起修由修照性由性發修解相成者由修照性故性德方顯由性發修故方照性故云相成雖性德本然必須憑藉妙智發起圓修之行此二句先明從性起修下二句正明相成上云藉智起修此修偏目於行下云由修照性該乎二修鈔性雖具足全體在迷必藉妙智解了發起圓修故云性雖本爾藉智起修由此智行方能徹照性德而此智行復由性德全體而發若非性發不能照性若非徹照性無由顯故云由修照性由性發修此二句正辨相成之相解初釋上二句由此下釋後二句文只云修性鈔主便約智行釋修者準知下文離謂修性各三文略義周必該二修各三九法論離合也有昧略文作六法論者請以今文證之二在性下明互具者在性則全修成性起修則全性成修性無所移修常宛爾解前雖相成恐不了者謂修性尚異故明互具令知修外無性性外無修全性成修全修在性謂具無別具皆是緣生生無別理並由本具然雖互具修性宛然故雖全修在性修起三千終日隨緣變造雖全性成修而理體三千未嘗變異故云性無所移等以後二句釋成上二句互具之義錯綜其文謂在性則全修成性修常宛爾起修則全性成修性無所移鈔相成之義雖顯恐謂修從顯發方有性德稍異修成故今全指修成本來已具如止觀廣辨三千之相雖是逆順二修全為顯於性具則全修成性也又一一行業因果自他雖假修成全是性德三千顯現故云全性成修也又雖全性起修而未嘗少虧性德以常不改故故云性無所移雖全修成性而未始暫闕修德以常變造故故云修常宛爾然若知修性各論三千則諸義皆顯故荊溪云諸家不明修性蓋不如此明也解釋互具初正釋次揀謬初相成下釋上二句又雖下釋下二句然若下示修性意初句指前雖顯相成尚迷互具既云由性發修則顯發方有既云由修照性則性稍異修恐有此謂故明互具然釋全修成性全性成修皆以修顯性良由理無所存遍在於事初句以修起顯性具止觀廣辨三千先明思議境心生十界次明不思議境心具十界正是以生顯具逆順二修不出十界變造諸法九名逆修佛界名順此全修成性也次句顯修成由性發修謂修治造作故云行業等即變造十界雖是修成全性顯現則全性成修也引文例顯故云如也示意由上文來既修常宛爾性無所移乃知修性各論三千則事理總別二造二觀本法不變隨緣三無差別等皆顯明故云諸義荊溪云者妙樂云比讀此教者不知修性文下文云他以真如一理為性隨緣差別為修蓋不如今家明修性相成互具各論三千之義鈔問他云舊本作藉知曰修而以本性靈知用釋知字若云藉智起修者蓋寫者書曰逼知後人認作智字既不成句又見下句有起修之言遂輒加起字爾此復云何答既許寫曰逼知遂成智之一字何妨往人寫日遠知誤成知曰二字必是因脫起字復由二字相懸致使有本作藉知曰修也故知寫字添脫遠近難可定之魯魚之訛豈今獨有須將義定方見是非何者他既暗於三法妙義尚將一念因心陰識直作真知解之況今有此訛文知字可執豈不作靈知解耶且靈知之名圭峰專用既非即陰而示又無修發之相正是偏指清淨真如唯於真心及緣理斷九之義也他云因真教緣示善惡知即是真知乃知諸法唯心故曰藉知曰修今問此之知字為解為行若隨闕者則不名修若單立知字解行足者乃玄文智行二妙止觀妙解正修便為徒設則天台但傳禪詮都序也又言示善惡知即真知者還須先用妙解即之不次用妙行即之不若然者正是藉智起修若不然者智行二妙全無用也今云藉智起修直是由於智妙起於行妙耳故後結文云如境本來具三依理生解故名為智智解導行行解契理三法相符不異而異然智行俱修今偏在行者蓋智從解了發起義強行就進趣修治義強故從強也又此一句全是釋籤行妙中文彼云藉智起行故他又云智名未稱全性成修若爾何名智妙應亦本是知妙後人改為智妙乎解揀謬中初問云舊本等者珠指云藉假藉也知了性也曰言也靈知即心也今文知者因真教緣示善惡知乃知諸法唯心故云藉知曰修有別行本云藉智起修者謬由不曉全知之修故茲妄改況知體直指唯心而照智名未稱全性成修蓋寫者書曰逼知後人認作智字等答中先以寫字添脫破次以義理定是非逼近也加添也他云寫曰逼知是近今云寫日遠知是遠他謂復加起字是添今云因脫起字是脫故添脫遠近難定其義以文定義萬無一得魚魯者抱朴子云三寫魚為魯帝成虎文文字訛舛自古難定須以義定文萬無一失也約義中先破知字之非今云下明智字為是初文以他錯解三法無差況出今文訛謬三法妙義蓋山外一派昧於華嚴三法各具事理妙義謂心是理生佛是事致將一念在因之心陰妄之識作真理解況見今文舊本訛為知字豈不執之作靈知解耶圭峯專用者珠指引云知之一字衆妙之源文既非等者不能即妄成真正同偏指清淨真如既無修發之相驗非全性起修正同緣理斷九也他云下舉彼謬解委悉難破他云下舉如前引今問下以義徵核初以智行缺具徵知字初核定解行次難隨缺非修何名藉知曰修若單下謂只一知字兼具解行則妨玄觀解行諸文玄文智解行行止觀六章妙解正修立行皆成徒施矣禪源詮都序是圭峯作彼云知之一字衆妙之源故天台等者天台傳南嶽三種止觀摩訶止觀六章第七正修解行備足如膏明相賴若知字解行足者天台不須傳止觀但傳禪源詮也又言下牒彼謬解徵難即義今問若用解行即之正同今文用妙解即故名藉智用妙行即全同起修不用解行論即則二妙無用也正釋今文智字為是初直就義合釋以由釋藉由智起行故云藉智起修故後下引下文離義證結文約十妙明理一鈔釋如下文雖引離文正取智解導行以證今意然智下修偏屬行應疑云若對一性智行俱修今藉智起修偏指於行何耶蓋智下釋出乃從名義偏強說也又此下引文證同籤四十七云智為行本則行藉智生行能成智則智藉行成今約義引他又下引謬徵斥二修又下明逆順相返二初明對逆故二性並存二明因順故二心俱泯初文者修又二種順修逆修順謂了性為行逆謂背性成迷迷了二心心雖不二逆順二性性事恆殊解欲明順修逆修俱泯故先對逆以辨二性俱存初句標次句列順謂下釋逆順義迷了下即隨緣而不變約性故不二全不變以隨緣約事則恆殊性謂性分隨緣染習鈔上之全性起修一往且論順修修名既通有順有逆今欲雙亡先須對辨了性為行者即藉智起修也背性成迷者始從無間至別教道皆背性故逆稱修者即修惡之類也心雖不二等者隨緣迷了之處心性不變故云不二逆順二性是全體隨緣故即理之事常分故曰事殊是則以前稱圓理修對今背性故成二也解初示意全性起修指上以修對辨文也修名下示今意今欲雙忘者近指二心俱泯修通逆順者佛界修善名順九界修惡名逆二了性下正釋初釋初句指前藉智起修既全性起故名為順謂解了本心具三千法全性起修名性德行背性下釋次句九界衆生不知性具違理而作故名背性始自阿鼻苦趣終至教道已還皆是背性何者四趣墮苦人天著樂二乘沈空菩薩著假咸未達性俱名逆修逆稱下簡逆名修以修惡例九界三道惡亦名修舊疑今之背性自別以還下文謂實終至等覺者各有所以背性以圓對偏圓教始終皆是順性謂實則因果對論等覺已還無明未盡猶有謂實心也次釋心雖不二云隨緣染習性分之性此逆順性乃全三千不變之體隨緣變造事既恆分故有差殊是則下釋對逆故二性並存以相成中全性起修之順名稱圓理對今背性成迷之逆為二性並存也二明因順故二心俱泯者可由事不移心則令迷修成了故須一期迷了照性成修見性修心二心俱泯解初二句責其不分迷悟不可因迷了二事不移心性如前迷了二心心雖不二也又須知逆順性事常分不可執迷為了故須下正立理故須一往改迷為了照本性德成乎順修自然二心俱泯也鈔可不可也由因也不可因逆順二事同一心性便令迷逆之事作了順耶此乃責其不分迷悟也故正立理云故須一期迷了照性成修言一期者即與一往之語同類乃非終畢之義也蓋言雖據寂理二修終泯且須一期改迷為了了心若發必照性成修若見性修心自然二心俱泯此義顯然如指諸掌人何惑焉豈非逆修如病順修如藥雖知藥病終須兩亡一往且須服藥治病藥力若效其身必康身若安康藥病俱泯法諭如此智者思之解釋分二初釋文二簡謬初釋初二句責不分迷悟出文意也次釋次二句謂正立義理須改迷為了蓋言下釋一往義據本寂理二修終自泯亡且須一往改迷為了了心若發者謂妙解開發必照迷順同一心性既能照了故曰見性全性成修故曰修心如云若不識性以何為修因順故泯也此義等者山外不曉一期是一往義故此斥之豈非下約譬顯藥病兩亡譬二修俱泯服藥治病譬改迷為了藥效譬了心發身康譬見性也鈔問他云舊本作此其字釋意云豈可由不移生死涅槃常殊之性事便任此為了修乎是故下句便云故須一其迷了照性成修此復云何答他雖執於舊本而違現文何者文云可由事不移心則令迷修成了文意唯責執迷為了何曾雙責迷了為了耶豈非彰灼違文乎故知迷了雙泯功由了修何者迷既背性故立了修翻之遂一期事殊也了既順理理無違順故二心自泯也是知用此期字者既不違文兼得順理若用此其字相違稍多不能廣破也解問答簡謬他云等者珠指文如鈔引今問此說可否答謂他執舊違文文意責不分迷悟以迷為了如彼所說雙責迷了也生死是迷涅槃為了故知下示正義二心雙泯功由順修迷既背性成迷故須順修翻改迷修為了則二性並存一期事殊也了修既順本寂之理則違順叵存此則因順故二心俱泯也是知下結示彼此釋義邪正得失期字則不違現文兼順義理其字則違文背義故云稍多三又了下明離合本同二初約法明離合相異者又了順修對性有離有合離謂修性各三合謂修二性一修二各三共發性三是則修雖具九九秖是三為對性明修故合修為二解欲明修性體同先辨離合相異前科逆順雙明意令改迷為了今明修性離合復置逆以論順故云又了等也初二句標列離謂下釋離合義先離合對辨修二下就合各開離謂修性各三等者乃於修性法體上論此離合之名名下之義離處常合合處常離離合之體非離非合所以圓家修性須論離合者法體圓融妙不決定一而論三三而論一不同別教所詮三法隔別不融故也離合義者一必具三為離三即是一為合修性各三者語不頓舒且言各三才言修者必該智行既二修各三對於性三是九法論離也合謂修二性一者雖一必具三離三成九九只是三是三法論合也合既修二性一以合顯離離中修三必該二修各三豈不見前文由修照性由性發修四明便作智行二修而釋修二各三者前云修性各三未分二修但是文略恐人不了故就合中特於二修各開為三也智行二修共顯性德三法故云共發性三修雖具九者性三咸為所發皆名修也九只是三者離三成九故云修九合九為三故九只是三為對等者釋前合謂修二性一為對正因一性修中但明緣了二法也鈔復置逆修但論順修法相離合蓋此修性在諸經論不易條流若得此離合意則不迷修性多少如金光明玄義十種三法乃是采取經論修性法相故具離合兩說如三德三寶雖是修德之極義必該性三身三智文雖約悟理必通迷三識三道既指事即理必全性起修此六豈非修性各三三因既以一性對智行二修三菩提三大乘三涅槃並以一性對證理起用二修此四豈非修二性一若各三者唯屬於圓以各相主對全性起修故修二性一則兼於別直以修二顯於性一則教道所詮若知合九為三復是圓義此文多用各三如云性指三障是故具三修從性成成三法爾又云一念心因既具三軌此因成果名三涅槃若後結文三法相符雖是修二性一乃合九為三也解釋離合對辨初示今辨離合置逆論順前修性對論云全性起修且論順修次科方逆順對辨今明離合相異又復置逆論順置捨也問今文約順修以論離合何故光明玄三識三道逆修亦論離合耶答彼約十種三法體一名異俱通離合三識三道雖是逆修約即逆是順亦論離合鈔云指事即理全性起修蓋此下示得意會文一家所明修性備在諸大乘經論難以疏條流暢若得今文離合之意往觀經論法相洞然可了多即約離以說少則約合以論如金下正引文釋義光玄十種三法乃是採摘經論法相該因徹果大師自約六離四合而釋故今引而申之三德三寶修德之極以修顯性故云義必玄中直作修極而說三德者法身般若解脫各具常樂我淨名德文云法名可軌諸佛軌此而得成佛身者聚也一法具一切法覺了三諦名般若於諸法無染無住名解脫三寶者至理可尊名法覺理之智可尊名佛毗盧遮那遍一切處此和可尊名僧文乃果上一體三寶然此德寶雖是修極必全性三而起三身三智以悟顯迷故云理必法報應為三身實相般若即一切種智觀照般若即一切智文字般若即道種智然此身智雖約悟論必通迷性修性相對亦離義也三識三道雖是迷逆之事玄云識名了別是智慧之異名文三道修惡即是性惡皆結同三德故云指事即理必全性起修第九菴摩羅識第八阿梨耶識第七阿陀那識三道者苦道即法身煩惱道即般若業道即解脫皆指事即理也今據玄文釋義判云此六豈非修性各三智行約因中自行證理起用約果上對機釋三因了因云智與理相應緣因云功德善根資助覺智開顯正性釋三菩提云真性菩提以理為道實智菩提以智慧為道方便菩提以善巧逗會為道釋三大乘云智隨於境名為隨乘得果得機名為得乘釋三涅槃修因契理惑不生智不滅名圓淨涅槃寂而常照機感即生此生非生緣謝即滅此滅非滅名方便淨涅槃記釋云此三涅槃約契理應機三種修義對於本淨一性而說文故知四種是合義也若各下判所屬圓別先判所屬次引今文示離謂修性各三唯在於圓修二性一別教亦詮故云兼別各相主對者修三性三主對正是全性起修以性法身對修法身以性緣了對修緣了雖云修三性三主對修中必兼智行修二兼別者別教亦詮三法修性不融非縱即橫別修緣了顯本法身即以修顯性圓人了知修二性一乃合九為三圓融互具此文下引文示多用離義初當門文次因果門文三結攝中文如境本來具三等此合九為三也今云似也鈔修二各三等者就合各開如三般若等是了因之三如三菩提等是緣因之三共發三道等正因之三既發性三俱云修九者雖兼性三咸為所發故皆屬修又凡論修者必須兼性九秪是三者如三般若秪是了因如三解脫秪是緣因如三道等秪是正因為對等者釋前合意性既唯立正因為對性以成三故修但緣了也諸合三義例皆如是解釋修二各三就合各開者前約離修性各三修必該於智行以合則修二性一驗知修三須開智行今就合中修二各開為三也三般若等是了三等於三識三大乘般若是智故對了因菩提緣因等於三寶三涅槃也三道正因等於三身三德既發等者既以修三發性三何云修具九故云咸為所發故皆屬修修必兼性故云修九也九只是三者合九為三也解脫與菩提義同前後互出為對下點為對性明修合修為二是釋合謂修二性一之意性唯正因對性明修合為緣了諸合三例者菩提大乘等諸三法並是對一性以明二修鈔問十種三法俱通修性各可對三德三因何故三般若等唯對了因三菩提等獨對緣因答如此對之方為圓說單云了因不少以具三故了三自具三因三德等故緣正亦然應知一德不少三九不多至於不可說法門豈逾於一邪解問俱通修性者謂諸三法不出一性二修趣舉一種可對三德三因何故唯將般若對了菩提對緣似非圓融遍通之義答謂正顯圓融故作此對如以三般若對了因了是般若般若必具解脫法身則了三自具三因等諸三法緣正例知一德不少一必具三故三九不多九只是三三只是一縱至無量法門舉一全收也修性離合離合之名起自一家離合之義蘊乎經論法華藥草喻品一相一味所謂解脫相離相滅相涅槃三德互具地論空有不二等中論因緣所生法等離是具義合是即義三法互具故成離互即故成合一必具三名離三即是一名合如云離謂修性各三合謂修二性一光明記以具釋離如云究論空假得為體者由具於中然體上之名有離有合草菴云離謂修性各三此離名也其義何嘗定離乎方且合之可也合謂修二性一此合名也其義何嘗定合乎方且離之可也蓋以義推之即合而論離即離而論合至其體誰離誰合乎文一家所明修性法相須論離合者意彰圓融即具之旨光記云只為單說圓義不成作此融談方彰妙體指要云一德不少三九不多至於不可說法門豈逾於一耶上明名義體意次明離合數者先達約二句收束諸文一修三性三修性對論三二修九性九修性對論九初修三性三如不二門云性指三障是故具三又一念心因等離謂修性各三等金錍云本有三種三理元遍答修性對論三者不二門對性明修合修為二即合謂修二性一也修九性九者不二門云修雖具九光句釋金鼓圓空鳴三法即理境中二明於九法鼓圓是法身鼓空是般若鼓鳴是解脫於此三法一一具三遂成九法既約鼓體性德中論未涉起修乃性九也修性對論九者如涅槃玄體宗用三各有三法或約三一論如籤云一謂涅槃三謂三德又約五法如妙宗云此是法身中三未明餘二各三又約十八法如拾遺記云斯由性三互具成也致令修三亦成九義又約二十七法如光疏鼓體譬法身具圓空鳴三三義各三體具九法宗用亦然已上皆是隨文生解非的分離合之數一家正意的約三九明之九法為離三法為合減之則法體不圓增之則徒加名相荊溪云離謂修性各三合謂修二性一四明云修中論九九只是三三九圓融未始差別或據修性各三之文約六法論謂不二門所論離合與經體離合不同經體約法門大體九法論離今文約圓人起修六法論離從性三起修三指要引十種三法六離並是修三性三相對又性指三障是故具三修從性成成三法爾豈非六法論離若下文云修雖具九九只是三四明謂就合各開不可為難今謂不二門且約修性相對故云修性各三才言修者必含智行語不頓舒且云各三又云各相主對全性起修一往似謂修三性三各相主對全性三起修三細尋其意須該二修若剛執修性各三是六法者今問此之修三為智為行若云智修則缺於行云行亦然況合文云修二性一以合顯離必二修各三若離為六法應云合謂修一性一又只應云合六為三亦應問云今修性門依何妙立恐難酬答矣三明離合相者淨覺謂離性中法身為修中法身離修中緣了為性中緣了合修法身歸性法身合性緣了歸修緣了川字分離合雜編經體章云三雖似九九只是三全修之二在性中全性之修在修內以互相攝故似九義互攝成離克論其體唯是法身宗唯般若用唯解脫克論是合文心解云性中智脫全成二修修中法身即是一性義雖具九體只是三文此乃修自即修性自即性修性體別何名不二乎孤山約修性與奪而說約迷性與而言之性中具三是離義約悟修奪而言之合為性一如正義云為對迷性說為悟修故為修中奪所照境以屬於性則修唯有六而智三不出於了行三只是於緣故云合修為二亦應更云為對修明性故合性為一以性中了因未曾發心緣因未曾加行故奪緣了之名以屬於修也文此是今家對類二種相形之義非全性起修圓融之旨也四明得一家圓融離合之旨約一必具三為離三即是一為合鈔云如三般若是了因之三三菩提是緣因之三共發三道等正因之三又云如三般若只是了因三解脫只是緣因三道等只是正因文約具明離一中具三約即論合三即是一方見不縱不橫全性起修之義也四明離合位今修性門正依玄文智行二妙而立釋籤明斷云今言行者多在住前三法妙顯在於初住又云境即理性三智即名字三行即觀行相似三又妙樂明初住分果修性一合無復分張據此但是住前法相何故鈔釋離合直至於果如云三德三寶是修德之極又云以此智行從因至果位位無作等須知玄籤之文有自行豎入義有當妙高深義若前五妙四因一果約自行豎入則境智行三多在住前三法之果顯於初住若當妙高深則境智行三該因徹果不局初心故一一門下以六即檢先達云智行既檢六即修性須該始終況籤顯約六即以明三德一理而三理一行而三行乃至六即初後俱三三一不殊初後不二文又玄五云從理性之三法起名字之三法修觀行之三法發相似之三法乃至究竟之三法文此等諸文皆通因果故光明記云若境智行對住前三即此乃從強約修別對若論法體真位無缺文孤山淨覺局以住前法相而說但得自行豎入從強約修別對之義失於修性法體該因徹果當妙高深之旨矣五明離合文者今修性門本無十種三法之語何得引彼釋今離合妙玄自有境智行論離合義却置而不用以致昔人謂有而不遵無而強用之難當知四明得荊溪之意妙樂十五云修性三因玄文止觀俱有此意如云三識三道三佛性等具如修性不二門說九門共成方了此旨文荊溪既指故以十種三法釋之問荊溪雖指尋文則無答文云此內界如三法具足明文在茲何惑之有問若果用十種三法釋今離合玄文三法妙自有類通十種三法何故不用却遠取光明玄十法而釋豈非棄親近而從疏遠耶答妙玄雖有十種三法乃是初住類通而已一者釋相不委不辨離合相狀二者能類是三軌所類是十種三法以能類所類但在初住不顯橫廣豎深該因徹果故不用也若光明玄十種三法兩重生起橫包豎攝徹果該因法相周備以此釋之則離合遍通一切故云蓋此修性至離合兩說是則以十不二門離合之義消通一代經論離合之文以一代經論離合之文消通十不二門離合之相問十種三法俱通修性離則俱離合則俱合何故六種是離四種是合答六離四合之義出自玄文何關四明故指要云如金光明玄義採取經論法相故具離合兩說此六豈非修性各三此四豈非修二性一皆指玄文指南云三因中正了可見緣因云功德善根資助覺智開顯正性判云此是一性二修又以涅槃菩提大乘謂一性對起用二修者由三涅槃中方便淨謂寂而常照機感即生三大乘中以得果得機為得乘三菩提中以善巧逗會為方便菩提此之三種由智契理乃能起用故云證理起用二修此乃從一性起修二合說耳餘之六種是離故各三也以三識三道是迷之極本有位故三德三寶乃修之極當有位故由迷事即理修必有性故約離明以悟之曰智證之曰身若非本有證悟成別故三智三身亦約離說文草菴云六離無理性之名四合則有之名義偏強無他說也文此但出六離四合名義而已未為盡善又須知六離四合據光明玄文義而說若十種皆通離合拾遺記約圓融釋義故也六揀全性起修各相主對南屏論起修乃似川字如以性起修以修起修正是各相主對而起今鈔亦云各相主對得不與彼同耶須知二說自異彼以性法身起修法身謂以性起性乃至以性解脫起修解脫謂以修起修今則不然性中雖有二修二修在性同名性三非屬修也既云全性顯非屬修宗中雖有法身既全性起盡屬宗三用三亦爾以此為別文云各相主對豈非以性法身對修法身乃至以性解脫對修解脫與南屏義同耶須知今云各相主對但是性三修三以三對三故云各相主對其實境三對智三名各相主對境三對行三亦名各相主對且今云全性起修為智為行北峯依境智行三法之文謂從境三起智三從智三起行三若今文且是從境三起智三須知凡論起修必兼智行若從境三起智三是全性起修若云從智起行則成以修起修何名全性起修須知今文且約修性相對而言其實修中必該智行智行二修皆全一性而起全性三起智三全性三起行三拾遺記云若全性三起契理修則成三智若全性三起契機修則成三脫文證理起用既爾智行亦然但語不頓舒直云全性起修爾若籤云從境起智從智起行此乃住前三法生起次第非全性起修之義也二二與下約喻明修性體同者二與一性如水為波二亦無二亦如波水解前明法相圓融故有離合之異今明修性二而不二故約波水以喻體同鈔雖明修性及智行等別皆不二而二故約波水橫豎喻之仍約合中三法而說開豈不然初明修二如波性一如水二而不二波水可知修性既然修中二法亦二而不二同乎波水問修二性一已同波水修尚即性豈修中二法更須約諭融之也答如身兩臂雖與身連臂自未合為防此計故云亦如波水有本云亦無波水者既不成喻此定訛也解雖明修性及智行等別總指上修性雙立并離合相異二而不二指今體同初約波水喻修性次以波水喻二修即智行前雖修性對論離合之相義雖殊別理無二致故約波水以喻體同修二如波性一如水豎也修性相望一往名豎次以波水自喻二修橫也文中既以二修對一性說是約合明合既二而不二開亦例然初明下釋上二句修性既然下釋下二句修二性一既同波水異而不異豈修中二法條然別也故云亦也且取波水不二喻於二修不可同前修性求其法譬相當觀音疏下云譬如一身有左右手定慧亦爾文故云如身兩臂等也有本云者珠指亦作亦如波水釋敘他說云有本云亦無波水誤也若云波水俱無即喻修性雙泯非此中意又波水俱無不成譬喻也文今云不成喻亦此意也二應知下修性俱亡正示不二應知性指三障是故具三修從性成成三法爾達無修性唯一妙乘無所分別法界洞朗鈔性指三障等者既全理成事乃即障名理是故立性為三性既非三立三修從性成亦非三立三豈唯各定無三抑亦修性體即如是了達即不動而運遊於四方直至道場名一妙乘也問性三本具那言對障名三答本具妙理若定是三不能作一及無量故故知立則一多宛然亡則修性寂矣今就亡說豈得將立以難之解釋俱亡者上雙立中修性對論逆順相返離合本同並釋修性今明俱亡是釋不二故云正示不二也全理成事等者釋性指三障是故具三性既下釋修從性成成三法爾豈唯下釋達無修性唯一妙乘全理成事謂全性惡成修惡即障名理謂修惡即性惡既全理性而成三障之事今即指此三障名理性三故性具三此同金錍無始煩惱業苦即是理性三因非三立三者性本無三故曰非三指三障而立三也各定無三者修三性三妙不決定皆非三立三耳修性體即如上波水之喻修之與性亦非二立二其體常即乘是運義圓人全性起修名不動而運從因至果遊於四方四十位直至道場妙覺位也問答意者性指三障釋云非三即是亡義若云性三本具自是立義妙理圓融性不定住能出生一及無量豈可定三一多宛然修性寂矣者立即是照亡即是寂此之二句亡照互顯上下相映應知照則修性一多宛然亡則修性一多寂矣今就亡說者今科正明俱亡故云性本無三對障說三耳達無修性正明亡義若云性三本具是約立以難亡豈可得乎三結門從前此由內外不二門成鈔可解四因果不二門三初標四因果不二門者法位鈔因果名通今就開顯唯約圓論因從博地至等覺還果唯妙覺雖通傳立約極義彊三千實相未顯名因顯則名果隱顯雖殊始終常即故名不二門義如前解釋標文初釋因果三千下釋不二門義同前三亦指心法四趣人天及四教各有因果故云名通今就法華開顯唯約圓論因果也博廣也六道凡夫未稟方便教者名博地乃至圓教等覺已還皆名為因妙覺為果傳立者初住已上位位迭論真因分果文心解云因該五即果通分滿文初句可爾次則不然故云約極義強大乘因果皆三千實相隱則在迷顯則屬悟然迷有厚薄悟有分極理與名字俱名為隱雖五品觀行論顯六根相似論顯初住已去分證論顯今對妙覺究竟顯故等覺猶有一品微細無明尚名為隱前位可知雖果悟因迷隱顯事異而三千實相初後無殊故云始終常即始因終果也二衆生下釋三初就圓理明因果暫存三初明始終理一衆生心因既具三軌此因成果名三涅槃因果無殊始終理一解大科因果暫存修證無得是名因果三始終不二方明不二初先明始終理一即不二義理雖不二其如迷悟事異因果乍殊故有次二科衆生之名通於九界別就一念心法為因當處具足三千三諦可軌則故名為三軌三千即空觀照軌三千即假資成軌三千即中真性軌雖具而迷故名為因三法究顯方名為果果是歸趣復名涅槃鈔衆生一往通於因果佛名無上衆生故二往則局因對佛立生故生雖在因復通一切唯取心因是今觀體體具三軌是果之性故名為因此性若顯名三涅槃三法體常始終理一解初釋衆生心因引籤文釋衆生二字籤云一往通因果今釋佛亦名衆生故大論云衆生無上者佛是籤云二往則局因今釋對佛界立衆生唯局九界雖總引二句正取次句二往局義生雖下釋心因二字衆生雖因復通九界廣散難示今從近要唯取一念心法之因而為觀體言觀體者指陰心也如云若無十境乘則無體文體具下釋既具三軌一念心體具足三千即空假中可則名軌是果人之因性也此性下釋此因成果等謂此因性若顯成證果位名三涅槃三法下釋因果無殊等因名三軌果名涅槃三法之體常無變異也二若爾下悟迷事異二初問意者若爾因德已具何不住因解科迷悟事異者欲彰因果不二先辨迷悟事殊事殊乃不二而二理顯則二而不二故約迷悟暫分因果若爾者領上心因本具發問意謂心因既具三軌是果人之性只合住因何須求果鈔求證果位為成功德因德既具何須求果二但由下答意者但由迷因各自謂實若了迷性實唯住因故久研此因因顯名果解答中應先云若了迷性實唯住因今先示所迷之過故云但由迷因各自謂實言謂實者法本虗融衆生情謂執之為實欲離謂實之情進修不已故云久研此因情亡德顯果名斯立故云因顯名果鈔因德雖具但為在迷諸法本融執之為實始從無間終至金剛皆有此念若不謂實鐵牀非苦變易非遷此念若盡即名妙覺故云各自謂實若了所迷之性有何佛果別生還證因德故云住因而因德顯處自受果名故約迷悟而分事殊解初釋但由迷因各自謂實諸法本融等者三千諸法本皆虗融無明之心執之為實如云一色一香無非中道衆生情隔於妙耳此謂實心始自阿鼻終至金剛後心雖惑有厚薄皆有此念若不謂實等者以無顯有鐵牀對前無間變易對前金剛若無此念處阿鼻而非苦因移果易而非遷無非究盡離謂實心方名妙覺若了下釋若了迷性等但了所迷三軌之性更無佛果別從他生古德云但復本時性更無一法新三秪緣下明事極理亡秪緣因果理一用此一理為因理顯無復果名豈可仍存因號因果既泯理性自亡解復疏上因果無殊始終理一既以一理為因亦以一理為果大乘因果皆是實相故也理顯則因果俱亡理亦自泯故知因果乃取理之事得理則亡事一理乃能融之性故亦自亡鈔理顯等者對隱名因稱顯為果顯已無對果名豈存果能稱實名尚不存因既屬權故宜雙廢又對因果事立理融之所對既泯能融自亡解對隱下釋理顯無復果名對隱名因稱顯名果如前三千實相未顯名因顯則名果隱顯相對論因果也理性若顯無隱可對果名不存果能下釋豈存因號以果實不存況因權亦廢又對下釋後二句因果是事一性是理以理融事故因果俱亡所對既亡能融亦泯二秖由下依圓解明修證無得二初約法明惑智之體本虗秪由亡智親疏致使迷成厚薄迷厚薄故強分三惑義開六即名智淺深鈔言亡智者即上事理頓亡之智方能圓斷故云秪由圓人始終用絶待智頓亡諸法理果尚亡惑何次第秪由此智功力微著故成疏親由疏親故惑落前後名迷厚薄智疏惑厚智親惑薄傳傳明之此乃約智分惑也既有厚薄之義故強分三惑又義開六即名其亡智淺深若論亡智了於即理無一德可修無一惑可破強名厚薄淺深也解科惑智之體本虗者雖智有親疏迷成厚薄了於即理體本虗融也鈔初標示圓斷二秖由下約智分惑三若論下結歸圓斷即上事理頓亡之智指上科因果既泯亡事也理性自亡亡理也圓頓行者即境立觀能所泯亡始自名字終至等覺位位如是故云始終用絶待智非唯因果泯淨理性亦亡故云頓亡諸法理果尚亡者從勝而說置因而言果理果是所證之實體尚自泯亡惑障乃所破之妄情豈存次第若爾何故見思塵沙無明之惑有粗細厚薄故曰秪由等由此事理頓亡之智功力微故名疏著故名親鈔以微著釋親疏義智疏故厚惑前除智親故薄惑後落傳傳明之者相似已還觀疏力微故一體三惑粗者先落從強受見思塵沙之名分真已上觀親力著故一體三惑細者方斷從強受無明之號亦可分真已上位位迭論親疏厚薄之義由迷有厚薄故強分三惑乃不分而分也由智有淺深故義開六即不當開而開無淺深中而論淺深也若以圓融絶待妙觀體了惑智本虗智即理故無德可修惑即理故無惑可破修德無功是無作行方名圓斷也圓斷義章如四教儀又淨覺楞嚴說題云秪由觀力微著不同是故粗者先落細者後破非作意然任運然也竹菴補注云此為圓教先斷見思後斷無明約觀力說相傳前輩曾問觀力微則俱微著則俱著所破之惑何故不隨三觀之力同時分破作此問者甚有眉目今謂圓人一切圓融所破之惑乃偏情也偏情粗細故有先後從來學者以情難法圓詮諸法一切圓融為有偏情強分三惑耳二故如下約喻明修證之功不立二初明修證功亡故如夢勤加空名惑絶幻因既滿鏡像果圓解欲明修證功亡故約夢空幻像四喻以譬智斷因果皆成無作勤修智德由稱性故如夢中事了不可得妄惑本無假名不實如彼虗空但有名字如幻通喻上智斷之用故牒云既滿鏡中現像以譬果德斯圓鈔他云夢空幻像四皆是喻以對智斷因果釋意雖即不顯對法稍似相當又云空下須作此名其義甚便蓋言惑體如空但有名字故大乘十喻第四云虗空者空但有名而無真實等作此冥字義說雖衆終恐未親今秪圖顯理豈敢黨情如豫意者舊文諸字若稍有理即便遵行必諸聖眼洞見我心儻智短言疏未能稱理請諸匠碩示以彈訶然舉此四喻者蓋顯圓人妙解衆德元具萬惑本空雖立證修一一無作故勤修慧行如夢作為都無所辨惑但有名如空無實知無即絶復約智斷始終以明因果因無能感故如幻果非所克故如像解既稱實四皆無作因果既爾何有二邪解初敘他見二然舉下明今釋初又二初舉他對文改字之是二今秪下示今為法亡情之心他云等者珠指云此中四喻夢喻智空喻斷幻喻因像喻果言如夢勤加者正喻能亡之智也如夢本無由眠心故有覺已求夢叵得而夢事宛然諸法本空無明故有因智若發達性本無唯觀無性故云勤加空名惑絶者喻斷德也無明本無實體而但有虗名幻因者通喻智斷之因也鏡像者鏡中像也不取鏡但取像喻果之不可得耳文空下須作此名者彼云有別本作此冥者後人謬改耳意謂冥契真空之理故云惑絶今謂不然豈唯法喻不分抑亦懵於斷德文大乘十喻大品經通序讚菩薩功德云解了諸法如幻如𦦨如水中月如虗空如響如乾闥婆城如夢中如影如鏡中像如化大論云虗空但有名而無真實文二明今釋三初總示四意二故勤下別釋四喻三解既下結歸不二初句總標衆德元具示如夢勤加意萬惑本空示空名惑絶意萬惑者無明重數甚多處處說破無明三昧又云河沙煩惱證修無作示幻因鏡像意次別釋中勤修下三句釋夢喻慧行即智德也惑但下三句釋空喻即斷德也知無即絶者謂解知惑但有名而無真實即名為絶復約下四句釋幻像喻智斷之始為因智斷之終為果能成即因所克即果皆以法喻參合而釋結中圓解既稱實理故使妙行證修無作顯因果不二也二空像下明德障體異空像雖即義同而空虗像實像實故稱理本有空虗故迷轉成性解初句牒示義同空但有名鏡像無性故不實義同次句略標體異圓人指障即德何云體異今云異者體質之體也約迷悟論一往云異鈔空惑像果不實之義雖同而空但有名知無永絶像雖無性色相宛然故云空虗像實也像實等者釋成體異果德三千非今方得故論非果然稱本而證不可泯亡故云稱理本有迷即無明無明轉故即變為明迷名永失轉成性明故云迷轉成性他云須作性成若云成性則令果成因也若爾後文云了今無明為法性豈亦果為因邪解初正釋二引舊破初空惑下釋初義同空喻惑像喻果惑即所破之障果即所顯之德不實者上云惑但有名如空無實果非所尅故如像也而空下釋次句空虗像實略標體異知無永絶謂既知有名無體自然永絶無復有也像雖無性者鏡中現像非自他共離而生雖無性計色相宛然果德下釋第三句釋成像實果德所顯本自有之全性成修非適今有以性奪修故論非果如前果非所尅也果德既稱性而證性名不改豈可泯亡迷即下釋第四句釋成空虗迷時即法性為無明悟時轉無明為性明名轉體不轉也迷名永失同前知無永絶他云等者珠指云有本云成性誤也若然者則反令果成因也非性因成智果也文引下文斥非可見三是則下約圓乘明始終不二二初翻覆對揚明體一是則不二而二立因果殊二而不二始終體一若謂因異果因亦非因曉果從因因方克果解是則之言由上文意既其德障體異空虗像實是則立因果殊也今明因果不二故復應知二而不二始終體一若謂下反顯不二曉果從因等即順也鈔可解二所以下高廣無減明不二所以三千在理同名無明三千果成咸稱常樂三千無改無明即明三千並常俱體俱用鈔大乘因果皆是實相三千皆實相相宛然實相在理為染作因縱具佛法以未顯故同名無明三千離障八倒不生一一法門皆成四德故咸常樂三千實相皆不變性迷悟理一如演若達多失頭得頭頭未嘗異故云無明即明三千世間一一常住理具三千俱名為體變造三千俱名為用故云俱體俱用此四句中初二明因果各具三千三明因果三千祇一三千以無改故四明因果三千之體俱能起用則因中三千起於染用果上三千起於淨用解釋三千在理等科高廣無減者高即佛界之果廣即衆生之因高廣雖殊體無增減故因果不二也先通釋四句今經略開明諸法實相如是相等即三千故今約因果實相釋三千也因果皆實相者普賢觀云大乘因者諸法實相祖師以義加之大乘果者亦是實相三千皆實相相宛然謂性具十界皆是真實法法縱然不失自體故云宛然實相下釋初句三千在於迷理能隨染緣作九界法故云為染作因此三千中非無佛界未究顯故同名無明常途謂初句屬理即今據因從博地至等覺還又實相未顯名因總該前五等覺無明未盡三千未究顯故同名無明也三千下釋次句八倒者外計邪常等為界內四倒二乘無常為界外四倒極果所證一一法門法法皆常樂我淨名為四德但舉常樂任運有於我淨三千下釋第三句以不變性釋三千無改迷即因悟即果迷悟雖殊始終理一迷即無明悟即性明體不二故方名為即無明即明迷悟理一也失頭喻迷得頭喻悟楞嚴第四舉演若多晨朝照鏡愛鏡中頭眉目可見瞋責己頭不見面目以為魑魅無狀狂走忽然狂歇頭非外得縱未歇狂亦何遺失文演若多翻祠受三千世間下釋第四句初釋三千並常即今經世間相常也理具下釋俱體俱用問今云理具三千為體變造三千為用豈非理同故即對兩種三千耶答正明圓家全體之用方名不二也此四下總判四句初二明因果各具是知初句因中三千該前五即鈔此第四句明圓最顯何者夫體用之名本相即之義故凡言諸法即理者全用即體方可言即輔行云即者廣雅云合也若依此釋仍似二物相合其理猶疏今以義求體不二故故名為即上皆輔行文也今謂全體之用方名不二他宗明一理隨緣作差別法差別是無明之相淳一是真如之相隨緣時則有差別不隨緣時則無差別故知一性與無明合方有差別正是合義非體不二以除無明無差別故今家明三千之體隨緣起三千之用不隨緣時三千宛爾故差別法與體不二以除無明有差別故驗他宗明即即義不成以彼佛果唯一真如須破九界差別歸佛界一性故解別釋第四句初約體用不二明即義既云俱體俱用正顯體用不二具變雙明相即之旨故云最顯輔行文在一上十六荊溪不許二物相合論即直須當體全是方名為即如三道即三德生死涅槃之流皆體不二名為即也今謂下四明約全體之用他宗下約他對今家較得失又三初他宗真妄成合一理隨緣就他宗說下云別理隨緣約今家教義此段四明據賢首宗約義引文藏師起信論疏上之上十六一約體絶相義即真如門非染非淨非生非滅平等一味理無差別今云純一是真如之相二隨緣起滅義即生滅門隨緣轉動成於染淨染淨雖成性恆不動今云差別是無明之相一理即真如清淨是能隨九界差別是所隨又云直論真性乃無差別但隨染法差別故說無漏法有差別耳今云差別是無明之相純一是真如之相疏云不生不滅與生滅和合是隨緣門今云隨緣時有差別不隨緣時無差別故知一性與無明合方有差別謂真如守於自性未論緣起諸法時則無差別也今以義斷之既真妄和合方能隨緣正是二物相合非體不二相即義也除無明無差別者真如一性是佛界法與無明合則有九界差別之相若斷無明則滅九界唯有一性故無差別也二今家下今家體用是即體即理造三千不變性也用即事造三千即隨緣也今家全三千理體隨緣起三千事用方是圓教隨緣義也全理成事只一三千在修在性為體為用不隨緣時理具十界不少一法故云三千宛爾故隨緣差別三千事用與體不二也除無明有差別者名達為除修惡即性事造三千法體不動纖毫故云有差三驗他下判他宗即義不成他明即者藏疏序云不變性而緣起染淨恆殊不捨緣而即真聖凡一致華嚴疏云由不變故始終隨緣由隨緣故方能不變又云隨緣即是不變不變故能隨緣今格量他宗既破九顯一正是離義但有即名而無即義也鈔今家以即離分於圓別不易研詳應知不談理具單說真如隨緣仍是離義故第一記云以別教中無性德九故自他俱斷九也若三千世間是性德者九界無所破即佛法故即義方成圓理始顯故金錍云變義唯二即是唯圓故知具變雙明方名即是若隨闕一皆非圓極荊溪云他家不明修性若以真如一理名性隨緣差別為修則荊溪出時甚有人說也故知他宗極圓祇云性起不云性具深可思量又不談性具百界但論變造諸法何名無作耶解約即離分圓別又三初標示九界即佛界圓教義離九界說佛界別教義他破九界差別歸佛界一性但得離義正同今家別教也應知下引文示義應知他宗不明理具諸法不知全體起用單明一真隨九界緣作差別法正是離義引證者妙樂一云以別教中無性德九故自他斷九別修緣了而發本有常住法身文性不具九故須斷除豈非離義九界無所破者變造九界名為修惡性具九界名為性惡修既即性故九無所破性具九一雖有生佛色心等殊舉一全收從勝即佛變等唯二者金錍云變義唯二今云等者楞伽云不思議薰不思議變熏亦通別故云等也具變雙明者具是理體變是事用凡言即者須於諸法指事即理指修即性全用即體方是圓教體不二義三荊溪下以今驗彼妙樂云比讀此教者不知修性文修性各論三千屬圓他宗不明一理差別而論修性屬別甚有人說只云性起者他宗一乘圓教說四種法界謂性悔圓融理緣起無礙事相即相入事理主伴重重依正無盡事事此為至極之說但論變造何名無作者全具而變以性奪修方名無作鈔世人見豫立別教理有隨緣義惑耳驚心蓋由不能深究荊溪之意也且如記文釋阿若文中云別教亦得云從無住本立一切法無明覆理能覆所覆俱名無住但即不即異而分教殊既許所覆無住真如安不隨緣隨緣仍未即者為非理具隨緣故也又云真如在迷能生九界若不隨緣何能生九又輔行釋別教根塵一念為迷解本引楞伽云如來為善不善因自釋云即理性如來也楞伽此句乃他宗隨緣之所據也輔行為釋此義引大論云如大池水象入則濁珠入則清當知水為清濁本珠象為清濁之緣據此諸文別理豈不隨緣邪故知若不談體具者隨緣與不隨緣皆屬別教何者如云梨耶生一切法或云法性生一切法豈非別教有二義耶問淨名疏釋無明無住云說自住是別教意依他住是圓教意且隨緣義真妄和合方造諸法正是依他那判屬別答疏中語簡意高須憑記釋方彰的旨故釋自住法性煩惱更互相望俱立自他結云故二自他並無圓義以其惑性定能為障破障方乃定能顯理釋依他云更互相依更互相即以體同故依而復即結云故別圓教俱云自他由體同異而判二教今釋曰性體具九起修九用用還依體名同體依此依方即若不爾者非今依義故妙樂云別教無性德九故自他俱須斷九是知但理隨緣作九全無明功既非無作定能為障故破此九方能顯理若全性起修乃事即理豈定為障而定可破若執但理隨緣作九為圓義者何故妙樂中真如在迷能生九界判為別邪故真妄合即義未成猶名自住彼疏次文料簡開合別教亦云依法性住故須究理不可迷名此宗若非荊溪精簡圓義永沈也解約別理明隨緣義又三初斥世人不許二引文立義三據文結判世人者四明立別理隨緣諸師不許有永嘉繼齊師立隨緣指濫嘉禾子玄師立隨緣撲天台元頴師立隨緣徵決廣破今言諸師聞豫此說惑耳驚心蓋由暗於荊溪深旨荊溪雖不顯立其名備有其義連引三文示之釋阿若文如妙樂第一因疏釋阿若憍陳如陳如是姓阿若是名翻無知以無生智為名約四教釋無生別觀無生智云依於法界行菩提行記釋云依境起行亦指但理為九界覆而為所依法界只是法性復是迷悟所依於中亦應云從無住本立一切法無明覆理能覆所覆俱名無住但即不即異而分教殊今背迷成悟專緣理性而破九界文別圓同詮真實之性性不定住皆能立法故云亦也佛界但理不即九界能覆真理雖皆無住即則是圓否則是別是知無住立法與真如隨緣同出而異名既許所覆真理名無住本豈非別理隨緣耶仍未即者非理具故蓋由別教能隨是真如但中佛性所隨染緣作九界法九非性具但隨緣起須破九顯一故不相即圓則全性十界隨染淨緣變造事用修之與性體用恆同既全性起修故全修即性修九即性九下文明圓教隨緣云體具明隨自異權教今但理明隨與實教異也真如生九亦是釋阿若文真如不守自性隨無明緣故曰在迷由隨緣故能生九界反以生法顯出隨緣故曰若不隨緣何能生九竹菴謂四明以生法為隨緣厚誣之也須知真如在迷正語能隨能生九界方論生法由隨緣故生法引輔行者止觀云只觀根塵一念心起即是假名假名之心為迷解本輔行釋云照知一心起無量心心無量故迷解無量迷則十界苦集解則四種道滅楞伽第五云如來藏為善不善因者即理性如來為善惡本應以十界互為善惡又引大論如今文別教根塵一念具理性佛界故引楞伽以理性如來證一念也以善證解不善證迷因即本也故根塵相對所起一念為迷解本即理性如來為善不善因隨無明緣作九為迷隨師教作佛為解即染淨二種緣起也他宗所據者藏師立隨緣正憑此文起信疏之一云隨緣起滅義即生滅門謂隨熏轉動成於染淨乃至引楞伽云如來藏為善不善因文池水等者水喻一念珠喻淨緣清喻佛界象喻染緣濁喻九界此喻通圓別今文喻別但云象入則濁下文喻圓則曰濁緣與水俱有也故知下兼明生法先簡不談體具標隨不隨復引梨耶生法證不隨緣引法性生法以證隨緣若單云妄出生九界直明生法耳若云法性出生九界隨緣義也法性若不隨無明緣安能生九一切即九界法單明一界不言一切故此亦悉檀被機說隨不隨若約理論單真不立獨妄難成真妄和合方能生法別圓皆爾但以具不具分即不即揀如云梨耶等者妙玄云諸論明心出一切法不同或言阿梨耶是真常淨識生一切法或言阿梨耶是無記無明生一切法等文應知今云不隨與前不隨緣時則無差別言同義異今云不隨乃指梨耶直明生法不說隨緣前云不隨乃是真如守於自性未論緣起時也問答料簡說自住等者此引淨名疏八十九立問若據記釋別圓各有自他疏中語簡又從各說別自圓他或據此文便謂別既屬自則隨緣義不成豈知別教還有自他之義故答中指出別教具有自他今且準疏依他屬圓難答中約疏簡憑記釋為答法性煩惱俱立自他者記云說自住是別教意者是說煩惱法性體別則是煩惱法性自住但名為自亦可云離煩惱外別有法性法性為他亦可法性為自離法性外別有煩惱煩惱為他故二自他並非圓義故今云更互相望以立自他指前之自及後自他故名為二釋依他云者記云依他即圓者更互相依等由體同異者別教無明法性體異圓教無明法性體同今釋下釋記文義先釋以體同故依而復即無明法性體同故全體起用用還依體用即體也性體具九對別無性九起修九用對別修說無明依法性起修九用謂全法性體所具九界起九界修惡之用此用還依性惡之體若法性依無明起修佛界淨用亦全無明體所具佛界修善之用此用還依性善之體今文且就隨九界緣邊說性善性惡雖有九一之殊而皆融泯舉一全收並名為體對別但論九耳若不下釋別教惑定為障義別無性九顯圓性體具九自他斷九顯圓不斷但中之理能隨染緣作九界法全是無明之功即真如在迷能生九界亦是法性與無明力造諸染法既非體具明隨非全性起不名無作故無明惑性定能為障故須破九顯佛界但理也若全性起修等者復約圓義全體隨緣全性起修指隨緣事即不變性方名無作障既即德不須斷除顯於別教定須破顯若執下酬答前難若謂但理隨緣作圓義者其奈妙樂文何既許真妄和合方造諸法正是合義終成二法各自住也不同即義故云未成料簡開合者淨名疏八一十七紙云無住有住有開合否答若合無明即是法性法性無住無明無住故言無住此是圓教相即之義此合是即也若開法性出無明無明依法性亦得言有住有住者依法性住法性非煩惱即是無住文記釋曰此中開合合義唯圓開義唯別圓亦論開非一向異與別永殊別但具開無合諸文明別亦真妄合此合還開今合乃是即之異名耳若開下正示別義法性是所覆無明是能覆能所兩別故曰開出開離也合即也文圓中合義如云緣了與性一合合即也此宗等者鈔上云若不精揀何稱圓修此義難得的當因果門更甄之鈔主至此揀判引荊溪文證定故有此語隨緣名出他宗義蘊經論起信論疏序云不變性而緣起染淨恆殊不捨緣而即真聖凡一致疏釋真如門立二義一真如不變義二隨緣起滅義又云真既不變云何隨於染淨既有染淨云何不變釋云如海因風起於波浪浪雖起滅濕性不變不變之性不礙起浪浪雖萬動不礙一濕是故動靜無二法也文義蘊經論者法華經是法住法位世間相常住荊溪作不變隨緣釋知法常無性佛種從緣起大師釋云中道無性即是佛種不變義迷此理者無明為緣九界起解此理者教行為緣正覺起隨緣義藥草喻品云一相一味大師引淨名從無住本立一切法作事理本法釋理即不變事即隨緣妙樂釋此文後結云隨緣不變理在於斯文楞伽第五云如來藏為善不善因他宗所據大論云如大池水象入則濁珠入則清等隨緣者對不變說不變即中道理本有不改之義隨緣乃全理成事轉變造作之義良由真如不守自性故受熏變隨於染淨二緣故名隨緣體相者別教不變以真如一性如來藏理為當體體無明差別為所依體隨緣則以無明差別為當體體如來藏理為所依體圓教不變以理造三千為當體體隨緣以事造三千為當體體並以一念妄心為所依體不變即性具三千相相宛然為相隨緣則以真如無明互相熏習成染淨二用為相起信云真如淨法實無染相但以無明而熏習故則有染相染熏淨無明染法實無淨業但以真如而熏習故則有淨用淨熏染初是從真起妄次是反妄歸真因茲真妄之緣故有染淨二用之相指要云淳一是真如之相差別是無明之相隨緣時則有差別不隨緣時則無差別文則知不變乃一理無差隨緣以無明差別為相也他宗建立彼立五教草創於帝心因循于至相開判於賢首帝心即杜順法師造法界觀通華嚴於中有五教之義洎乎至相儼尊者方顯名義如孔目章云云賢首藏法師起信論疏云教類有五一愚法小乘教但說我空縱少說法空亦不明顯但依六識三毒建立染淨根本未盡法源故多諍論二大乘始教亦名別教於中但說諸法皆空不盡大乘法理故名為始三大乘終教亦名實教說如來藏隨緣成阿梨耶識緣起無性一切皆如定性二乘無性闡提悉當成佛方盡大乘至極之說故名為終四大乘頓教總不說法相唯辨真性亦無八識差別之相呵教勸離毀相泯心但一念不生即名為佛不依地位漸次故名為頓五一乘圓教所說唯是法界性海圓融理緣起無礙事理相即相入事理無礙帝網重重主伴無盡事事無礙故名圓教文彼判起信論如懸敘義門中云若於五中顯此論之分齊正唯終教亦兼於頓文彼判隨緣正在終教亦兼於頓如起信論疏若據清涼亦兼於圓以隨緣義為究竟之說如華嚴出現品疏云不變隨緣之義乃為諸佛之本性相無礙因果圓融為不思議過此更無究竟文故四明二十問中第四云藏疏五教既皆不立理具三千但就不變隨緣立終頓圓三教文次今家引用一如止觀大意云隨緣不變故名性不變隨緣故名心二如金錍云萬法是真如由不變故真如是萬法由隨緣故三如妙樂云隨緣不變理在於斯文三文皆圓教相即之義不同他宗一理隨緣但是合義今家圓教隨緣如指要云今家明三千之體隨緣起三千之用不隨緣時三千宛爾故差別法與體不二文圓中實理體具諸法全體起用修性無殊事理不二之義也次別理隨緣者荊溪引用並在圓教法智已前及同時人皆昧荊溪之意只知圓教隨緣則抑今之圓同彼終教唯我法智深究荊溪之意酌量其義中興教門特於別教顯立隨緣之說則顯他宗終頓圓三教所立不談理具單說真如隨緣仍是離義正同今家別教故於指要引文誠證楞伽云如來為善不善因是他宗隨緣所據輔行却引此文以證別教根塵一念為迷解本豈非別理有隨緣義豈非他立隨緣只齊今家別教耶四明立義可謂深切著明奈何同時昧旨不許此說有永嘉繼齊師立隨緣指濫破之孤山有長書請嘉禾子玄師同破玄師立隨緣撲撲滅其義故四明有別理隨緣二十問問於齊公後天台元頴師立隨緣徵決以代齊公答二十問時淨覺在四明輪下撮三師難意以十門折難闢之今原四明特立別理隨緣義者柏庭云有二義故一以教理當然蓋別與圓同詮真如變造但約即不即具不具以分別教若非隨緣安能生法理之所在孰曰非邪二者判他屬別然而彼宗雖明不變即隨緣等以不談具則非全體而造雖曰相即還成離義以非即具之即故也故今判之但齊別教而已文逸堂曰四明立別理隨緣乃中興一家圓頓之教誠哉斯言近代竹菴亦乃不許乃云檢盡諸文莫過生法淨覺非是是非良可笑也竹菴不究荊溪文意只由真如不守自性隨於染緣方能生九界法故四明云若不隨緣何能生九況淨覺雖是未背宗前作十門析難扶成四明闢齊玄頴三師之說其間亦有未盡之義如第一門敘齊師難曰隨緣之名對乎不變不變之稱對乎隨緣反覆相成如波水矣敘他師不變隨緣相即而言別理有隨緣不變義者果有也即邊之中豈是別教果無也名不孤立安稱隨緣明別教即無隨緣義析云藏疏云不變隨緣者皆真如二義也彼立無明自有二義一無體即空義二有用成事義無明二義即別教二邊也至且真如二義自論相即別理二義何嘗不即那忽將事而難於理皆指事中隨緣之性與不變之性自論相即以理望事終成相離須斷九界歸一性故文今謂淨覺酬齊師之難以正理考核良恐未然蓋淨覺失究分門立義藏疏隨緣雖在真如門立乃謂真如能隨於緣當其隨緣即生滅門須知今家別教能隨所顯只一真如所隨所破只一九界四明說別理隨緣只是真如能隨染緣生九界法本無相即之說如指要云他宗明一理隨緣作差別法至正是合義非體不二驗他宗明即即義不成今家以即離分於圓別不易研詳等據此則別圓皆有隨緣之義但以即不即而分教殊別理隨緣不談理具非全體之用無相即之義也他雖說不變即隨緣隨緣即不變既不談具正是合義即義不成但有即名而無即義正同今家別教讀教記說義亦本析難但精看指要文義是否自知復次別圓二教俱論生法亦以即離分二教殊並須真妄和合故論云唯真不立獨妄難成真妄和合方有所為文楞伽云理性如來為善不善因理性屬妄如來屬真起信論云不生不滅真與生滅和合生滅是妄妙樂云真如在迷真如是真在迷是妄覆理無明無明能覆真如所覆諸文並約真妄合論生法也鈔他云舊本云三身並常今問如何說俱體俱用邪他恐應身說體法身說用不便乃自立云舉體全用縱茲巧釋義終不允解破謬改字舊本云者珠指云三身並常俱體俱用者三身果滿咸成四德舉體全用也文破斥如文此以修性不二門成
