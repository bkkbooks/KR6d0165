front:
  text: 重刻十不二門指要鈔詳解引十不二門指要鈔者妙顯荊溪之意善示修證之要而無極大師所著詳解消釋詳悉意旨精密大有功於學者焉第其分會有未盡善者加之國本脫誤尤多則蒙學之士往往病焉余曩訪獲善本對挍一通及竊正分會之未善者猶慮其未詳不丞刻梓客秋因本寺講鈔復細為挍訂質諸老師宿衲而剞劂流通讀者誠由文辭之易曉以開發妙解則庶幾此舉之務立行造修之一助乎時元祿癸未秋八月朔旦天台山沙門亮潤敘于德王之圓覺室中重刻十不二門指要鈔詳解凡例九條國本有脫誤者今依明本悉讎正之其明本有疑誤者於格上書某字疑某字釋籤及鈔嘗有諸本與此所合不同者亦書某字一本作某字會本每卷之首列撰人直斥二祖之諱非所以尊祖也今並刪之惟存某尊者之稱會本所標之釋題之科既非鈔科亦非解文蓋分會之際欲對釋文之科私添入耳今欲不濫鈔科盡刪去之會本不標指要述人而反標釋籤述人大非鈔解之意今據鈔解標否得當會本標鈔科每科刪某下數字及往往改削字句者今據原文悉補之無復一字之損傷會本數處私補結門之科理雖當有亦不可謾添今別標諸格上以便見前後應對會本分會差謬者凡三處今並改會之此番重刻務在刪補會刻之增損完全各書之原文然惟釋籤指要有別行之可考而詳解則別行亡久故今多所可疑而不得而挍證讀者詳焉而可也合刻十不二門指要鈔詳解序指要鈔者開十不二門之妙鑰也其語深其義邃非利根上智曷能通之有宋可度無極大師深明一家教觀為之詳解誠如執柯折薪遊刃破竹矣然其本𨤲而未合也學者病之天台雲石師乃無盡大師之高足其兄以玄師亦法門之偉人每念及之時復扼腕乃留意參會成帙未梓行而寂雲公憫兄齎志毅然繼志而梓之以公同學不亦善哉噫此解流通台宗朗如日星矣合帙而觀用志不分法華開會之大旨則又思過且半矣得非大有功於後學歟是不可一日少緩也丞募檀資以付剞劂氏梓成問序於余余愧無文而直述其會刻之顛末昆仲之苦心如此云崇禎辛未端陽後二日武林天台後學沙門海眼槃談書於報國院十不二門指要鈔詳解總序夫具妙心者人悟妙心者佛闡妙心者教釋妙教者祖祖言既玄必因門而入妙門雖闢須得要而登既指要之可憑必詳言而始解妙法蓮華經者闡妙心之至教了佛意之玄詮如來説之於八年結集堆之以八里梵册傳來猶太倉之粒粟童壽翻譯如滄海之一漚然而縮一劫為一日妙在神通藏剎海於一塵玄由至理是則雖粒粟可以為太倉之種一漚可以收滄海之深七佛繹經之師六萬傳心之旨斯言不謬厥義可徵若夫嘗一粟而衆味具存見一漚而瀛渤俱在則惟在吾天台智者大師之具足五舌五眼乃能得之也蓋大師靈山夙聞大蘇妙悟縱無礙辨稱性宣揚依迹本二門開待絶二妙如來大事因緣衆生佛之知見至是殆無餘蘊矣第迹門非遠十妙難通至理雖彰妙心難悟由是荊溪開以十不二門四明指以一念心要噫若如來之與智者可謂破一微塵而出大千經卷荊溪之與四明可謂合大千經卷而歸一微塵則法華玄義迹門十妙十不二門指要鈔者真直指人心見性成佛之要門無離文字而説解脫之祕典也惟約為博源略為詳本不有錢塘可度大師孰傳四明法智精義發為詳解十數萬言譬王家椒室相宅朱門非主壺者而莫識其淺深非司閽者而莫啓其階降良遺澤於後崑流芳於末運者也惜其未入大藏散於僧寮徒仰嘉名不獲寓目有四明延慶寺僧傳慧字朗初者詩酒僧也偶於山寺得獲此書雖知井中具寶不解燃炬而觀以之進余用當清供余得之如熱渴之滿飲甘露飢餒之飽飫醍醐冀登梨棗以公同志復以鈔解各行艱於尋繹命弟子正謐會合其文藏之笥中三十年矣茲弟子正識堅誠募梓因緣輻輳大法當行垂老覩茲頗為稱快然而歸功有自慧僧不無緣因即此可以懺生平綺語截舌之𠎝釋積劫麴糵灰河之罪因斯冥益重得為僧以實語讚性具之宗慧業裂迷癡之網併將功德普惠四生若自若他俱臻十妙是可酬山僧流通之志與兩弟子錫類之心爾時皇明天啓五年歲次乙丑仲冬天台山幽溪沙門傳燈著於四明延慶寺之羅雲堂十不二門指要鈔科鈔科分二初釋題二初正釋題十二述人號荊二釋文三初總敘立意四初序前文立述作之意二初敘前二初敘教廣二初十妙意燃二衆釋意凡二敘觀略觀二立意二初重示大部意所二正明今述意二初為成妙解故二為成妙行故二例後義彰法理無殊二初例本妙若二例四章況三別示妙體令解行俱成三初指妙歸心若二示成由行則三功成識體則四結示立名使詮旨斯顯四初立門所由故二出門名義何三各自高深一四直彰宗趣本二列門解釋三結攝重示二列門解釋二初列門對妙二初列門一二對妙是二釋門旨趣十初色心不二門三初標一二釋二初約諸境明總別二初雙標且二雙示二初別何二總既二就理事明諦境二初約理事明三諦二初明理事當二結成三諦是二會生佛居一念故三結故二內外不二門三初標二二釋二初明內外境觀二初標示凡二釋相二初明外境觀相外二明內境觀相所二明內外融泯二初互融是二俱泯誰三結此三修性不二門三初標三二釋二初修性雙立三初修性對論二初直明性德性二以修對辨二初明相成性二明互具在二明逆順相反二初明對逆故二性並存修二明因順故二心俱泯可三明離合本同二初約法明離合相異又二約喻明修性體同二二修性俱立正示不二應三結此四因果不二門五染淨不二門六依正不二門七自他不二門八三業不二門九權實不二門十受潤不二門四因果不二門三初標四二釋三初就圓理明因果暫存三初明始終理一衆二明悟迷事異二初問二答三明事極理亡祇二依圓解明修證無得二初約法明惑智之體本虗秪二約喻明修證之功不立二初明修證功亡故二明德障體異空三約圓乘明始終不二二初翻覆對揚明體一是二高廣無減明不二所三結此五染淨不二門三初標五二釋二初明所顯淨法二初染淨體用理無增減三初法二初明染淨體若二明染淨用法二喻濁三合清二界如緣起性本圓常二初約性德直示故二約修成反顯故二明能顯妙觀故三結此六依正不二門三初標六二釋二初明果用由因本具三初示依正不二二初明不二之由巳二示不二之相以二明因理本融二初明三位本妙是二示一切皆融但三明始終無改二初明情智局遍然二明體用常融二初略示始二廣示故二明理顯以觀為功二初克彰觀行之功若二結示生佛一致如三結此七自他不二門三初標七二釋二初示感應之體本同二初約法示三初約一性明自他隨二約三千明感應如三約俱具明道交衆二約喻示二初順喻不二反喻若二明觀行之功方顯二初帶喻彰用匪功成若二就法明發由觀合應三結此八三業不二門三初標八二釋二初明所顯果用二初約對機顯逗會無差二初示三輪不同於二明真應復殊在二約稱理明卷舒自在二初融身説二二曾三輪身二明能顯觀體三初結指心因豈二觀成用顯百三染體本妙故三結此九權實不二門三初標九二釋三初明等鑒由理融平二遍逗由心證至三結示歸理一對三結此十受潤不二門三初標十二釋三初明權實本圓薰修如幻二初由具可薰物二因薰可發若二明生佛一際欣赴不偏然三明地雨無殊利益平等故三結此三結文示意三初明十門通貫理體無殊二初約十門明理一是二約十妙明理一如二明一念包容觀行可識三初明一念觀境之功既二明心法攝成之要若三明重述觀行易明故三明得意符文總別無異首十不二門指要鈔科終十不二門本迹二十重妙十不二門指要鈔序詳解宋慈雲懺主遵式序宋武林沙門可度詳解明天台後學正謐分會指要鈔序解此題上三字是所序之正文序字是能序之通目以別冠通故云指要鈔序指要二字本序自釋鈔者鈔録為義西資鈔序云夫疏之有記鈔蓋後學之曹記録要義抄寫格言以輔翼其疏防乎傳受之謬誤討尋之忽忘耳文序者所以序作者之意爾雅云東西墻謂之序注云所以序別內外也文謂見墻別宅舍之淺深觀序知述作之難易又序緒也謂繭之緒也凡繭之抽絲先抽其緒緒盡方見其𮈔今序在初如𮈔之緒也光記序東山沙門遵式述解東山即台之東掖山能仁寺懺主云東掖山者蓋豫幼歲受經之所時年傳法之地也懺主族姓葉氏台之寧海人其母乞靈於觀音大士夢一美女授以明珠咽之生師七月能從母稱觀音名十八祝髮二十納戒初住寶雲終於天竺與法智同稟學於寶通雲師指要既成乃為述序發明述作之功沙門如常釋述者禮云述者之謂明作者之謂聖今云述者蓋謙詞耳語云述而不作序大教隆夷存乎其人諸祖既往玄化幾息時不可久替必有間世者出焉解通敘教法興衰在人通指佛法以為大教妙玄總序云大法東漸籤云通指佛教以為大法文此對西土外道此方儒教約內外而分大小隆盛也夷平也文選云道有隆夷文即興衰之義易曰神而明之存乎其人文存在也謂教法興衰在人得人則興失人則亡禮云文武之道布在方策其人存則其政舉其人亡則其政息文諸祖者通指荊溪已前諸祖在世教法盛行諸祖既往則幽玄之化幾近於息滅矣文選云仲氏既往玄化幾息繫辭曰易不可見乾坤或幾乎息矣文替廢也間世即名德間生於世孟子曰五百年必有王者興其間必有名世者文以時節不可久廢不遠而復必有間生者出興於世荷負斯道四明塔銘云天欲久其道世必生有人文間世者誰故出其人序四明傳教導師禮公實教門之偉人也解別敘傳弘之德四明乃慶元府南面山名有峰最高四穴在上每澄霽望之如戶牗相傳謂之石窗謂四畔通日月星辰之光故曰四明人尊其道故以處名人傳轉也以己之道轉以授人導師者法華云有一導師聰慧明達文尊者上字諱知下字諱禮二名不偏諱故稱下字公者尊之稱也偉大也謂奇偉卓絶一家教觀賴師中興故稱偉人此且總歎序童子受經便能思義天機特發不曰生知之上性者乎解童子即太和未散之時幼稚之稱爾雅云人未冠曰童禮云人生十年曰幼學二十曰弱冠文弱冠已前皆名童子尊者七歲屬母喪為報鞠育急於出家從里中大平興國寺洪選為弟子即童時也受經思義雖不見所出尊者之母既夢梵僧遺童子曰此佛子羅睺羅從而有孕初出家時從師受經必能思義懺主與師同門必知其事天機特發者天然之機挺特而發莊子云其嗜欲深其天機淺文不曰即豈非之謂語云生而知之者上也今借用以擬本有性德宿習開發義似生知止觀統例云生而知之者蓋性德也學而知之者天機深也序及進具稟學於寶雲通師初預法席厥父夢其跪於師前師執瓶水注於口中其引若泉其受若谷於是乎天台大教圓頓之旨一受即了不俟再聞師謂之曰子於吾言無所不達非助我也逮師始滅公復夢貫師之首擐於左臂而行解敘師資授受自行化他事匪偶然故有奇相形於夢寐預表彰焉進具謂進受具戒稟學者按實録曰十五受具戒專探律部二十從寶雲學天台教文通師本高麗君族壯遊中國當晉天福年間見螺溪寂法師了天台宗旨會漕使顧公捨宅為寺以為傳道之所即寶雲寺也初預者預廁也入也初入寶雲師輪下其父之夢蓋受學之先讖也父金性諱經夢尊者跪於通師之前通持瓶水注於口中其引若泉來之而不竭其受若谷注之而不盈孟子曰源泉混混不舍晝夜谷者説文云泉出通川曰谷爾雅云水注川曰溪注溪曰谷謂師之樂説無窮如泉之不竭尊者之容納如谷之不盈谷音欲若作穀音者訓空谷窮谷也於是猶自此也天台大教特言圓頓者別於藏等四教舉其極者言之一家所談功由即具尊者自此於寶雲言下一遍受之即能解了不俟再聞師謂之言即印可之語凡師資授受難疑問答更相啓發今一聞即了不假再詢其於啓發之道何有哉故曰非助我也語云回也非助我者也於吾言無所不悅文顏子於聖人言下默識心通無所疑問故曰非助我也尊者亦然通師深讚之言也逮及也通師示寂於端拱元年初入滅時尊者又得傳持之讖貫穿也擐音患帶也左傳云擐甲執兵蓋夢穿師之頭帶於左臂而行夢雖似異有所表故序嘻得非初表受習若阿難瀉水分瓶之莫二也後表傳持操師種智之首而行化也解此示夢不徒然必有所表嘻歎聲初父之夢表尊者受習通師之道如水分瓶猶如來説法阿難傳受如水分瓶更無二也大經云阿難自侍我來持我所説十二部經一經於耳曾不再聞如分瓶瀉水置之一瓶文後表等者後夢即表持於種智之首行化於他法門身以種智為頭即中道種智即三而一也光記三云一切智是萬行首故以為頭序淳化初郡之乾符寺請開講席諸子悅隨若衆流會海繇是堂舍側陋門徒漸繁未幾遂遷於保恩院焉法華止觀金光明諸部連環講貫歲無虗日解敘遊化處所説法年代淳化即宋朝太宗年號二年辛卯歲也尊者年三十二出世住持誓辭曰豫居寶雲既值鶴林始遷乾符西偏小院乾符改承天今為能仁西偏小院即今法華附庸院也悅隨者所謂道不求揚而四方盡聞衆不待召而千里自至易曰剛來而下柔動而悅隨文梁學士云學者悅隨如群流之會通川也文繇由也側謂逼仄陋謂隘陋住處狹陋學徒加多遂遷居焉未幾猶言居無幾何實録曰淳化辛卯受請乾符寺綿歷四祀遂遷於保恩院文即今之延慶法華該乎玄句諸部總包諸章疏也實録曰專務講懺常坐不臥足無外涉修謁盡遣前後講法華玄義七遍法華文句八遍摩訶止觀八遍大般涅槃經疏一遍淨名疏二遍金光明玄疏十遍觀音別行玄疏七遍觀無量壽佛經疏七遍金剛錍止觀義例止觀大意十不二門始終心要不計其數文連環者莊子云連環不可解也荀子曰始則終終則始若連環之無端文講貫者講説之道使義理貫通無礙國語云朝而受業暮而講貫文尊者四十餘年專務講説連屬循環未嘗一日虗棄序嘗勗其徒曰吾之或出或處或默或語未始不以教觀權實之旨為服味焉為杖几焉汝無怠也大哉解尊者常以弘持教觀為己任即以自行而為化他勉勵來學勗誡也出處語默者繫辭曰君子之道或出或處或默或語文今借用其語以示四儀常在教觀故云未始等也教即能詮之教觀即所修之行教行二途缺一不可權謂權謀實謂真實若權實不分則昧於化意所謂為實施權等服則被身味則充口行則倚杖坐則憑几皆日用不可須臾缺也其於教觀權實未始暫忘亦猶是也解謗云豫自濫講四十餘年凡釋一文申一義未嘗不以部味教觀而為憑準文以己所行勉勵其徒故云汝無怠也既自彰於言可得稱讚曰大哉也序若夫被寂忍之衣據大慈之室循循善誘人不可得而稱矣解言其三軌匠物人莫能知然涉世弘經必須柔和忍辱運大慈悲了諸法空方能取成大利若夫發語之端衣座室三缺一不可令成文體且言其二祭文則曰開慈悲之室踞法空之床其義是同循循者語云夫子循循然善誘人尊者訓人循循有序亦如是也其化導之功莫大故云不可稱矣序釋籤十不二門者今昔講流以為一難文也或多注釋各陳異端孰不自謂握靈蛇之珠揮彌天之筆豈思夫一家教觀殊不知其啓發之所解正明述鈔由致釋籤者玄文有疑弟子籤出荊溪釋之師資合標門師序云因籤以釋思逸功倍文荊溪於本迹二門之間述此十門後人録出別行於世自昔至今講解之流皆為難曉之文蓋斯文乃本迹之文心三部之綱要教觀旁正之意彼此相成之説事理二造一念三千修性離合即具隨緣本法總別揀境立陰種種大義蘊在其中文約義豐誠不易曉由謂之難解釋者衆如清師示珠指昱師注文更有他師著述故云或多諸師消文曲隨己見而不得一家正意故云各陳異端孝經序異端起而大義乖文雖所見暗短莫不自矜己能謂得佛祖之意故曰孰不等靈蛇珠者史記云楚臣隋候出行見牧童打傷蛇腦侯憐之用藥塗治而去一夜偶見庭中有光燭之乃一蛇銜珠在地自言我本龍子變形遊戲為牧童所傷賴君以救今擕珠以謝侯得之進楚王王置殿上發光如晝文彌天筆者梁僧傳云道安法師文理通經德望隆重時習鑿齒鋒辨天逸時往謁見既坐稱言四海習鑿齒師曰彌天釋道安時人以為名對筆者蓋取三分分經符合經論故云也文意謂諸師自言所述之文除後學之疑如靈蛇珠光耀破暗契佛祖之意若安公秉筆分經合論龍子變形故曰靈蛇文選云人人自謂握靈蛇之珠家家自謂抱荊山之玉文豈思等者鈔中所破清師解今一念為真心昱師不立陰境唯觀不思議境一家教觀揀一念妄心為入理之門起觀之處若唯觀真及不思議則不知啓發之所矣序公覽之再歎豈但釋文未允奈何委亂大綱山隤角崩良可悲痛解尊者披覽諸師所述失旨咨嗟不已故云再歎允當也委墜亂紊非但釋文未為允當抑且委墜紊亂大綱大綱者何即一念三千即空假中山外棄妄觀真及不思議即墜亂大綱也未允者之字訓往造謂體同改二十來字山頽者禮記檀弓曰泰山其頺乎梁木其壞乎哲人其萎乎角萠者書云百姓凜凜若崩厥角言民畏紂虐危懼不安若崩摧其角無所容頭今取二事喻解行不正委亂教門綱紀如泰山之頽邪説暴行使學者無所趣向危懼不安若畏紂之虐序將欲正舉捨我而誰遂而正析斯文旁援顯據綽有餘刃兼整大途教門權實今時同昧者於茲判矣別理隨緣其類也觀道所託連代共迷者於茲見矣指要所以其立也解正明述作將欲扶顛持危正舉斯道捨我其誰哉孟子曰如欲平治天下當今之世捨我其誰哉文析剖也楞嚴云析出精明文正則剖析十門奧旨義理泠然旁則援引佛祖誠言顯據免生疑謗綽寬裕也孟子曰豈不綽綽然有餘裕哉文刃者庖丁解牛數千而刀若新發硎然其於遊刃必有餘地文言得其妙處也兼整大途謂消文合理之外復能整大途即教門權實觀道所託權實者前之兩教教證俱權圓教教證俱皆是實別教教權證實意稍難曉今時同昧即齊玄頴三師但見荊溪有圓教隨緣之説尊者深究圓別教旨以別教真如既能生法安不隨緣特立別教理隨緣之義以圓別同詮中道而但不但殊別則教權故但理實故中以理實故亦説隨緣以教權故顯非即具他宗於終頓圓三教皆明隨緣只云性起不云性具驗非圓教故尊者格量他宗所談但齊今家別教類謂流類鈔中引妙記專緣理性是別教義等觀道所託即介爾妄心一家入道不可遠求即剎那心顯三千法豈同山外棄妄觀真始因慈光恩師兼講華嚴以華嚴心造為真心自此奉先清師梵天昭師孤山圓師謬有承襲皆謂觀真故義書云蓋由上人師祖已降皆謂心獨是理文若此之迷非始今日故云連代四明立宗則指介爾之心為事理解行之要以此正説格彼謬談故曰於茲見矣等逸堂云教門權實觀道所託所以四明得為中興教觀功在於茲序至若法華止觀綱格之文隱括錯綜略無不在後之學者足以視近見遠染指知味易不云乎通天下之志定天下之業斷天下之疑實此一二萬言得矣解言二卷之書而於三部綱格之文莫不該攝綱謂綱紀如網之外圍格謂格正如物之大體隱括者荀子云抅木必將待隱括注云正曲木之具錯綜者如易三五以變錯綜其數所謂河圖洛書今是洛書之錯綜也謂戴九履一左三右七二四為肩六八為足中則有五縱橫交錯皆十五也門師輔行序云豈唯錯綜所聞將以隱括所治所治即行三多之妙運遽階所聞唯解一真之玄覽斯㳷今法彼文謂玄句開解止觀明行三部綱格之文所治所聞若解若行皆萃此書也視近見遠謂閲指要之近可以見三部之遠究指要之意趣如染指於鼎然後知三部之味染指者左傳云楚人獻黿於鄭靈公穆公太子夷也公子宋與子家將見子公宋之字子家歸生字也子公之食指動以示子家曰他日我如此必嘗異味及入宰夫將解黿相視而笑公問之問所笑子家以告及食大夫黿召子公而弗與也欲使食指無驗子公怒染指於鼎嘗而出文今取染指之微知全鼎之味如覽二軸之文言達三部之義旨易不下復借易中三句通結指要述作之功可以通達今時同昧教門權實之志可以定連代共迷觀真觀妄之業引佛祖誠言證成其義斷學者之疑序式忝同學也觀者無謂吾之亦有黨乎取長其理無取長其情文理明白誰能隱乎云也解敘作序之意因釋他人之疑式者懺主自斥其諱古人亦尚單稱如涅槃疏云頂滯於豫章釋籤序云普早歲在塵謂忝與四明同一師學為斯鈔序理之當然毋謂言辭虗餝情黨所及語云吾聞君子不黨疏曰相助匿非曰黨後人不必致疑特文理優長宗旨明白昭昭然若揭日月於青天使之沈沒可乎故曰誰能等
