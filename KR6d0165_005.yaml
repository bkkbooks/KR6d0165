body:
  text: 唐荊溪尊者釋籤宋四明尊者鈔宋武林沙門可度詳解明天台後學正謐分會五染淨不二門三初標五染淨不二門者感通鈔以在纏心變造諸法一多相礙念念住著名之為染以離障心應赴眾緣一多自在念念捨離名之為淨今開在纏一念染心本具三千俱體俱用與淨不殊故名不二有人云染即是感淨即是應不解文旨但對而已須知此門指果後淨用凡夫染心已具乃令觀此染心顯於淨用并後依正俱在能應自他不二方兼於感觧釋標文分三初釋染淨今開下釋不二有人下斥謬中先敘舊解斥謬次示正釋兼明門義在纏心者凡夫為煩惱縛著遍造九界諸法全屬無明故名為染離障心者果後離三障故緣扣即應故名為淨問在纏名染離障名淨約六即位如何分對答前明因果因從愽地至等覺還果唯玅覺鈔釋俱體俱用謂因中三千起於淨用果上三千起於淨用今明染淨二用須約因果分之前明終至金剛皆有謂實即今云念念住著豈非等覺猶有一分在纏然義有進退若論相似位人六根遍照即相似離障況諸文以觀行相似位坐道場為如佛則在纏且齊名字已還又雖論觀行相似離障克論應取初住已上聖位離無明障方名離障但文云果後淨用復須的指玅覺故云雖通傳立約極義強今開在纏染心但開名字五品圓解已深能知如來祕藏則不論開五品既爾相似可知今文正意指玅覺果後遍應眾緣之淨用全在名字凡夫之染心觀此染心顯茲淨用任運歷六即位也有人云者昱師見五六七從感應神通立名殊不知今明淨用并後依正互融皆是能應自他門中能應屬自感即他機故云兼也二若識下釋二初明所顯淨法二初染淨體用理無增減三初法二初明染淨體者若識無始即法性為無明故可了今即無明為法性觧科所顯淨法正在果後而無明染體用者顯不二故即染之淨也體用者法性無明是染淨體變造諸法應赴眾緣為染淨用次文明用用必全體故先明之文中二句約迷悟相翻以示體一以明靜曰法性暗動曰無明也無始無明與起信論一切眾生從本已來未曾離念是同而大經有十地菩薩見終諸佛見始之言以至諸經有忽然不覺從真起妄之說又成有於始終唐復禮法師曾有偈問天下學子曰真法性本淨妄念何由起許妄成真生此妄安可止無初則無末有終應有始無始而有終長懷懵茲理願為開祕藏期之出生死文原夫法界平等非真非妄教門詮示有真有妄是知從理則真妄同源本無終始從事則迷悟敻隔終始條然荊溪則曰若從事說若見法性始則見無明終從見法性終名見無明始若從理者應知二法俱始並終況此二法自無二法俱無始終四明云甚深祕藏之源非真非妄若言忽然不覺而生無明此乃約修以說對性論起不如是則無以顯進修之人復本還源之道矣以此義故凡諸經論多云從真起妄其實一切眾生自無始來唯在迷不覺而已若得此意則禮師之問雖不答可也鈔三千寂體即寂而照既無能照亦無所照名為法性以本愚故妄謂自他三千靜明全體暗動即翻作無明本來不覺故名無始若識此者即照無明體本明淨即翻為法性觧初至無始釋即法性為無明若識下釋無明為法性初釋法性三千寂體者性德三千是染淨體此之三千本來寂滅名為寂體全體靈明故即寂而照寂即是靜照即是明即此三千明靜之體是於法性故約寂照釋之體離能所即照而寂故無能照所照也以本下釋無明愚迷也無始在迷名為本愚妄謂自他即分能照所照所謂元明照生所所立照性忘全明為暗全靜為動故云翻作本來不覺釋無始義次釋無明為法性識亦了也謂無明暗動之體本來明靜即昏為明即動為靜也二法性下明染淨用者法性之與無明遍造諸法名之為染無明之與法性徧應眾緣號之為淨鈔體既全轉用亦歒翻法性既作無明全起無明之用用既縛著名之為染無明若為法性全起法性之用用既自在名之為淨問他云無二與字及將二之訓往迷即法性往趣無明悟即無明往趣法性其義云何答二與有無俱有其義二之訓往釋義稍迂且之字者乃是常用文字而多為語助雖爾雅訓往用自有處安於此中文字不便如一理之內淨穢之土豈皆訓往耶若舊本無二與字則之字不須訓往但為助辭其義自顯何者但云即法性之無明其用即染即無明之法性其用則淨其文既宛其義稍明問若有與字義復云何答此文既辨二用有則於義更明何者夫與者借與賜與也亦助也法性無明既互翻轉成於兩用互有借力助成之義而劣者借力助與疆者若法性內熏無力無明染用疆者則法性與無明力造諸染法若無明執情無力法性內熏有力則無明與法性力起諸淨應以由無明雖有成事之用以體空故自不能變造須假法性借力助之方成染法法性雖具三千淨用顯發由修真修縱不藉無明緣修寧無欣厭故下文云必藉緣了為利他功無明與力助與法性方成淨用荊溪既許隨緣之義必許法性無明互為因緣但約體具明隨自異權教觧釋染淨用分二初正釋體既全轉用亦歒翻此且總示染淨體用歒對翻轉法性作無明無明為法性體全轉也全起無明法性之用用歒翻也體既全轉指上即法性為無明是真轉為妄了無明為法性是妄轉為真用亦敵翻點今二用起無明用縛著名染對翻為染用也起法性用自在名淨對翻為淨用也次料揀二初揀二字訓釋有無二初問他云等者珠指云言法性之無明者此染相也之往趣也同上文心之色心也謂全法性趣於無明唯無明起故云遍造無明之法性者淨相也有別行本加兩與字云法性之與無明復云無明之與法性若言之與之即語助與猶共也乃是法性共無明造惡亦是無明共法性起應乃至誠為可笑文答中三初總明縱奪縱其二與字去留無在奪其之字訓往釋義全非二且之下斥之字訓往三若舊下無與字亦通之字為語助徵起釋出文順義明二簡存二與字於義可否初問二答又三初總標有與義明二何者下委釋真妄借助三初釋與字義二法性下釋借助相既互翻轉者即指上文體用全轉敵翻之義劣者借力助強者此由劣弱自不能造法應緣但可以劣借助強者造作應用耳內熏者法性真如常熏內具造諸染法即九界依正三世變造俱名實造執情即謂實之心起諸淨應即是聖人變化所造縱現九界之像普門示現亦名淨應權造也三以由下釋借助義初法性助無明成染以單真獨妄不能成功須真妄和合方能變造以無明體空須法性助有成事之用論明無明有二義無體即空義及有用成事義次法性下釋無明助法性成淨法性雖本具由修方顯亦藉無明為緣助也他釋此文亦有異論淨覺雜編元師輔讚已死之說不騰敘也今鈔約起教觀意釋之法性理體雖本具三千淨用若欲顯發須假修成但修有真緣住前為緣修住上為真修真修既任運相應縱不藉無明助緣修則未發真前難逃作意須存欣厭即無明助法性力由茲修習故至果上顯於淨用故引文證彼云應知理雖自他具足即今文法性具三千淨用彼云必藉緣了為利他功即今顯發由修鈔釋云稱性圓修方名緣了與性一合功成用顯設化無方即果後淨用稱性圓修即初心修觀也不作此解則果後五住究盡遍應眾緣之淨用何故猶有無明助耶舊味淨用由修方顯之意致果上有無明之疑故多異論三荊溪下略引隨緣結顯既許者不變隨緣名出他宗既曾引用即許義也互為因緣者親生為因疎助為緣若隨染緣則無明為因法性為緣若隨淨緣則法性為因無明為緣也若爾別圓何揀故云體具明隨自異權教謂性體具九起修九用即隨染緣例此性體具佛起佛淨用即隨淨緣別亦具佛而不具九故但理隨緣作九非全體隨緣也玅樂釋無住本法云染淨二類具在十門今明染淨體用如何會同須知四明既約真妄相即釋無明法性乃是一體不二言法性則全無明為法性言無明則全法性為無明玅樂既云迷中實相是真不離妄與今染淨二體義同若以染淨二用會彼四句今之二用與彼後三句同染用即三道流轉淨用即果中勝用亦兼修德三因但缺初句光明玄兩番生起既皆順修但是今文淨用不可將染用對彼次番生起也二濁水下喻濁水清水波濕無殊鈔濁水喻迷中染心清水喻果後淨心波喻三千俱用濕喻三千俱體須知染中其水雖濁亦全濕為波清時豈別有波濕故云無殊則波之與濕皆無殊也他謂波中之濕無殊者濕性既不變波性豈變耶問第四記云如清濁波濕性不異豈非波異濕同今何違彼答讀彼文者不看前後但取一文成我局見今為麤引彼文仍聊釋出令欲據彼證唯濕無殊者聞之自誡何者彼文本釋世間相常但相本流動今欲說常須約位顯全位為相位常相亦常故文數云相位無二仍自問云位可一如相云何等答曰位據理性決不可改相約隨緣緣有染淨緣雖染淨同名緣起如清濁波濕性不異同以濕性為波故皆以如為相同以波為濕性故皆以如為位所以相與常住其名雖同染淨既分如位須辨釋曰彼問既云相云何等故知答文以位例相成乎等義乃先法次喻喻中以法參而合之法中先舉位一故云決不可改次明相等故云同名緣起喻中亦先舉濕性不異顯上位一次明以濕為波以波為濕正當顯上位相無二位等相等故知文中本答相等但相兼染淨等義難彰故先以濕性喻位論等仍顯全位為相全濕為波以位例相明其咸等因何但將濕性不異一句為證全不以濕而例於波及拋相等之問豈可得乎況若論異義豈獨相異位無異義耶故當科即云染淨既分如位須辨豈非染相必以在纏真如為位豈可淨相不以出纏真如為位若論等者濁水清水既同一濕豈不得言同一波耶以水清後還是濁時動用故也觧釋喻文二句有二正釋料揀初至變耶是正釋又二初釋文二他謂下破舊常途直將波水以喻修性體用今以清濁喻染淨心以波喻二用濕喻二體清濁之水皆全濕為波則因之與果皆全體起用波喻三千俱用濕喻三千俱體者謂清水之濕譬法性體濁水之濕譬無明體染淨體也雖有清濁其濕無殊以清波譬淨用濁波譬染用雖有清濁其動無殊故云波與濕皆無殊也故下文云以水清後還是濁時動用則染淨二用同一事造三千染淨二體同一理造三千也他謂等者珠指云濁水之波清水之波二波雖殊而濕性無殊喻迷悟緣起雖二唯心不二文今破既許濕性無殊波性豈應變異次問答料揀二初引文正以波異濕同難答中先斥引文殘缺棄前後文唯取中間二句成乎局見拋相等問是不看前不以濕例於波是不看後次今為下引文釋出本釋等者句四二十九世間相常住者出世正覺以如為位亦以如為相位相常住世間眾生亦以如為位亦以如為相豈不常住文記釋此文謂世相本是遷流動作今約位顯以全理成事事即理故理常事亦常故云全位為相等位即真如之理相即隨緣之事數云相位無二者記云眾生正覺位相無二又云正覺眾生相位常住又云是故相位其理須等問云位可一如者以真如為位故相云何等者相兼染淨故正以位一而難相異答中鈔文釋出是以位例相成乎等義先法次喻者位據理性至同名緣起是單約法答喻中以法參而合之如清濁波濕性不異是總舉喻法中初句先舉位一相約下次明相等相雖兼於染淨二緣以同名緣起故云等也法中先舉位一故喻中亦先舉濕性顯上位一同以下法喻參合也以濕為波喻也以如為相合也以波為濕喻也以如為位合也正顯位相無二無二故成等故知下出答文意本答相等以兼染淨等義難見故先以濕性喻位仍以全濕為波方顯全位為相以如為位亦以如為相即以位例相位如相亦如即咸等也因何下斥其但取一文不看前後之失記云相與常住名同者染淨二相同名緣起二真如位同名常住開下異義故云名同況若下釋染淨既分如位須辨上論位相咸等故以位例相若論異義以相顯位相異位亦異也染淨既分是相異如位須辨是位異眾生在纏真如正覺出纏真如即是如位亦異也若論等者上既辨異復結歸同謂水之清濁雖異濕性一等波之清濁雖異動性一等如是結同為顯今文正意波之與濕皆無殊也三清濁下合者清濁雖即由緣而濁成本有濁雖本有而全體是清以二波理通舉體是用鈔水之波濕常無增減若其清濁必各由緣雖象入則濁珠入則清而其濁緣與水俱有從來未悟故濁在前如山抱玉如沙有金鑛璞本有水雖本濁濁非水性故全體是清以清濁二波秪一動性故云理通而皆全濕為動故云舉體是用既悟後不迷知清是水性通性可轉稱性則常故也觧釋合文初四句釋清濁由緣常無增減正喻染淨體用理無增減清濁由緣譬凡夫深心果後淨心由染淨二緣雖象下六句釋濁成本有初二句喻染淨由緣用大論文意水為清濁本珠象為清濁緣水譬一念象譬染緣珠譬淨緣清濁譬二用與水俱有正釋濁成本有染淨由緣而眾生全體是妄從來下正約法釋本有起信論云從本已來未曾離念是也如山下復以二喻帖釋濁成本有山沙喻一念抱玉有金譬法性淨用鑛璞譬全體在迷濁成本有也水雖下釋全體是清濁非水性譬一念雖迷迷非本性全體是清譬全是淨用以清下釋二波理通通同也二波只一動性譬二用同名緣起而皆下釋舉體是用全濕為動譬體用也既悟下顯濁非水性從來未悟故濁本有既悟後不迷知濁非水性違性可轉合濁非水性稱性則常合清是水性也同前迷轉成性稱理本有義也二故三下界如緣起性本圓常二初約性德直示者故三千因果俱名緣起迷悟緣超不離剎那剎那性常緣起理一一理之內而分淨穢別則六穢四淨通則十通淨穢鈔迷悟緣起皆三千之體起於玅用體既不出剎那玅用豈應離體故使緣起咸趣剎那三千既其不變剎那之性本常以體收用緣起理一不分而分十界百界約十界則六穢四淨約百界則十通淨穢十中一一各六四故觧釋界如緣起性本圓常界如緣起即三千因果俱名緣起性本圓常即剎那性常緣起理一也初科云性德直示者緣起屬修何名性德須知事用三千迷悟緣起皆全體起不離剎那是明性德本具次約修反顯者今科直明性德本具三千能顯玅觀在後方明故今約修為顯性德故文云性常理一十界百界等也從初至咸趣剎那釋前四句迷悟緣起三千玅用皆全體而起因中三千迷緣起果上三千悟緣起雖分迷悟同名緣起剎那本具三千玅體用既即體故不離剎那三千下釋剎那性常緣起理一以不變釋性常體既不離剎那故三千不變剎那性常也以體收用故緣起理一理即是體緣起是用不分下釋後四句一理內分即不分而分六穢四淨且約別論百界則十通淨穢互具為言十中一一即十界各具六穢四淨也二故知下約修成反顯者故知剎那染體悉淨三千未顯驗體仍迷故相似位成六根遍照照分十界各具灼然豈六根淨人謂十定十分真埀迹十界亦然乃至果成等彼百界觧約修反顯科初二句重明性德如上所示則知剎那染心體具三千悉皆互融互泯三千下正約修顯初二句釋伏疑觀行位人雖理觀圓融事用未顯故相似下以十信六根遍照百界一心即是相似顯此三千也初住分顯中道埀十界應迹分證三千故云亦然四十一位位位皆爾乃至玅覺果成究顯三千實相等彼性具百界也鈔問前云剎那百界有穢有淨今何悉淨答前論淨穢法門皆理本具通於迷悟無有增減即性善性惡也今之染淨約情理說情著則淨穢俱染理性則淨穢俱淨故剎那染情體具十界互融自在故名悉淨疑者云剎那既具三千我何不見答未顯者驗體仍迷非理不具此名字中疑也觀行既亦未顯遂以相似驗之父母生身疑於相似五眼五耳乃至五意皆能徧照自身既現十界以驗他身亦然故相似位人比知百界同在一心若至分真普現色身能現十界一一復起十界三業故云亦然果地究盡諸法實相等彼性中所具百界故知性具百界互融廣徧染心自局濁體本清觧初寄料簡釋初二句二釋伏疑申後諸句初問意者據前直明性德十界法體難今染體悉淨答意者前論六穢四淨即理性三千性善性惡法門是於法體在迷不減在悟不增今云染淨的約迷情理性而分迷情執著則十界俱名染礙理性虗融則十界俱淨故上卷云圓家斷證迷悟但約染淨論之不約善惡淨穢說也文故得剎那染念雖是迷情體具三千法法互融自在無礙故名悉淨此則果後淨用全在染心方名不二疑者下申後諸句初釋三千未顯驗體仍迷觀行下釋相似位成至謂十定十鈔意何故以相似驗由觀行位亦未顯故如下文五品位人理觀遍融事用未能自在三千未顯故也五眼等謂六根各明肉天慧法佛五如法師功德品明父母生身獲得六根清淨自身現十驗他亦然正釋豈六根淨人謂十定十也比者此位雖未證真相似解發以似比真故云比知等既知百界故非定十若至下釋分真埀迹十界亦然普現色身名為埀迹既十界一一復十任運百界果地至所具百界釋乃至果成等彼百界玅覺究竟三千實相即彼性中所具百界稱性而證故云等也故知下總結修成之位既顯三千故知性具百界法體融遍迷情自生局礙故云染心自局本來悉淨故譬濁體本淨也二故須下明能顯玅觀故須初心而遮而照照故三千恒具遮故法爾空中終日雙亡終日雙照不動此念遍應無方隨感而施淨穢斯泯亡淨穢故以空以中仍由空中轉染為淨由了染淨空中自亡鈔然今十門皆為觀心而設故色心門攝別入總專立識心為所觀故內外門正示觀法雖泛論二境正在內心第三門全性起修辨觀令玅第四門即因成果顯證非新故此二門皆論一念已上四門攝自行法門同在剎那而為觀體從此門去鈍談化他而化他法門雖即無量豈出三千亦攝歸剎那同為觀體此當其首故廣示觀門後既倣此但略點示不得此意徒釋十門空談一念故今文先明淨用同在染心理具情迷顯發由觀遮照者空中名遮一相不立假觀名照三千宛然復令三觀俱亡三諦齊照乃亡前遮照照前遮照故各名雙亡照同時故云終日此則同前即空假中無空假中也他見法爾空中欲例即空即中而不看上句照故三千常具彼門但舉依正之境況不云三千及以百界尚未結成玅境何關假觀耶若此中縱無上句照故三千常具但云空中於理亦成何者上已具示三千淨用在剎那故彼秪云依正色心據何文義云是玅假思之思之不動此念者明觀成相不移即今剎那文念而能盡未來際作三千化事此之剎那即法界故有何究盡第五記云剎那剎那皆盡過未施設三千皆玅假力亡淨穢相須藉空中故云以空以中染中淨穢更顯明者復是空中之力故云轉染為淨染淨各具三千空中了之三千既亡空中亦泯方名染淨不二此則同前因果既泯理性自亡觧釋能顯玅觀先通明觀體以後六門為起教觀體成後五玅化他能所此門居初今明能顯玅觀故通敘十門皆為觀體之義初二句總標記主述此十門皆為修觀設也故色下先明前四門十乘觀體色心門初標云總在一念次明總中云既知別已攝別入總總在一念攝別入總正立識心為所觀也內外門正明觀法泛論等者機入不同故須雙列一家觀法多就內心內境觀相文云唯內體三千即空假中鈔前文云應知前二門直明依境立觀也第三門者色心門明所觀是性內外門明能觀是修今示修成全為性具名無作行故云辨觀令玅第四門者果德三千由因本具稱本而證故曰非新前文云此門及因果委示前二成圓行始終二門皆一念者前明辨觀令玅顯證非新示二門意今指出二門心境皆論一念修性門云性德只是界如一念鈔釋云亦為成觀唯指一念因果門云眾生心因既具三軌文鈔釋云唯取心因是今觀體已上下總結四門自行法門者以前五玅明自行因果四門從前五玅而立故同為觀體者並指心為十乘觀體也從此下明後六門起教觀體以後五玅明化他門是果上用物機無量不出三千此下六門依後五玅立並指果用在於染心為起教觀體也廣示觀門者此門明能顯觀體廣明遮照亡照及觀成相等望下五門最為詳委後略點示者依正門但云若非三千空假中安能成茲自在用自他門云必藉緣了為利他功三業門云百界三業俱空假中權實門云至果乃由契本一理受潤門云故知三千同在心地不得下結勸若不得記主述作元意皆為觀心則徒釋十門不知前四後六十乘起教觀體之玅空談一念不知前四攝自行因果同歸一念亦不知後六攝化他法門同歸剎那也須知鈔主於此十門科判並以觀心為正意色心門以總別事理分科意在攝別入總內外門以內外境觀及融泯分文意令修內觀修性門明雙立俱亡意在全性成修因果門意在修證無得染淨門明所顯淨法意在能顯玅觀依正門云理顯以觀為功自他門云觀行之功方顯三業門云能顯觀體權實門云遍逗由心證受潤門云權實本圓熏修如幻觀此科語豈非十門皆為觀心耶故今下正釋今文復先敘意先明淨用在染心者却指前文染體悉淨理具等者生下須明修觀理雖本具凡情尚迷欲顯淨用必由修觀同前法性雖具三千淨用顯發由修也遮照下正消文初釋三觀亡照次釋觀成相初又二初正釋空中遮假觀照即三觀相成空中雖同名遮其義則別空遮於有中遮二邊遮謂遮其情執故云一相不立照謂照其法體故云三千宛然此釋照故下二句復令下釋終日亡照亡謂亡其修用故云三觀俱亡照謂照其法體故云三諦齊照此釋亡照乃亡下釋雙字既俱亡俱照何名為雙乃指上遮照為雙故云亡前遮照照前遮照若欲易曉只是亡前三觀照前三諦亡前遮照謂空中二觀之遮玅假一觀之照照前遮照謂真中二諦之遮玅俗一諦之照也以同時釋終日亡時常照照時常亡也以外境觀相文義例同今文即空假中義同於照無空假中義同於亡他見下破舊清師於外境文中除兩假字唯云即空即中空中玅故正中今文為例前已委破今臨文亦略斥之今文上句有照故三千恒具照是觀三千是假上句既明假觀復須空中成之故下句云法爾空中彼但云依正色心非是假觀不可為例三千淨用在剎那者即三千因果迷悟緣起不離剎那次釋觀成相不移下釋不動下二句何能不移此念遍應無方由此剎那全法界作法界之體亘徹無遺故不動剎那化用無盡玅樂記證剎那心盡未來際上文二因茲遮照玅用現前故二遍應無方隨感而施以空以中四句亦是三觀相成上二句假觀鈔上云玅假歷於淨穢即觀成歷法淨穢斯泯是任運泯合下二句明空中二觀亡玅假三千也染中下釋仍由空中轉染為淨染中淨穢即染體本具六穢四淨三千法門由三觀淨心歷茲淨穢觀慧增進故更顯明仍藉空中遮其玅假亦是三諦齊照鈔以復是釋仍由也染淨下釋由了染淨空中自亡各具三千者如前云因中三千起於染用果上三千起於淨用只一三千在染在淨之不同故云各具三千是假空中了之空中究了染淨所具三千即是空中亡淨穢相三千淨穢法門既亡空中能亡之觀亦泯此以因果不二門成六依正不二門三初標六依正不二門者觧此門依感應神通而立應物現通必該依正既是淨用依正必融故名不二鈔果後示現下三國土名為依報示現前三教主及九界身名為正報以寂光圓佛本無二故即是能開之玅法故也此淨穢土及勝劣身同在初心剎那有何二耶觧釋標文二初釋依正以寂下釋不二果後示現者聖人變化權造也前三教主雖名為佛藏通二佛屬二乘界別佛屬菩薩界圓等覺還亦菩薩攝果後示現十界依正如玅玄六云若言神通度物非但變己身同其正報亦變已國土同其依報瓔珞云起一切國土應起一切眾生應也若應同正報者即是示為十法界像也若應同依報者即是同十界所依處也寂光圓佛無二者如云真如實性非身非土而說身土離身無土離土無身言身土者一法二義今云已證遮那一體不二下三土九界是所開之麤寂光圓佛是能開之玅開前身土即寂光圓佛故云不二淨穢土者三土傳作勝劣身即九界迭論同在初心兼明門義繼云有何二耶復是不二義依正既居一心一心豈分能所也二已證下釋二初明果用由因本具三初示依正不二二初明不二之由已證遮那一體不二良由無始一念三千觧總科依正不二者大科既云果用由因本具予科先明不二之由又云已證遮那鈔釋云舉已證之位釋標文云果後示現等今應云初示果用不二對下因理本融方的今云依正不二恐書者之誤良由無始者果地依正融通並由眾生理本毗盧身土不逾凡念鈔已證者葢舉已證之位也寂光遮那依正不二全由因德一念三千儻因本不融果何能一縱修治令合亦是無常終歸分隔觧初釋已證舉已證位即究竟玅覺寂光下釋遮那一體不二籤只云身鈔則兼土方見不二全由下釋良由等皆由理具方有事用儻因下反顯果必由因因中若不互融果上何能不二別不談具縱別修緣了莊嚴法身是修治令合既本無今有是無常法二以三千下示不二之相以三千中生陰二千為正國土一千屬依依正既居一心一心豈分能所雖無能所依正宛然觧明不二相初二句以三千分屬依正依正下正明不二能依身所依土也雖無下不分而分依正宛然者以法法不失自體故依正雖在一心而能依所依任運常分故云宛然鈔在文可見二是則下明因理本融二初明三位本玅是則理性名字觀行已有不二依正之相故使自他因果相攝鈔理等三位融相未顯如五品人雖以理觀徧融一切而於事用未能自在此位尚爾前位可知然迷情自異不二天真故云已有自即己心他是生佛佛唯在果餘二在因果攝心生縱由修證心能攝二全由性融推功歸理乃言故使觧釋三位本玅從初至已有釋初二句自即下釋故使等理等三位性雖本具但融相未顯若至十信六根互用能以一玅音遍滿三千界方於事用自在況至分真故知五品理觀雖融事用仍隔解謗云若圓五品初隨喜人能於一心須顯三諦即廣事而達深理即深理而達廣事無一事用不具三千以達事用全理起故文彼正約理觀遍融故得無一事用不具三千理觀雖爾未能如真似化用身土無妨也然此三位融相未顯者乃迷情自生隔異不二之相天真自然本來融攝同前染心自局濁體本清自他相攝者前文云三法體性本來相攝果攝於因縱謂修顯心能攝二既未證得全由性體互融二但眾下示一切皆融但眾生在理果雖未辨一切莫非遮那玅境鈔不可任情必須順理理智未顯見法仍差須知本融無非玅境觧釋一切皆融初二句約情理分融隔前明融相未顯葢任迷情今謂一切皆融須順理體理智下二句釋但眾生在理果雖未辨言眾生在迷但有理性事用未顯名果未辨理智乃證理之智迷情既深理智未顯見法仍差由果未辨故於事用未能自在此是任情須知本融無非玅境釋一切莫非等即順理觀也三然應下明始終無改二初明情智局徧然應復了諸佛法體非徧而徧眾生理性非局而局觧明情智局徧者生自局限屬情佛能徧融屬智非徧非局約體性說而徧而局約情智論鈔於生局處佛能徧融於佛徧處生自局限觧於生局處佛能徧融者果上佛眼佛智觀之全生是佛於佛徧處生自局限者眾生於佛依正中而生殊見也二始終下明體用常融二初略示始終不改大小無妨因果理同依正何別鈔有四句初三約因果竪辨理同二四約諸法橫辨相入意顯終既大小無妨始亦如是由不改故果既依正不二因亦復然由理同故觧釋略示云橫竪者始因終果相望名竪依正大小相對名橫意顯者以終顯始以果顯因也二故淨下廣示故淨穢之土勝劣之身塵身與法身量同塵國與寂光無異是則一一塵剎一切剎一一塵身一切身廣狹勝劣難思議淨穢方所無窮盡觧廣示八句依正問出初二句先土次身次二句先身次土次二句又先土次身相由而來順文義便亦由身土體一趣舉無在塵身法身量同者如云一塵之身咸與理等廣狹約土勝劣約身鈔文有八句初二句雙舉依正同居等三土傳作淨穢地獄等十界身迭分勝劣次塵身下二句雙示依正體性一微塵身一微塵國各具三千體徧法界彼彼身土亦復如是三是則下二句明徧攝一切剎趣一剎一切身趣一身文雖剎身各攝意必依正互收四廣狹下二句結玅三千無礙出生無盡不可心思不可口議如是融相今古常然迷悟不改觧釋塵身二句示依正體性文云法身寂光故也文雖各攝可見意必互收即一切剎趣一身一切身趣一剎此明事用相攝二若非下明理顯以觀為功二初克彰觀行之功若非三千空假中安能成茲自在用鈔性具三千若體若用本空假中常自相攝微塵本含法界芥子常納須彌無始無明強生隔礙順性修觀即空假中則自在體用顯現成就性本空假中性淨解脫也修成空假中實慧解脫也起用空假中方便淨解脫也雖是修二性一以皆空假中故則成合義觧釋觀行之功先明性具體用眾生心性圓具三千有體有用法身般若為體解脫為用性具三德本空假中故三千體用互相融攝性本常然因理本融不二天真之謂也塵含芥納即大小無妨剎身徧攝不思議解脫玅用微塵芥子體量雖微法界須彌體量雖大事用三千同一體性相入無妨如是融相本來自爾故云本含常納也理雖本然融相未顯者由迷情強隔故云無始無明等若能全性起修此用方顯故云順性等順性修觀即空假中釋初句自在體用顯現成就釋次句成茲者指前大小無妨依正何別剎身遍攝果用自在也性本下以離釋合性具三千本空假中本含法界常納須彌即性淨解脫也順性修觀實慧解脫自在體用成茲方便淨也以證理起用二修對一性說既皆空假中乃合九為三之義非教道所詮修二性一故云則成合義彰圓詮也文明自在用三解脫中即方便淨方便必由實慧與真性合方能起用故約三脫明之二如是下結示生佛一致如是方知生佛等彼此事理互相收鈔既解修成全是本具即知迷悟體用不二波濕無殊之譬於茲更明我心為此生佛為彼緣起為事性具為理彼此三千理同不隔遂令緣起互入無妨依正不二斯之謂歟觧釋生佛一致既解修全性具指前果用修成因德本具即知迷悟體用不二釋初句也須知果悟因迷體用無二染淨門明因果染淨二用皆全體起喻波濕皆無殊今云迷悟體用不二此譬愈彰明矣我心下釋次句謂心佛眾生三千理同本無隔異遂令事用十界緣起諸法互融互入皆無妨礙故云依正不二也此以染淨不二門成七自他不二門三初標七自他不二門者感通鈔染淨依正及以此門都為感應神通而立且即染之淨依正必融即是神通及以能應既由己辨須名為自唯未論感感即他機雖分自他同在一念故上文云他生他佛尚與心同況己心生佛寧乖一念佛法眾生法皆名為他而各具生佛若己生佛顯則與他佛生佛同俱為能化唯他眾生生佛而為所化既同一念自他豈殊故名不二依此觀察能成二玅復名為門觧釋標文三初釋自他雖分下釋不二依此下釋門釋自他中初明依玅立門上云五六七從感應神通立名即染下以三門對通應即染之淨謂果後淨用染心已具既是淨用依正必融故前二門即是通應名自今論所化之機名他上云自他不二方兼於感文起應現通從因至果必自修證故云已辨釋不二中初二句略示次引上文證先引次佛法下釋自心為己生佛為他各具三千故云生佛三千不出生佛故也已生佛顯等者自心所具三千果用彰顯則與諸佛所具三千並屬能應即自也九界眾生所具生佛為所化機即他也既同居一念故名不二能成感應神通二玅也二隨機下釋二初示感應之體本同二初約法示三初約一性明自他隨機利他事乃憑本本謂一性具足自他方至果位自即益他鈔證果之後不動而應眾機普益既非謀作皆由性同因果驗之灼然不二觧釋一性明自他不動而應故曰無謀一身湛然安住無量身百界作佛全真起應故曰不動皆由自他同一性故一性具足自他因也至果益他果也故云因果驗之二如理下約三千明感應如理性三德三諦三千自行唯在空中利他三千赴物物機無量不出三千能應雖多不出十界界界轉現不出一念土土互生不出寂光鈔先以三諦例自他本同三千既即空假中乃三德三諦之三千也自行即淨穢亡泯無不空中利他則帝網交羅三千皆假三諦既即三是一自他則分而不分然今所辨自他俱在玅假以能化所化皆三千故欲約三諦論不二故且對空中辨之玅假尚不離空中一假豈應隔異問前修外觀既當自行但列空中與今符合何苦責之答往時不解境觀之徒據此等文妄有除削何者此約三千以明空中已具不思議假況復利他之觀初心豈可不修不修則何名摩訶薩秪為假觀始行須修方得感應同居一念自他不二據茲而立如何却云自行無假又若自行唯修空中內觀豈非自行何故言即空假中耶物機等者正明自他各具三千細辨故三千總論故十界轉現互生即無記化化化復作化也依正皆爾應必對感機豈不然一念從事寂光約理二必相即故互舉爾觧釋三千明感應先以三諦例自他本同中三節初約三諦分自他例不二然今下就一假明自他顯不二問前下對謬說明自行修假觀三德三諦三千者桐洲云三諦是所依體故云天然之性德也三德是所顯常樂我淨故云果德欲顯三千因果理同故云理性三德三諦三千也一師云以三千即空假中故乃約三德三諦以明之何者三德之三千法法皆常樂我淨故三諦之三千法法皆圓融自在故德顯修成諦約性具故荊溪云德若無諦德無所依諦若無德諦不能顯故以修成之德顯於理性之諦文愚謂此句正釋理性三德三諦三千以此三千一一即空假中故名三德三諦三千也三千自即三諦何名三德三諦耶葢圓詮三諦體是三德不縱不橫一一互具三千即空三皆能破三千即假三皆建立三千即中三皆絕待不同別人不知三諦體是三德故三諦隔歷非縱即橫故云三千既即空假中乃三德三諦之三千也別行玄記上云以三千法皆因緣生是故一一即空假中三諦互具非縱非橫故荊溪云三德三諦三千下卷云若觀心空理事三千無不空也觀心假中理事三千無不假中觀三千空空即三觀三皆能破故總言空觀三千假假即三觀以皆立故故總言假觀三千中中即三觀皆絕待故故總言中此乃三德三千故也但以別人不知三諦體是三德不縱不橫一一互具文理性者就迷說也自行空中利他假觀同染淨門能顯玅觀照故三千恒具遮故法爾空中此自行利他對下自他並屬於自即初心所修玅假名利他行且屬於自此二句分釋三諦次三諦下以三諦明自他上句明三諦下句例自他圓融三諦體一互融故云即三是一雖分自他只一三諦故分而不分豈非自他本同然今下取次文意能應不出十界物機不出三千即能化為自所化為他於三諦中俱屬玅假以能所皆三千釋上自他俱在假義欲約下明今以三諦例自他意欲約三諦以論不二故暫對空中明之三諦既即例顯自他本同故云自行唯空中也玅假下二句初句明三諦尚即三是一次句明自他既同一假豈應分二然玅假一假其體是一但上句約三諦故對空中而言玅假下句約自他同一玅假故云一假也料揀中以自行唯在空中合前外觀即空即中作難答中明舊人昧旨妄自除削何者下釋出自行有假三千明空中即文云利他三千赴物故云已具況復下明初心須修假觀意摩訶翻大薩埵名心不修利他之行何名大道心耶由是而知初心修起教觀何所疑哉秪為下明修假觀功能正由始行須修至果乃感應同居一念自他俱在玅假故云據茲而立又若下以內觀例顯正明等者今文所辨正明自他同一三千以明不二先以三諦例顯未是正意故云且對今明自他各具三千故曰正明雖云各具只一三千也依正皆爾者界界是正土土是依無記化化禪是果上所證屬能應也所化之機雖未彰顯全體本具故云機豈不然果地融通並由理具故也塵說剎說即依報也事理相即是故互舉亦可云界界轉現不出遮那土土互生不出伽耶三眾生下約俱具明道交眾生由理具三千故能感諸佛由三千理滿故能應應徧機徧欣赴不差觧俱具明道交者生佛俱具三千玅道交感也眾生在迷故云理具諸佛果成故云理滿三千理同故感應相收機應咸遍機欣應赴毫髮不差也鈔既三無差別則感應相收眾生感心中他佛諸佛應心中他生不然豈能一念皆令解脫邪二不然下約喻示二初順喻不然豈能如鏡現像鏡有現像之理形有生像之性觧順喻謂若不爾者何能如明鏡當臺無心現像形對像生形喻機扣像喻應赴理之與性即生佛各具三千也鈔諸佛三千即現像之理眾生三千即生像之性若不然者不能即感即應非任運化也二若一下反喻若一形對不能現像則鏡理有窮形事不通若與鏡隔則容有是理無有形對而不像者鈔以鑑淨形對無不現之理而反顯之意云若不現者可言鑑理有窮形事不通也諸佛悟理眾生在事三千理滿若一機扣之不應則可云三千互闕既無此理則前義善成仍釋伏疑何故眾生多不見佛故云若與鑑隔則容有是理即障重機生名與鑑隔機成名對若其對者終無不現然未通字必誤合云不通縱移於下句語稍不便智者詳之觧釋反喻初釋出反喻意以鑑等者以由果滿機扣無不應之理而反顯之故云若一形對等諸佛悟理故云鏡理眾生在事故云形事三千下以法合喻三千理滿合鏡淨機扣不應合形對不能現像三千互缺合有窮不通互缺者佛缺三千則不能應生缺三千則不能感既無此理者謂無果滿機扣不應之理則前俱具道交之義善成籤若與下釋伏疑應疑云理滿機扣無不應者何故眾生多不見佛故約喻釋云若與鏡隔容有是理鈔以法釋鏡隔眾生三障厚重道機未熟如臨鏡背視名與鏡隔則像不現有是理也無有形對不像此句顯出正義鏡明常存物來斯現臨鏡背視非鏡咎也三千理滿無有機扣而不應者矣未通必誤者珠指云若形對不現像則鏡理有窮形事未通與鏡隔容有是理文二若鏡下明觀行之功方顯二初帶喻彰用匪功成者若鏡未現像由塵所遮去塵由人磨現像非關磨者以喻觀法大旨可知觧科帶喻彰用匪功成者帶前鏡像之喻彰用全性具非由觀行功成然總科云觀行之功方顯今云何匪功成耶須知總科雖爾今科意彰果由因具以性奪修故匪觀行功成即文云現像非磨也鈔故知心鑑本明三千之像本具對物未能現者葢三惑之塵所遮去塵雖緣了之功現像乃全由性具此中正明觀心發用他云由機現像其義天隔觀法大旨者非唯此中諸門皆爾但在此說為便耳觧釋喻文以法參合先明理具眾生心體如大圓鏡本來明淨三千玅用具足無虧鏡未現像因塵所遮譬機扣不能應由惑塵所障去塵由磨譬惑破由修緣了之功者了是正觀緣是助道去三惑塵全由觀行之功也現像非磨者果用若顯普現色身全由性具非關修觀若非性具何名無謀之應他云等者珠指云鏡明實由磨力像現自因形生此辨修觀故性明機感故應赴文鈔主謂今科正明由觀心故顯發應用現十界像若云由機現像乃前科意故云天隔諸門皆爾者點籤文意十門皆為觀心而設豈獨於此明之葢逐便爾文出此中義徧初後也二應知下就法明發由觀合應知理雖自他具足必藉緣了為利他功復由緣了與性一合方能稱性施設萬端則不起自性化無方所觧科云就法明發由觀合者上約喻彰修德無功故云非磨今就法明理顯由觀理雖具足指前科意謂能化之自所化之他理體本具故喻非磨然必憑藉觀行為利他功復由等者修既稱性不同別修故云一合方能等者修觀功成故果用自在也非二物相合須知此合是即義也玅宗云荊溪有時以合釋即正引今文鈔雖由緣了須揀前三稱性圓修方名一合功成用顯設化無方觧須揀前三者別行玄記上云藏通義立全乖性種別教雖有初心別修唯有圓教修性不二雖云皆具須辨此殊文此由依正不二門成八三業不二門三初標者八三業不二門者觧諸門皆以二法而論不二此門以三業明不二者以色心束之雖三而二身口是色意業是心故文云心色一如豈非不二鈔云示諸三業即開三教九界三業即圓佛三輪故云不二鈔云諸身尚即三業豈分文中融身說是諸身尚即會三輪即三業豈分鈔果後逗機示諸三業四時三教謂有差殊今經開之唯圓法體諸身尚即三業豈分故名不二亦就心法示也觧釋標文初釋三業今經下釋不二亦就下釋門此門唯在能應故云果後逗機等亦是聖人變化權造故云示也十界三業是故云諸四時三教有差者法華以前各各身各各口各各說故今經開之即向身是圓常之身向法是圓法故云唯圓法體諸身尚即者法華以前三佛離明來至今經從劣辨勝即三而一諸身尚即一身示諸三業豈異二於化下釋二初明所顯果用二初約對機顯逗會無差二初示三輪不同於化他門事分三密隨順物理得名不同心輪鑒機二輪設化現身說法未曾毫差觧於化等者總科云逗會無差謂果人三業隨機逗會毫髮無差雖曰無差未論不二故子科云不同與復殊也事分者果後化他故約事用分於三密理則不異物理者物機道理也鈔三皆秘玅非下地知故名為密能轉摧碾復名為輪轉己示他摧他惑業稱機示現毫髮不差觧初釋密義次釋輪義後二句總結逗會無差三皆秘玅者大術在於世尊等覺已還所不能測故云下地輔行釋輪義云如輪王寶能壞能安文運載名安摧碾名壞今約能轉摧碾二義轉己所證以示眾生是能轉義如三轉中云示轉也摧碾眾生煩惑結業是摧碾義二在身下明真應復殊在身分於真應在法分於權實鈔說三權法皆是應身若聞圓乘必見法佛別縱覩報猶是修成圓見應身皆唯本具仍約四味權實未會真應且分觧釋真應復殊先約徧圓相對約真應分三教是應圓乘是法法即真身也次約徧圓相對揀修性藏通現劣故但是應別覩勝身名為他報奪而言之只云勝應與而言之故云別縱覩報既不談具猶是修成圓人了知三身本具全性而發故見應用指修即性亦名法身諸文以身對教則生應報法對藏通別圓此從增勝而說仍約下正釋文意約未開說一往分於真應故云復殊也二約稱理明卷舒自在二初融身說二身若異何故乃云即是法身二說若乖何故乃云皆成佛道若唯法身應無垂世若唯佛道誰施三乘觧科云融身說者應身即法身三乘皆佛道也即是法身者大經云吾今此身即是法身同今經微玅淨法身具相三十二二經同味故得用之皆成佛道者方便品廣開中數云皆已成佛道應無垂世應字平聲誰施三乘者一開之後無所間然豈有應身垂世說三乘法之異耶似廢權義鈔問此中法身說佛道邪餘文何故不許法身有說答葢華嚴宗獨謂我經是遮那說餘經皆是釋迦所說故今家會之遮那乃是釋迦異名縱勝劣有殊而說必是應法定無說若相即者法全是應無說即說應全是法說即無說今云法身者非離應之法故經云微玅淨法身具相三十二等若論即者凡說圓教皆即法身何獨華嚴但彼隔小故現勝身乃報身像而即法身今經開權故於應身即法身也問現住靈山豈不垂世答身既即法土非寂光耶故施開廢會身土咸然觧問意者今文法身說圓教佛道因何諸文不許法身有說答中先示不許法身說法之由葢新譯華嚴謂是毗盧遮那所說弘彼宗者有此謂也玅樂破云近代翻譯法報不分二三莫辨良由不分遮那屬法能說教主是盧舍那乃他報身亦名勝應所以真應之二法報應之三皆莫能辨故今下以義定判遮那是異名者普賢觀云釋迦牟尼名毗盧遮那今家會意以五時教主只一釋迦云遮那說華嚴即是釋迦異名也若三身相對而論離義者說必是應法定無說若相即下約三身相即而說玅記云故存三身法定不說報通二義應化定說若其相即俱說俱不說若但從理非說非不說事理相對無說即說說即無說文報通二義者自報無說他報有說此三身俱存即前三身相對說必是應法定無說相即中云俱說等者法即報應故俱說報應即法故俱不說若但從理雙非義者理非說默故也事理相對者謂相對論即正同今文相即義也法既即應全是應身故無說即說應既即法全是法身故說即無說今云即是法身乃應全是法故云非離應之法既說佛道乃說即無說也引玅經證應身即法若論下通示諸經中圓皆是應身即法斥他何獨華嚴是法身說但彼下辨二處教主即法有異華嚴隔小於彼初分永無聲聞既說別圓被別機故現起尊特亦名他報亦名勝應被圓機故乃即法身今經開權故指劣應即法身也故云一塵之身咸與理等況丈六之質非法身耶次問意者文云法身佛道無應身垂世施三乘法者經云常在靈鷲山豈非應身垂世耶答意者應既即法伽耶豈非常寂故施則身分勝劣土有淨穢開則無非遮那寂光開已無權義當於廢故云應無垂世誰施三乘會即開之異名身土咸然者豈開身而不開土耶二身尚下會三輪身尚無身說必非說身口平等等彼意輪心色一如不謀而化常冥至極稱物施為鈔雖知權實相冥真應互即儻三業尚殊則色心不泯故會身說令知身口本融以二等意使色心不二方名即應見法不動而施靈山見聞無不爾也觧釋會三輪權實相冥真應互即指上已融身說三業尚殊色心不泯明今須會三輪故會身說令知身口本融釋身尚非身說必非說以二等意使色心不二釋身口平等等彼意輪身口是色意輪是心心色一如即三業不二不謀而化者鑒機名謀現通說法名化以性奪修故云不謀常冥至極者心常契於極理稱物施為謂稱彼物機現身說法或權或實若勝若劣也靈山見聞者法華開顯見佛聞法無非遮那咸是佛乘故云無不爾也不動而施正示常冥至極稱物施為義二豈非下明能顯觀體三初結指心因豈非百界一心界界無非三業界尚一念三業豈殊果用無虧因必稱果若信因果方知三密有本鈔指上果人三業真應互融雖即難思豈過百界百界融泯全在我心因心若無果須造作若信因果相稱方知三密有本他云信下無因果字有亦未多令義易顯故須在之觧結指心因指上下釋初四句指上果人三輪不思議化真應互融權實相即不出百界三業全心本具因心下釋果用無虧因必稱果籤則以果無虧驗因本具鈔則以因元具顯果無作果地融通並由理具以果驗因並由理具方有事用以因顯果二文互映乃見因果相稱也他云等者珠指云有別行本於若信下有因果二字葢後人昧此文意輙加耳今文自是指上文云若信上百界一念三業之因方知三密有本故文便舉百界等以釋成豈非正由因理本具也何得云信因果耶文二百界下觀成用顯百界三業俱空假中故使稱宜遍赴為果一一應色一一言音無不百界三業具足化復作化斯之謂歟鈔百界一念本空假中須順性三以成修德修性一合果用乃彰遂使色聲傳生百界豈無記化化禪不即陰發耶觧釋觀成用顯上既結指果上三密因心本具已有其本故云百界三業本空假中即性德三諦也須順下正示文中俱空假中圓人全性起修故須順性修觀即全性德三諦成順修三觀修性一合即觀成果用乃彰是用顯故使稱適機宜遍赴為果一一應色言音無不百界等即色聲傳生百界化復作化故云傳生玅玄六云不別作意故云無記化復作化故云化化文果上所證全由陰妄心中顯發三故一下染體本玅故一念凡心已有理性三密相海一塵報色同在本理毗盧遮那方乃名為三無差別鈔三密相海本理遮那心塵皆具例彼生佛名三無差既云一念凡心那作非因果釋觧釋染體本玅三密相海是應本理遮那是真心塵染體皆具故云本玅以心例佛以佛例生事用難分迷悟之殊三千理體元無差別既云下因便斥謬心非因果又既云一塵遮那那云無情無性此以自他不二門成九權實不二門三初標九權實不二門者說鈔權是九界七方便實則佛法圓乘四等未會權實不融此經開之皆稱秘玅故云不二觧釋標文初釋權實此經下釋不二九界七方便者輔行云人天二乘三教菩薩別取教道地前位也玅樂六云七望於九但除四趣離開菩薩以子義通故世間從九結緣義局故方便唯七第五云照九界機說七方便者九是所被教不出七說七被九漸令入實人法七九故立總言九界從自分立名方便從進趣為稱又九界從物機立名方便從化主受稱總舉不同故云七九文佛法圓乘佛法指人圓乘指法以佛對九圓乘對方便此經下今開法用能通無非秘玅二平等下釋三初明等鑒由理融平等大慧常鑒法界亦由理性九權一實實復九界權亦復然權實相冥百界一念不可分別任運常然鈔權實優劣不名平等實不融權復非於大故法法皆玅一一互收常如是知即名平等大慧此之大慧雖由果證凡心本然故但觀心此慧自發觧釋明等鑑由理融初釋平等大慧法法下釋法界常如下釋常鑑果證此理故能常鑑雖是果證全由理性權實本融亦由者從上門來非唯三密全在凡心果證大慧亦由理性故云凡心本然不可分別任運常然即權實理本不二既百界一念故但觀心則大慧自發瓔珞云諸佛菩薩以大方便平等大慧照諸法界文二至果下徧逗由心證至果乃由契本一理非權非實而權而實此即如前心輪自在致令身口赴權實機三業一念無乖權實不動而施豈應隔異觧至果遍逗群機乃由契本一理理體則權實雙非赴機則權實雙照如前者指三業門意輪鑒機二輪設化三業能說既居一念權實所說任運無乖無乖即不二也全雙非體起雙照用名不動而施權實即非權實豈應隔異方名權實不二也鈔證果之後於體內不分之權實而被機分隔說之既理元不分故此經稱理而會如是施會自在者由契本因因本若隔果那得融若欲契之但觀一念觧證果下釋至果已下三句體內不分即雙非體分隔說之即而權而實也稱理而會故名不二即籤云豈隔異也施會自在是至果逗機因契合本因一理故爾若因隔果融則本無今有圓頓行者曉果從因欲契果融須觀陰識三對說下結示歸理一對說即以權實立稱在身即以真應為名三業理同權實冥合觧三業是能說權實是所說二必相由故前門云在法分於權實今云在身則以真應為名三業理同能說三業既理同所說權實必冥合故此權實以上門成鈔如文此以三業不二門成十受潤不二門三初標者十受潤不二門者眷利鈔從喻立也能受者即三艸二木七方便眾生能潤者即大雲注雨即前四時三教今經開之唯一地所生一雨所潤無復差降名為不二觀己心地三千與佛心地三千不殊則念念受潤常沾玅益依此為門則成二玅觧釋標文初釋受潤謂能受能潤也法喻參合草木是譬方便是法雲雨是譬時教是法如來大雲注諸教雨今經下釋不二今經開顯皆一地所生一雨所潤觀已下取當門地雨無殊科文帖釋門義三千圓理生佛無殊常沾合受玅益合潤此門從眷屬利益立名故以此為能通則成就二玅也二物理下釋三初明權實本圓熏修如幻二初由具可熏物理本來性具權實無始熏習或權或實權實由熏理常平等遇時成習行願所資若無本因熏亦徒設觧物理等有物機道理本具權實玅體即所熏也或為權機或為實機並由無始熏習有殊即能熏也權實由熏習者謂為權為實由能熏殊理常平等者所熏之理本無二相故云平等遇時等者值遇時節因緣成其所習加其行願相資故有權實之機出由具可熏義性具權實即是本因熏亦徒設者謂內無種外緣無功即徒設也輔行五中云自行由觀染因緣生化他則以淨因緣生自他相對則以染淨因緣和合而生又自行染有內有外內謂無明外謂他境以內具故他境能熏故觀所熏唯見理具若觀理具則識真如常熏內具文此文有能熏所熏及權實義無明是權真如是實內具是所化他是能鈔如文二因熏可發遇熏自異非由性殊性雖無殊必藉幻發幻機幻感幻應幻赴能應所化並非權實鈔豈唯權實相冥抑亦感應體一性本圓具偏發由熏以性奪修故修如幻平等法界佛不度生不分而分暫立感應欣赴本虗故皆如幻然此尚非但理隨緣之幻豈同緣生無體之幻邪今明各具本融暫分如幻能知此者方是圓乘觧釋因熏可發初二句約理體平等總貫下文謂不但所熏權實體本冥合即非由性殊亦乃機感應赴其體常一即感應皆幻也性本下釋遇熏下二句權實性體本來圓具釋非由性殊權實偏發良由熏習不同釋遇熏自異籤謂權實體性雖等必藉幻修顯發鈔釋云以性奪修修德無功故名為幻平等下釋機感應赴皆幻即感應體一佛是能應生是能感平等真法界佛不度眾生即感應一致理不可分不分而分故云暫立機欣應赴本無實義故皆如幻然此下揀非幻名雖通幻義永異今明以性奪修尚非別教隨緣之幻豈同通教體空幻耶今是感應各具權實本融暫分感應故名如幻能知以性奪修之幻方是圓玅一乘也籤能應所化並非權實總結感應如幻二然由下明生佛一際欣赴不偏然由生具非權非實成權實機佛亦果具非權非實為權實應物機應契身土無偏同常寂光無非法界觧生具非權非實成權實機如前生具三千能感佛亦等者佛由三千理滿能應鈔若圓理無偏感應一致故一塵應色無非法身自他所依不逾秘藏方為色香中道起對法界也觧生佛皆具故圓理無偏由俱具故成機為應豈非一致一塵下釋身土無偏等一塵之身咸與理等故云無非法身身無偏也自他不逾秘藏土無偏也三德祕藏即常寂光依報色香無非中道同常寂光正報根塵若起若對無非法界四明自約色香中道起對法界帖釋後二句為者是也三故知下明地雨無殊利益平等故知三千同在心地與佛心地三千不殊四微體同權實益等鈔四微約喻即一地所生權實約法即一雨所潤凡地三千無隔隨一念以俱圓佛地三千既融隨一應而盡具況生感心中之佛佛應心中之生感應之體尚同權實之益何別故云但化菩薩不為二乘其有聞法者無一不成佛方名受潤不二觧利益平等中四微謂色香味觸對四大得名四大為四微所造金錍云草木與地四微何殊彼明法華開顯三草二木皆一地所生正同今文一雨所潤正明益等一地實相也一雨佛乘也初四微下釋四微體同權實益等凡地下釋故知三千至三千不殊眾生三千既在因迷約一念而圓具諸佛三千既已果滿隨一應以徧收況生下以感應體同況權實益等生佛同一三千感應一致人分凡聖其體尚同法唯聖說所益何別引證二文皆明益等但化等是能潤其有下是能受故結云受潤不二此以權實不二門成三是故下結文示意三初明十門通理貫體無殊二初約十門明理一是故十門門門通入色心乃至受潤咸然故使十玅始終理一觧三結攝重示初明十門通貫理體無殊鈔曰門門皆顯三千即空假中即其義也初約十門明理一門為能通玅為所通能通之門既顯三千三諦則所通之玅始終理一故次科約十玅釋成理一也鈔門門皆顯三千即空假中十門既然十玅亦爾故云通入及理一也二如境下約十玅釋理一如境本來具三依理生解故名為智智解導行行解契理三法相符不異而異而假立淺深設位簡濫三法秪是證彼三理下之五章三法起用鈔性德三千即空假中名為境三境能發智照此三千即空假中故名智三智能導行契此三千即空假中名為行三此是修中論九九秖是三一一具三開合無礙功成歷位雖有淺深三九圓融未始差別三九究盡等彼三千即空假中名為三法由空假中方能起用他機因果亦復如然故十章始終皆得稱玅觧釋十玅理一境是理境故籤云本來具三鈔約性德三千三諦而釋籤云依理生解即依於理境而起智解全由性起故云依理籤但云智行鈔以性例修作離義釋即是從境三起智三從智三起行三也鈔云境能發智照此等者即以玅智照於玅境此字指性德三千三諦也籤智解導行行解契理即從智起行鈔云智能導行契此性德名為行三正是住前三法生起次第義也前鈔文云修二性一以修例性而言乃合九為三故今約修中論九而釋雖兼性三咸為所發故云修九此是下指上境智行明三九離合之義圓融自在故云無礙籤云三法等者境智行三修性符合圓融互具即三而一故不異即一而三故而異約位位理同故云假立設位揀濫免增上慢功成下釋假立淺深三九離合徧通諸位故云未始差別三九下釋三法只是證彼理三唯佛究盡究盡此也等彼之言與前等彼百界義同即稱性而證也已明前五下之五章指後五玅由證三法方能起用故鈔云由空假中由等彼三千即空假中也籤文通總而言故云五章起用其實神通說法及以能應故前云應等三玅是用感及眷屬既獲利益必合從因至果還起利他之用故云他機亦然故十下結始自理境終至利益皆得稱玅者只由皆全此三千三諦故也二既是下明一念包融觀行可識三初明一念境觀之功既是一念三千即空假中成故有用觧科云一念境觀之功者初是一念性德三千三諦是境修德三千三諦為觀成故有用是境觀之功鈔此上十門十玅攝法雖廣同在凡夫剎那一念三千世間即空假中性三為境修三為觀成則是果用則化他若不攝歸心法焉能成辦自他是故指要其功莫大觧此上等者指前二科攝法雖廣即自行因果化他能所同在一念者正明今意三千等者只一三千在性名境全性起修為觀成是果成用即化他若不下反顯以此門玅攝歸一念方能成就自行因果化他能所是故下結示一念境觀之功二若了下明心法攝成之要若了一念十方三世諸佛之法本迹非遙鈔言非遙者一念三千總攝故非遙一心三觀易成故非遙觧科心法攝成之要者念即心法即總攝易成非遙即要也久本近迹之別不出三千一念總攝故云非遙此約解釋生佛高廣初心難觀從近而示就一心修三觀易成故云非遙約行釋也三故重下明重述觀行易明故重述十門令觀行可識鈔將彼十玅無邊法相攝作十門不離一念令修觀者可識作者再三顯示何以迷之觧釋重述觀行易明中無邊法相攝作十門即以略顯廣不離一念即以易通難三首題下明得意符文總別無異首題既爾覽別為總符文可知鈔此之十門雖在迹門之後仍例本門復將釋名例餘四章故知五義釋題盡備故云既爾此既一部都名必覽三分諸品別相而立既得總意令將此總符彼別文故云可知欲銷一部文文句句皆須預知絕待之意無不入心成乎觀行儻迷茲旨銷彼別文何能顯玅乎問他云釋名是總三章是別名中具三即覽別為總將此四章符教相文則可知也今以首題為總經文為別據何所出答名總三別少分可然以教相為符文全不允當況餘四章前文已例不須更示今依記文云所以釋題不可率爾題下別釋理非容易豈非以題為總以文為別問觀心既非此部正意何故十門皆約觀釋豈作者特違部意邪答文初既云觀心乃是教行樞機信非閑緩之義但為玅義難解故部中判教生解義強觀且旁示然部之玅旨乃摩訶止觀之大體也何者若非三千空假中何能頓止三惑圓觀三諦故義例云唯依本迹顯實應知止觀用此玅義為能止能觀葢不思議境即觀故三障四魔為所止所觀也故千如玅旨玄文廣約眾生法示之文句廣約佛法明之此十門欲與止觀同成觀體皆專約心法說之所以節節云一念或心性剎那等也故總結文云令觀行可識前文云則彼此昭著法華行成又云故撮十玅為觀法大體應知前四門為十乘觀體後六門為起教觀體也大部既教廣觀略此文乃行正解旁互相顯映方進初心豈重述十門但銷名相而已願諸聞見如理思修云爾觧釋得意符文有正釋料簡又最後問答料簡述作初釋首題既爾此既下釋覽別為總符文可知欲消下示意一部別文文文之下通結玅名句句之間咸具體等皆須預知開顯三千大綱絕待玅意此是玅解入心成觀即此絕待之義為觀體乃成玅行此是點示消經之法令顯玅旨問他云等者引珠指謬說並今正意為難答中先出他義之非今依下示今義有據玅樂第一記文也別釋別文次料揀述作問中云觀心非正意者玄文教正觀傍故今之十門皆約觀云而明將非與部旨相違耶答意者此文末上既云觀心是教行樞機信知十門正意觀心為要然玄文教正觀傍由玅義難解正明五重玄義出諸教上故生解義強傍論觀法然須了知部中開顯絕待玅旨是止觀十乘觀體前文云用此絕待之義為觀體者方譬日光不與暗共何者下徵釋義例之文上卷亦引止觀既依今經本迹開顯玅旨即以三千為觀體也三千三諦是不思議境用此為能觀是即境立觀三障四魔不出所觀陰等十境兩重能所蘊在其中故千下以三法歒對三部明此十門與止觀觀體是同千如玅旨者玄句從略但明千如止觀明觀廣說三千玄約眾生法者文釋法字先約五差判權實謂四趣人天二乘菩薩佛前四屬權後一屬實次約四類釋法相以菩薩佛菩提器同共為一類文句約佛法者玄文釋佛法指云是事可知無勞廣說至方便品更當明之故文句方便品約四義釋初約十界釋次約佛界釋三約離合釋四約諸位釋記云明理徧攝約十界釋明自證極約佛界釋明佛化用約離合釋明三德徧約諸位釋問止觀專明觀法約心法說其義易明何故玄文約眾生法文句約佛法耶答玄約眾生有乎二義一者玄文一往通論因果十界並名眾生佛名無上眾生欲明千如義便故也二者五章釋題順約行次第必約眾生起行義便故也文句釋經別文經初命章談諸法實相十如是法是法華權實正體既云唯佛究盡故順經文就佛法義便故也所以四釋中後之三釋皆屬於佛此十門為成就玄文十玅部中觀既略示荊溪重述十門皆約心說葢欲與止觀同成觀體故也止觀正明觀法故於正修委明乘境玄文雖立觀心未暇委明荊溪作此十門結歸一念三千即空假中即十乘觀法之大體意令修觀行者隨聞事相法相不須遠尋止觀即於十門便可修習述作大意豈過於此同成觀體義稍難明切宜詳究互相顯映者以此文之行正顯大部之觀略以大部之教廣顯此文之解傍不二門云本文已廣引文證此下但直申一理鈔云重述十門豈但消名相而已此以教廣顯於解傍縱有施設託事附法或辨十觀列名而已玄文觀略也然今十門皆為觀心而設故不可不了十玅大綱故撮十玅為觀法大體總結文云令觀行可識十門行正也願諸下鈔主總結勸修也鈔十不二門指要鈔卷下終合刻十不二門指要鈔詳解䟦從法華出玄義從玄義出釋籤從釋籤出指要鈔從鈔出詳解葢以言詮言凡五轉關矣然非以水澆乳實添膏益明耳幽溪大師常珍重此本欲廣其傳以為入台教之指南姑蘇刻者十不二門與鈔解各行一使文義無斷續之嫌二使學人有深思之得其意自善但中下之根難於強記每臨講席尋對為難往以玄師會合其文襲笥中二十年而今雲石師復堅誠勸梓大師西逝後得賢弟子繼先志以啟後賢台宗中一大勝事也方今絕緒中興圓乘盛演此冊既行凡見聞隨喜者皆當與種鼓毒之緣而會者刻者豈獨下一金剛種子而已哉客寓蓮居偶覩勝事為隨喜書此崇順辛未佛降生日靈江比丘廣鎬和南敬䟦
