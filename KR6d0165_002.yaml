body:
  text: 唐荊溪尊者釋籤宋四明尊者鈔宋武林沙門可度詳解明天台後學正謐分會序十不二門指要鈔卷上并序解上四字是所釋下三字是能釋上六字是別別在今題鈔字是通通於諸鈔上四字入文委釋指要二字本序自明鈔字如向卷者卷舒為義文凡二卷故以上下甄之并序者托華鈔云疏題兼目於序故云并也蓋序後不再列題目故文序宋四明沙門知禮述解能述人號讀者避之此非臨文不諱之例序十不二門本出釋籤豈須鈔解解先寄問辭徵起以明述鈔之由此文乃荊溪釋迹門十妙之後搜括十妙大意而立十門釋籤已是能釋何須作鈔解之得非能所重煩乎文心解亦曰玄義申經記釋玄義文已三矣詎假染筆以四其說文序但斯宗講者或示或注著述云云而事理未明解行無託荊溪妙解翻隱於時天台圓宗罔益於物解答出山外著述之謬雖非山家正說亦稟學台教故云斯宗講者或示奉先清師示珠指也或注天台昱師注不二門二師著作撰述皆有云云之言汲黯傳云吾欲云云師古注曰猶言如此如此也史略其辭爾漢雋諸文橫注云云二字輔行云未盡之貌云者言也說文云象雲氣在天回轉之貌言之在口如雲潤物廣雅云云者有也下文尚有如雲之言文忠法師曰吾祖法智尊者始因錢塘奉先清師製示珠指解十不二門總在一念之文為真心別分色心為俗諦改造謂體用為造謂體同凡改二十來字天台昱師注不二門立唯觀不思議境消一念三千唯色唯心之文為真諦法智愍而救之所以指要之所由作也故序曰或示或注著述云云文孤山正義乃祥符四年作在指要後事理等者一家所明事理有乎多義今為山外迷於三法事理也圓論三法各具事理兩種三千若欲造修須揀生佛之高廣唯觀一念妄心此心當體圓具三千即理造此心能變造三千即事造如此解之名為妙解如此觀之名為妙行山外諸師乃以三法抗分事理謂心法屬理是能造生佛屬事是所造心既屬理敻指真心則初心依何開解立行故知山外三法事理未明則妙解妙行無所依託故忠法師曰清師又立心法三千為理造生佛三千為事造殊不知三法各具事理二造故指要破曰據他所釋至無差之文永失矣故序云事理未明解行無託是皆破於清公也荊溪等者荊溪玄解十妙作此十門門門結歸一念三千合修觀者易入諸師異說敻指真心翻使荊溪妙解隱沒於時矣吾祖依法華開顯妙旨建立圓頓宗乘點示諸法圓具事理三千意令物機開解立行揀境修觀即一念妄心達陰成不思議顯三千法若唯觀真但衆生在事未曾悟理是杜初心入理之門起觀之處則天台圓宗何益於物機乎序爰因講次對彼釋之命為指要鈔焉蓋指介爾之心為事理解行之要也解正明述作仍釋命題之義爰於也講次者因講玄籤之次對清昱二師而釋之下文有人解今一念是破清師有人不許立陰等是破昱師命此能釋之文為指要鈔介爾者輔行云弱也謂細念也文介爾有心三千具足圓論諸法皆具三千若欲造修須從近要的指一念為事理解行之要此心圓具三千即理之要心能變造三千即事之要文云若事若理皆以一念為總解此一念具兩種三千依解立行於一念心觀此三千文云教行皆以觀心為要特指心者萬法之本衆病之源心能具故心能造故荊溪門門結歸一念天台的論境體唯在識陰蓋以此也推而廣之一大藏教無越此心故曰一期縱橫不出一念故知指要其功莫大序聊備諸生溫習敢期達士批詳耶時大宋景德元年歲在甲辰正月九日序解謙己以記歲月聊備學徒溫故誦習豈敢期望明達之士批覽研詳景德乃真宗年號鈔鈔曰此文題目多本不同或云法華本迹十妙不二門或無本迹二字有唯云玄文十不二門此或以所通之義所釋之文而冠於首蓋不忘其本也而盡是別録者私安取舍由情無勞苦諍解十門本出釋籤初無題目後人録出各隨己見以立首題且示三家初是昱師次是清師第三莫知誰立雖所立異不出二義初二是所通之義第三是所釋之文所通義者十門為能通十妙為所通所釋文者籤為能釋玄為所釋不忘本者要見十門出於大本故取舍等者示珠指立題云法華十妙不二門又云有本題妙法蓮華經本迹十妙不二門或云法華本迹不二門或但稱本迹者並後人增損今所不用文問答決疑中廣破他人立題今鈔主暗破之諸師立題盡是私安非荊溪意取彼捨此皆由人情何勞苦興諍競廣破他人立題之不當耶尊者之意只云十不二門故云作者自立引下文釋之孤山正義云義家抄録往往別行標立題目二三其說吾將適從今依行滿法師涅槃記指為法華玄記十不二門況滿是荊溪門人必也親聞呼召故依彼記以立總題雖違衆吾從古也文雖云有據恐非作者之意學者孰不知此文出自今經玄記耶鈔若十不二門四字乃作者自立故文云為實施權則不二而二開權顯實則二而不二法既教部咸開成妙故此十門不二為目須據此文釋其題旨豈非四時三教所談色心乃至受潤無不隔異故皆名二今經開會實理既彰十異皆融互攝無外咸名不二解正釋題目初釋不二為實施權意在於實實本不二順權機故分隔而說故云不二而二開權顯實意在於權權既同體不動纖毫故云二而不二法既等者荊溪云若不約教則不知教妙若不約部則不知部妙文境等十法既約教約部判後開之則此十皆妙今此十門依十妙而立宜名不二也須據開顯妙旨而釋方異昔經之不二也豈非下正釋不二約今昔對分二與不二約教則三教為二約部則昔圓兼帶亦非不二以四時三教未證三千三諦無不差別隔異故此十法皆名二也今經開顯三千實相妙理彰明十法隔異悉皆圓融舉色則色攝於心色外無法舉心亦然乃至受潤亦爾故云互攝無外鈔即以不二當體為門然亦可云十不二為能通十妙為所通問妙即不二不二即妙俱名俱體何分能通所通答今不以粗妙分能所亦不以名體分之蓋以十妙法相該博學者難入此文撮要徑顯彼意乃以略顯廣以易通難義立能通所通解次釋門字門有當體能通二義初句當體然亦下能通當體者不須更約能通所通即不二體便能通入孤山云不二即門亦此謂也法華開顯三千妙理當處虗通法法趣入以為其門故曰當體經云開方便門示真實相此方便實相各有當體能通二門疏八二十四云實相不二當體虗通故名為門如淨名不二門華嚴法界門等記八云無礙名虗無壅曰通故得全體成能通門文四明云門外無理能所泯亡文然亦等者十門雖皆當體然約義立亦有能通所通以門為能通妙為所通故生下問凡言能通必以能通之粗通於所通之妙今不二即妙妙即不二何分能所之殊名體言之名為能通體為所通今不二與妙俱得為名俱得為體那分能所答中不以粗妙答上初義不以名體答上次義粗妙分能所者妙玄第九就能所判粗妙為四句自有能通粗所通亦粗能通妙所通粗能通粗所通妙能通妙所通亦妙文又云門名能通理是所通即名體分能所也今之能所並非此二蓋以玄文十妙所談法相該羅廣博學者難以造入此之十門撮其綱要徑直顯彼十妙之意乃以十門之略顯彼十妙法相之廣對上法相該博言之十門門門結歸一念修觀之易通彼十妙文文之下散漫觀心之難對上學者難入言之以此難易廣略之義立於能通所通爾鈔數至十者蓋從十妙而立雖立門對妙互有多少而不虧本數也此且總明待至釋文更為點示若欲標述作人者即是荊溪尊者既是後人録出不可正斥其諱解釋十字十是數方方者法也如華嚴中凡諸法門以十為數輔行從十妙立者從所通妙立能通門妙既有十門亦如之雖立門對妙或門多妙少或門少妙多門之與妙彼此皆十故云不虧此且總明者今且總明釋題待至消釋別文門門之下點示不二之旨如釋色心門初云故今攝別入總特指心法明乎不二以此為門則解行易入內外門云復為顯其妙義必須內外互融隨觀一境皆能遍攝此之不二悉得稱門泛論雖爾一家觀法皆用內心妙義為門下去諸門亦皆點示或指立門對妙科或指出門名義者皆非釋文為三初總敘立意二從一者去列門解釋三是故十門訖文結攝重示此三即擬三分也解結攝重示者門門通入乃結十門而攝十妙重示一念三千三諦觀行易明鈔末云結文示意以十門十妙理一結文重示即示意也擬三分者三分本為分經但可比擬而已總敘立意擬序分以今正明十門先總敘玄文以立十門之意列門解釋正明十門可擬正宗結攝重示既結十門重示觀意可擬流通也荊溪科節止觀亦擬三分初又四初敘前文立述作之意又二初敘前又二初敘教廣二初十妙意然此迹門談其因果及以自他使一代教門融通入妙故解科十妙意者迹門所談境等十法意開一代教門無不皆妙故也初三句十妙後二句明意然即領上之辭此即指法之語荊溪釋迹門竟搜括大意而成此書故於文初領上十妙故云然此等也迹門者迹謂足迹玄七八云如人依處則有行迹尋迹得處文心解云望本為名皆從喻立也如人從本處則有行來之迹故因其迹以通其本文門者迹中化用通至實相故稱門也十法雖廣不出因果自他因收境智行位果收三法自收能應神通說法他收感及眷屬利益也鈔然者是也即領上之辭亦信解之語若不信者乃云不然此迹門等者指上玄文所談十妙境智行位因也三法果也感應兼自他神通說法是能化者作屬自也眷屬利益是所化者事屬他也故因等四收十妙盡一代教門所明法相豈過於此今於十義皆用待絶二妙而融會之令無壅礙故云融通入玄解境等為因三法屬果者蓋本玄六初云上來四妙名為圓因三法祕藏名為圓果文位妙通因果今總名因者籤云位妙若立實通因果為對三法且從因說文因果自他四明孤山前五妙是同於後五妙四明兼自他孤山唯屬他正義云自他者攬前五妙名自行因果對後五妙名化他能所妙玄云前五約自因果具足後五約他能所具足文既云約他則唯屬他四明何云通自他耶文今謂玄文雖約自他對前後五妙既云後五約他能所具足能所即是自他下文云能化所化自他義蘊其中能化者作現通說法是果上作用所化者事所化之機天性相關則成眷屬無不蒙潤則成利益並所化邊事也十義十妙也待謂相待彼此互形曰相以他望己曰待以法華之妙形四時為粗以四時之粗形法華為妙待者前四時為所待粗法華為能待妙故云相待絶待者絶前諸粗無復形待故名為絶相待論判出前三教四時之上絶待論開復能開前令皆圓妙籤云圓中約時待絶俱妙文而融會之釋融字謂法法皆融令無壅礙釋通字謂法法通入二凡諸下衆釋意凡諸義釋皆約四教及以五味意在開教悉入醍醐解衆釋者境有七科智明二十乃至利益各明法相意者於此諸釋皆用教味先判後開俱圓俱妙開教等者約教則開三教入圓約部則開四味入醍醐正義云開教不語入圓入醍醐不語開味影略互顯巧妙若斯文鈔如初理境具有七科一一皆用四教揀之意開藏等俱圓復以五味判之欲開兼等皆妙即使醍醐之外更無餘味如此釋之方稱妙法智行乃至利益各明種種法相無不皆用四教五味判後開之皆成極味解理境者實相妙境為智所照從本具邊故名理境柬判也二觀心下敘觀略觀心乃是教行樞機仍且略點寄在諸說或存或沒非部正意故縱有施設託事附法或辨十觀列名而已解觀即能觀妙觀心即剎那妄心稟教修行莫不由觀心顯發故喻樞機樞機者要也發也易曰言行君子之樞機樞機之發榮辱之主也樞喻教行以觀心為要機喻教行從觀心而發如云教不觀心如貧數寶行不觀心非涅槃因仍且下明玄文觀略之意觀心雖是教行之要但玄文正明五重玄義出諸教上觀且傍示止觀則委明行相故於今文但略點示有存沒者非部意故縱諸文末有明觀心但是附法託事雖位妙中略列十乘之名既非專行亦不委明故云或辨等鈔樞即門之要也機謂機關有可發之義蓋一切教行以皆觀心為要皆自觀心而發觀心空故一切法空即所修諸行所起諸教皆歸空也假中亦然豈不以觀心為樞機耶然今玄文未暇廣明寄諸文末略點示爾又雖據義一一合有為避繁文故有存沒如十二因緣境後則有四諦則略蓋有止觀對此明乎教觀旁正如常所說託事則借彼事義立境立觀如王舍耆山等附法則攝諸法相入心成觀如四諦五行等既非專行故十乘不委此即義例約行等三種觀相也解上二句就譬釋樞謂門臼門若無樞則無開閉之功故云要也機謂弩牙弩若無牙則無啓發之用故機有可發之義也蓋一下就法釋以觀心為要合樞要義觀心為教之要果上偏圓漸頓諸法皆我心具行者必須攝法歸心修觀故至果成稱性設化四教義問四教從何而起答依三觀起觀為行要者所修六度萬行皆因心本具故全性起修名無作行皆觀心而發合上發義由觀心故理顯出觀心故果成若非三千空假中安能成茲自在用故教行皆自觀心而發觀心空故等者一切諸法若教若行皆心本具若觀心空則所修六度萬行果上所起諸教皆歸空寂空觀既爾假中亦然說雖次第用在一心只於一心宛有三用此亦為下起教觀之張本也然今下釋仍且略點等未暇廣明者觀心雖為樞要以玄文正明開解未暇委明乘境寄者非部正意故因緣境後則有者玄二十九明觀心者一念無明即是明乃至一念之心既具十二因緣觀此因緣恆作常樂我淨之觀其心念念住祕藏中文四諦則略玄二二十二觀心可知不復記也文以有釋存以略釋沒非全無為沒但觀心語略其文隱沒耳或云二句並釋或存沒則不釋箋要云以略釋存沒固可知不復更出也教觀傍正者樞要云此文興致正為於觀教觀傍正須知二意一約三部所自之文二約一家傳通之旨三部所自則傍正互有如義例云如法華玄雖諸義之下皆立觀心然文本意明五重玄義出諸教上則教正觀傍託事興觀義立觀心若今止觀縱用諸教意在十法以成妙觀則觀正教傍一家傳通則唯觀為正是故三部皆以觀心而為正要乃至以從文故玄既觀傍故於十妙觀有存沒今用旨故玄亦觀正故撮十妙為此十門門門既乃即心妙妙無非是觀若談觀文言望於止觀此中極略若談宗旨望於止觀今文頗周以止觀宗旨無出三千即在一念今以三千不二點示一心心全是妙妙不出十若曉十妙止觀可知故云一期縱橫等既非下釋或辨十觀謂玄文既非專明觀行是故十乘不暇委明但列名耳然後總結指向所明託附二觀顯名所出即義例文中約行附法託事三種觀相也三種觀法初名義三種觀法義蘊經疏天台依諸大乘經立四種三昧修十乘觀法直就陰心顯三千法即從行觀義又依諸經於玄句約事相法相入心成觀託事謂心為能託依正事為所託附法謂心為能附諸法門為所附即事法兩觀之義荊溪考核其義立三種名故義例云夫三觀者義唯三種一者從行唯於萬境觀一心萬境雖殊妙觀理等二約法相如四諦五行之文入一念心以為圓觀三託事相如王舍耆闍名從事立借事為觀以導執情如方等普賢其例可識文次用與此三種觀妙玄文句各有事法玄約四諦五行等即是附法託感應等事修觀即託事也句釋如是我聞等即附法王舍耆山即託事也以玄句消經而於事相法相文末令行者附託觀心免數他寶故缺從行止觀正明十法成乘如正修章專約一心修乎十觀前六章廣開妙解縱明事相觀心亦只助成約行觀爾若義例以三種敵對三部者乃引三部三觀顯文示其觀相也三修不問事法二觀可造修不修則乘境不備不修則立觀何為答山外一宗謂事法觀門不通修習所以玄句立觀心者有二義焉一為已修止觀者令其不忘本習故二為未修止觀者忘於封滯令知起行必依止觀故四明義書引妙玄觀心即聞即行釋籤隨聞一句攝事成理不待觀境方名修觀等文示之乃轉計云不論立陰四明引正當觀陰具如止觀第五去文又諸觀境不出五陰等文逐之又轉計云我本自問於陰揀境諸文所無不問通立陰境四明又引妙樂揀境及心妙玄由一心成觀等文為證既被四明前後窮逐義皆破壞不足評矣四明建立三種觀法皆可造修義書五云三種觀法皆為行立俱可造修若但論教義不觀己心如貧數他寶文尊者之說懸合吾祖所立觀心之意深符即聞即行立陰揀境之文然乘境不備若為修習據義書有乎四意一者咨稟口決如云豈非大師說諸玄疏多在圓頓止觀之前所談玄疏正開座下行人圓解蓋兼有觀行之機欲修觀法故託於事相法相立乎觀門令其即聞即修得益者何限豈待玉泉唱後尋之方修耶或於事法觀道有壅則咨稟口決而通達之二以廣決略文云大師滅後傳持此教為師之者必須懸取止觀之意而開決之荊溪數於記中指乎止觀乃令講授之人取彼廣文決茲略觀既得決通乃於事法觀門便而修習豈須背今見講自尋止觀耶三從行度入文云若於師門先聞止觀久曾研習今覩玄疏事法觀門則用本習觀法度入事法觀門而修或因茲得悟乃名事法觀門悟入非是約行觀中得悟也四略論三觀文云又一種根性只於事法觀門修之得悟亦不待尋止觀故法華三昧只約一念妄心略論三觀乃有三品證相文已上四義並是十義書發明隨聞事相法相攝歸內心成乎理觀不待尋彼止觀專示觀境方名修觀若山外既謂事法不通修習釋彼文云隨聞一句事相法相攝歸真理便是觀心不待託陰修觀此與四明說義優劣可見矣四兼獨事法二觀皆有兼含之義如光明玄觀心三菩提云若知即空真諦菩提心度妄亂心數之衆生若真即假俗諦菩提心度沉空心數之衆生雙忘二邊即發中道第一義諦菩提心度二邊心數之衆生文菩提屬法衆生是事法中兼事故記作附法含託事釋光句以四方佛表四諦智佛即是事四諦屬法事中含法故句記作託事兼附法釋云行者應知借四方佛表四諦智此乃託事含附法也文且行人心無並慮何得兼含而修當知但約兼含釋義不約兼含修觀若從行一種無兼含義舊謂淨名疏釋法無衆生等諸句一一皆以生空觀歷心及餘陰入諸法而觀義書判云乃是用於約行觀門修附法觀以為附法含從行又據方等歷幡壇道具是從行兼託事今謂法無衆生之文四明謂以從行觀修附法觀觀成即附法觀成非法含從行若方等乃修三昧者傍歷幡壇等事非從行兼事也五內外事理從行通觀內外事法惟局內心如四三昧屬從行觀四行中修十乘觀正觀內心至例餘陰入歷緣對境則通觀內外十六觀經觀佛亦從行外境附法乃附四諦五行法相入心成觀託事則借事表託內心唯局內心不通外境通事理者上三三昧并諸經行法屬理縱任三性是事理觀觀陰心本具三千事觀觀變造三千舊謂事法亦通事理今不取焉六料簡問輔行標歷結託義例引歷例託其義云何答諸文凡約事相明觀皆名託事文句借城山事表對五陰正論修觀止觀以正觀心傍歷事儀表對法門修觀觀門雖異表託義同故得諸文通稱託事則標歷結託引歷例託二俱無妨請觀音疏以大林精舍明託事觀與城山同義書云大林精舍是依報色入以理智體之正同方等普賢歷尊容道具用法門體達此則方是託事之觀文大悲懺儀云二託事者觀音一身有千手眼手有提之力眼有照明之用即是一千神通智慧也又云三種觀門相須而進文此與止觀傍歷義同皆可稱託事也問四種三昧收諸行盡且四三昧自屬從行何云收諸行盡答諸經所明行相不出四種故云收盡事法二種乃吾祖於玄句事相法相立此觀心令行人攬彼事法入心成觀不可為難二所明下立意又二初重示大部意所明理境智行位法能化所化意在能詮詮中咸妙為辨詮內始末自他故具演十妙搜括一化出世大意罄無不盡解科重示大部意者向敘前文教廣觀略今欲正明述作意故重示之以為下妙解妙行之張本也意在能詮等者大部明此境等十妙是能詮名意在開顯一代教中因果自他之法無不咸妙為辨等者示須十妙所以如來出世施設一化無出自行因果化他能所故演此十則一化大意該攝無遺文心解曰不談十妙攝法不周不論一化示妙不遍文十妙釋題是能詮名詮於題下別文故云詮中詮內也鈔更舉十妙方出其意能化即應并神通說法也所化即感及眷屬利益也此十乃是一代教中能詮名字大部明此意在開顯諸名咸妙故也須辨十者欲收始末自他盡故始謂境等即自行之因末謂三法即自行之果自他如前若辨此十一一咸妙則了如來出世意盡解釋重示科初二句總標次釋能化所化即後五妙前五妙文顯不釋此十下明大部明此意開諸名皆妙謂一代能詮無超此十妙玄釋法華開顯之意開前四時所談十粗皆成十妙此十若妙則一代能詮諸名無不成妙也須辨下釋為辨詮內等出須十妙意始末即因果也自他即後五妙故指如前二故不下正明今述意二初為成妙解故不可不了十妙大綱解不可不了即誡勸之辭玄文十妙科目繁夥猶如網目舉其大綱則網目可尋大綱即三千也若欲立行造修先須解了三千三諦之法體此之法體是如來當時一番修證自他因果之法今欲修證此從因至果之法先須解了依此妙解方可立行鈔欲知此十皆妙須了開顯大綱即三千世間俱空假中是今經之大體能開之絶妙境即此故事理俱融智發此故無緣行起此故無作位歷此故相攝三法究盡此故果滿生具此故一念能感佛得此故無謀而應神通用此故化化無窮說法據此故施開自在眷屬全此故天性相關利益稱此故無一不成佛今此十門正示於此若能知者名發妙解解釋為成妙解初總明三千妙解境即下別示十妙所依今此下結顯十門所示三千世間俱空假中者世是隔別十種五陰十種假名十種依報隔別不同故名世間是間差三千種世間差別不相謬亂故名為間以三千法皆因緣生是故一一即空假中今經大體者法華三周開顯並以三千為體輔行云十妙是今經權實正體亦大車體亦寶所體文能開等者妙樂云若不先了能開之妙將何以為所開之粗文境即等者此字即指三千大綱七科諦境不出三千理本圓融事寧隔異理即性具事即變造具變不二故曰俱隔色心門從境妙立故荊溪名事理不二門也智發等者以智緣境智為能緣境為所緣以境發智境為能發智為所發三千妙智既全境而發境智一如緣即無緣行起等者進趣名行即修治造作全性德三千起修德妙行以性奪修修德無功故稱無作位歷等者位位皆具三千故一一位具攝諸位功德初阿字門具四十二字後茶亦爾故云相攝三法等者妙乘三軌真性遍周觀照圓導資成助發唯佛究盡故稱果滿生具等者生雖在迷理體本具衆生由理具三千故能感佛得等者諸佛由三千果滿故能應所謂任運真化不須謀作如月不下降水不上升水月一際感應道交神通等者神名天心通名慧性與六法相應用此三千任運化物化復作化化化無窮說法等者五時說法憑據此三千施則稱性被機分隔而說開則稱理示妙無不圓融眷屬等者前機受道即成眷屬既全三千故得父子天性自然相關利益等者十種利益稱三千故七方便人來至今經咸成佛道如三草二木皆一地所生一雨所潤也今此十門正示此十妙大綱以十法皆即三千三諦故皆稱妙能知此者名發妙解為此義故十門所由作也若能知者名發妙解是發明荊溪開發妙解故述此十門不離一念令修觀者易入序云荊溪妙解蓋謂此也二故撮下為成妙行故撮十妙為觀法大體解撮攬也攬此十妙三千之法為今止觀之大體而修妙行述作意荊溪於迹本二門之間立此十門有何深意孤山正義云蓋荊溪大師攬玄文教義入止觀行心俾夫名字行人識法相之有歸達造修之無滯也又云悟理之要必在十乘故荊溪恐後昆昧旨乃於釋籤更立十門結束十妙咸歸止觀一念三千不思議境方顯教不虗設悟理有從荊溪述作意在斯焉又云以彼觀門收此教義以此義教識彼觀門若欲造修須依彼部勿謂此文便堪修行文既云攝教歸行唯以玄觀教理相對義歸一邊反顯事法不通修習乃見十門虗設難可信從淨覺文心解云述作之意不逾二焉一為攝教成觀即前云故撮十門為觀法大體二為示略知廣即後文云使一部經旨皎在目前然其後意亦成前意文初云攝教成觀無妨之說次云示略知廣以十門為略經文為廣況以後意成前致使二義皆未明述作之意法智科此文云為成妙解妙行且玄文十妙大師縱辨宣揚釋經題旨豈非妙解文文之下立觀心釋豈非妙行又何假荊溪重述十門方成妙解行耶須知玄文十妙法相該博學者難以造入荊溪攬彼十妙攝作十門門門結歸一念三千以此三千是十妙之大綱觀法之大體乃以略顯廣以易通難正為成於妙解妙行如此明之深得荊溪述作之意矣觀法攝屬問荊溪述此十門以三種觀法言之屬何一種若云從行則部旨有妨蓋妙玄唯明事法籤解玄文豈是從行反顯事法不通修習過同山外若云託事附法且十門不約四諦五行法相及王城耆山事相明觀何名事法答須知的屬事法二觀所攝蓋由妙玄廣解十妙文文之下立觀心釋或於四諦五行文末附彼法相以明觀心或託感應神通事相以明觀心故今文云縱有施設託事附法然玄文正意生解義強觀且傍示乘境不備難以造修若大師在日說玄疏時座下有觀行之機咨稟口決而修習之得益者何限大師滅後為人師者必須三部通達諳練學者欲修事法之觀懸取止觀十乘十境而開決之荊溪懸鑒末代神根既鈍何能諳練止觀乘境之相故於迹本二門之間述此十門門門結歸一念三千為觀法之大體稟學之徒覩事法觀心之文若欲造修不待遠尋止觀乘境即觀一念具足三千三諦便能通入所謂以略顯廣以易通難即此義也故鈔云玄文雖立觀心而且託事附法蓋非部意故多缺略若具論能成之功須指摩訶止觀也又云此文乃行正解傍與止觀同成觀體以由十門門門皆顯三千即是摩訶止觀十乘觀法之大體若論能成雖是止觀從行須知正為成就玄文事法觀門觀成則事法觀成非從行觀成也是知十門即玄文總觀心文耳能成既是從行不妨通於內外二境所成正是事法不與部旨相違或據攬彼無邊法相攝作十門作附法觀收攝須知玄文本通事法二觀不可迷荊溪義例以三種敵對三部便謂玄文只屬附法且十妙法相無邊行人心無並慮安可俱時而修豈可見攬十妙法相遽作此判鈔言觀法者十乘也應知止觀十乘是別論行相而一一乘不離三千即空假中故云觀法大體義例云散引諸文該乎一代文體正意唯歸二經一依法華本迹顯實二依涅槃扶律顯常以此二經同醍醐故是知用此十妙絶待之義為觀體者方譬日光不與暗共又此三千法門遍於諸法若色若心依之與正衆生諸佛剎剎塵塵無不具足故華嚴云如心佛亦爾如佛衆生然心佛及衆生是三無差別故今家釋經題法字約此三法各具三千互具互融方名妙法然雖諸法彼彼各具若為觀體必須的指心法三千故玄文云佛法太高衆生法太廣於初心為難心佛及衆生是三無差別觀心則易又義例云修觀次第必先內心今家凡曰觀心皆此意也故今文中撮乎十妙入一念心十門示者為成觀體故也若不爾者何故節節唯約心說豈塵剎生佛而不具邪若不見此全失今文述作之意也解釋為成妙行初明絶待三千為觀體十乘觀法是所修行相三千三諦即十乘之大體別行玄記云止觀十乘是觀別相三千空假中是觀總體文別相雖有十乘論其大體只一三千如云觀法非十對根有殊雖復根殊但以不思議觀觀不思議境文十妙既以三千為大綱故撮開顯大綱為觀法大體大綱大體法喻異耳此且正示次引文證本迹顯實者迹門顯圓成之實本門顯久成之實文句分經云前十四品迹門開權顯實後十四品本門開權顯實義例云所以始末皆依法華此即法華三昧之妙行也次用涅槃者雖依法華咸歸一實末代根鈍若無扶助正行傾覆正助相添方能遠運文設三種權扶一圓實名扶律顯常金錍云指的妙境出自法華此因野客問妙境所憑故大部談圓極處無非三千妙境所出獨在法華今文通約一部言之前六章廣開妙解通乎大小偏圓論其正意歸於二經由本迹顯實談常顯性是同同一味故結顯云是知用十妙為觀體等不與暗共者既指開顯十妙三千而為觀體方可喻如日光赫奕不與暗共在昔諸經大小並陳權實各立其猶燈炬星月與暗共住來至今經指權即實佛慧圓明法界洞朗其猶日輪當午無處不南妙玄云燈炬星月與暗共住譬諸經存二乘道果與小並立日能破暗故法華破化城除草菴故文又此下明三千周遍示唯心體具初明諸法圓具又者更端之辭遍於諸法此句總標色心是已色陰及四陰心依正者色心是正國土屬依生佛即十界正報剎塵即生佛依報即心佛衆生皆具三千引華嚴如來林菩薩說偈為證彼文先明心造一切次以心例佛以佛例生明三無差今家釋心造有事有理則三法各具兩種三千方無差別義書云以我一念之心及一切衆生十方諸佛人人說於理具各各論於事造而皆互具互攝方名三無差別文今家等者妙玄三釋法字約心佛衆生三法一釋衆生法云一法界具九法界則有百法界千如是等次約佛法心法釋云云今云三千廣略異爾各具互具者隨境示具曰各具體本同曰互然雖下明觀體唯心諸法體同故彼彼圓具今欲修觀須揀難從易的指自心故引二文為證佛法等者義書云是則諸佛亦有心衆生亦有心若隨淨緣熏起作佛界之心則高遠難觀若隨染緣熏起作九界心則廣散難觀故輒取一分染緣熏起只今剎那陰識之心依之顯性也文義例云者心境釋疑例問諸文皆云色心不二若欲觀察如何立觀答色心一體無前無後修觀次第必先內心文今家諸部凡明觀心皆揀難從易之意故今下的示今立意今之十門撮彼十妙入一念心束作十門而示者為成觀法大體故也撮前五妙成今四門為十乘觀體撮後五妙成今六門為起教觀體並以心法三千為門不然何故十門節節云一念或心性剎那等耶豈可見多明心具不了揀難從易之意便謂塵等不具乎諸法圓具如向所陳孤山唯談心具不許色具故寄此斥之今為成妙行故撮十妙大綱一念三千成乎觀體不見此意全失荊溪述作之意也二若解下例後義彰法理無殊二初例本妙若解迹妙本妙非遙應知但是離合異耳因果義一自他何殊故下文云本迹雖殊不思議一解科語謂以前迹妙例後本妙又以釋名例下四章彰本迹十妙名等五章自他因果之法三千妙理無殊初例本妙迹本俱談十妙但有離合之異自行因果既一化他能所豈殊故引玄文為證此二句本肇師九轍中語彼第六本迹無生轍云多寶為本釋迦為迹本既不滅迹豈有生本迹雖殊不思議一文今家雖用其語義則永異以約久遠成佛為本中間施化今日五時近成為迹本迹久近雖殊三千三諦不思議一也鈔若本若迹各論十妙而不同者但是互有離合故也迹因具明境智行位四者離因故迹果惟明三法一妙者合果故本中不云境等唯明一本因妙者合因故本果之外更立本國土本涅槃本壽命者離果故故知唯云因妙必具境等唯云三法必具國土等若知因果不殊自他豈應有異以本初坐道場時亦遍赴物豈不現通說法豈無眷屬獲益邪應知久近雖異皆以三千俱空假中而為大綱故云不思議一解若本下釋初三句若知下因果義一自他何殊應知下釋後二句離合異者迹中因開而果合合習果報果為三法妙也習果既證三法必有壽命國土但合為一三法妙耳本中因合而果開開習果出報果明本國土妙也蓋由涅槃壽命國土是稱實感報故於習果開出涅槃壽命國土之報果亦是開正報出依報也又因果有傍正玄九云迹門破廢方便開顯真實佛之知見明弟子實因實果亦明師門權因權果為成弟子實因實果因正果傍本門廢方便之近壽明長遠之實果亦明弟子實因實果亦明師門權因權果要顯師之實果果正因傍文良以迹中正為物機開顯得入真因故因為正本中正開長遠壽量故果為正正則離而詳說傍則略而合明因果既有傍正所以文有廣狹義有可否文廣狹者唯佛與佛乃能究盡諸法實相境妙也唯我知是相十方佛亦然智妙也本從無數佛具足行諸道行妙也天雨四華位妙也此因文廣也佛自住大乘果文狹也本門經曰我本行菩薩道時所成壽命今猶未盡因文狹也我成佛來久遠若斯果妙也自從是來我常在此婆婆世界國土妙也然今非實滅度而便唱言當取滅度涅槃妙也處處自說年紀大小壽命妙也此果文廣也義有可不者機土淨不淨化事成未成故於習報開不開也由本佛是淨土淨機故不說涅槃即於法華唱滅有涅槃妙既有涅槃必論壽命長短故有壽命有正必有依故有國土又往事已成開出涅槃等迹中無此但一果證三法而已由此諸義故本迹十妙互有離合也妙玄本門文意二況體下例四章況體宗用秪是自他因果法故況復教相秪是分別前之四章使前四章與諸文永異解上以迹例本總是釋名今以釋名例下四章亦不外此故云秪是教相只是區別粗妙永異諸經也自他因果與因果自他不同前以因果自他收攝十妙今欲自他各論十妙機應皆能化物故鈔云必合從因至果等故自他各有體等則自他在前也鈔如上所明二十重妙皆是釋名而含體等以釋名是總三章是別總總別故且十妙中境即是體智行位法是宗應等三妙是用感及眷屬既獲利益必合從因至果還起利他之用亦具體等故云秪是自他因果法故又名等四章皆是被下之法即屬教也而須以相別其粗妙今之四章出前三教四時之上復能開前今皆圓妙故永異之言含其待絶以唯今經能遍開故解初釋例三章又名下釋例教相初如上下示名含三章且十下釋自因果感及去釋他因果釋名含體等者名謂名言一部言句皆能詮名體宗用三皆遍始終但題目是總經文是別攬別為總就題釋名故釋名章能總含三章之別如法華本迹十妙以名其名具含體等即今文云境即是體等境是理境因果所依故屬體智行位三是因三法是果因果屬宗應及神通說法是果上之用依體起宗宗成有用也籤云境是體是法身智行是宗是用乃境智行三住前三法對體宗用即一性二修規矩今文以名例於體等名既不出十妙故以十妙分對體等也名等等者鈔主釋意前四章為教第五章為相常逾名是能詮體等是所詮今文體等例屬於教者才涉言詮即屬教也妙宗云上之四章皆是言教謂詮名詮體詮宗詮用之教妙樂云通論聖言被下俱名為教文並約能詮為言妙宗云五重玄義本是經中所詮觀法文此約所詮為語此四皆是聖人被下之法故皆屬教須以大小偏圓之相揀別粗妙今經四章相待論判則出前三教四時之上絶待論開則開前諸粗令皆圓妙以唯下釋絶待永異相待則待粗論妙永異可見絶待則無非一妙何言永異故釋云唯獨今經遍開一切則前部所無豈非永異又凡言教相有教即是相有教家之相玄十云教即是相非謂無相文於前四章俱論簡判名教即是相妙樂云教家之相故云教相文謂前四章為教第五章為相即前四章教家之相也三若曉下別示妙體令解行俱成三初指妙歸心若曉斯旨則教有所歸一期縱橫不出一心三千世間即空假中理境乃至利益咸爾解科別示等者上科敘前例後名等四章玄文該遍今乃離文別示三千妙體入一念心令妙解行俱得成就初指妙歸心若曉三千三諦十妙大綱之旨則一代教法有歸趣矣以一代教法不離三千三千不逾一念故云一期等籤一云始自寂場終乎鶴樹故云一期五味為縱四教為橫如來五時化物四教逗機所說法門雖即無量不出一念三千三諦理境等者上雖攝法歸心言猶通總故今歷妙別示始自理境終至利益無出一念三千故云咸爾也鈔三千妙體為教所歸故一期之內五味傳傳相生故縱四教各各趣理故橫而所詮法雖有顯覆準今經意未嘗暫離三千妙法又雖諸法皆具三千今為易成妙解妙觀故的指一念即三法妙中特取心法也解釋指妙歸心今初正釋三千妙體等者一代時教宗歸法華法華開顯三千實相是諸法之大旨衆流之歸趣也傳音轉驛遞之義約部則五味次第相生從淺至深為縱約教則藏通趣真別圓趣中為橫所詮即境等十法雖有昔日之覆法華之顯若準今經開權顯實正意則無非三千妙法以前四時十法之粗皆從三千妙理施出故也又雖等者上雖通以諸法各具三千為所歸今之文意為成觀故的指心法即揀難從易心佛衆生三法中揀生佛之高廣特取心法近而復要易成妙觀故也鈔應知心法就迷就事而辨故釋籤云衆生法一往通因果二往唯局因佛法定在果心法定在因若約迷悟分之佛唯屬悟二皆在迷復就迷中衆生屬他通一切故心法屬己別指自心故四念處節節皆云觀一念無明心止觀初觀陰入心九境亦約事中明心故云煩惱心病心乃至禪見心等及隨自意中四運心等豈非就迷就事辨所觀心解此句定心法屬於迷事為下觀真立陰破立之張本應知之言辭含誡斥應知此心乃約迷約事以辨非從悟從理以論即引三文為證初觀陰心證心是迷下之九境四運心等證心是事玄二初云若廣衆生法一往通論諸因果及一切法若廣佛法此則據果若廣心法此則據因籤二二十釋云然衆生義通故云通論義非究竟故云一往一往雖通二往則局不通於佛及唯在因文此文鈔中三番引用初定心法在迷二斥山外違文三釋因果二字雖三番引各有所主非繁重也玄籤但約因果通局以論三法四明復約迷悟自他柬判者以因果名義然有收揀以六即言之九界屬迷皆名理即名字已去並名佛界此收無不盡也下文云因從博地至等覺還果唯妙覺此揀無所遺也則因果分之九界為因佛界無果其如佛界言猶通漫名字以去並名佛界故須復約迷悟甄分佛唯屬悟的取圓教妙覺為果等覺已還並屬九界三道以無明未盡故也心生雖皆在迷心法乃別指自己剎那妄念以心對生九界皆名衆生並屬於他又復應知玄籤約教且約因果今文明觀更約自他下文云生雖在因復通一切唯取心因是今觀體文故知四明約因果迷悟自他揀判方見三法體相不濫矣四念處等者彼文四九云此之觀慧只觀衆生一念無明之心即是法性又云觀無明心畢竟無所有而能出十界諸陰又云今觀此無明心從何而生等文止觀初觀陰者正修章初觀陰境用十乘觀法下之九境亦是約事第四三昧隨自意中觀起心推四運亦是事也豈非下結指上所引文皆是迷事三法通局玄籤之文如前所引今問玄文云一往通論諸因果諸者不一之辭似約界界各論因果四明那約迷悟九一分耶答諸字訓於即語助也下文云一往通於因果是也舊謂界界各論因果者非問十界因果攝法周足何得又云及一切法答拾遺記云一切法者即是假人實法及以依報各有性相體力作因緣本末究竟等法也是知上云因果通言十界今云一切法即十界中各具十如是法界界互具乃成千如矣舊謂九界中善惡等法義恐不然問籤云一往雖通二往則局不通於佛及唯在因文既云不通於佛又云及唯在因何繁重乎又及字對何處下答此二句釋上二往局義以衆生法二往言之正在於因不通佛界唯在九界故云不通於佛既不通於果佛及唯在九界之因故云及也問衆生法須約一往通論有何所以答玄文廣明千如妙旨正約衆生法說之一往通論十界皆名衆生則千如義備也鈔有人解今一念云是真性恐未稱文旨何者若論真性諸法皆是何獨一念又諸文多云觀於己心豈可真理有於己他更有人全不許立陰界入等為所觀境唯云不思議境此之二師灼然違教解敘破清昱二師觀真棄陰初云是真性是清師次不許立陰天台昱師也忠法師云如序中引示珠指解今一念以帝網珠喻乃至云我之一念亦復如是能如是觀一切諸法唯心無性名真性空等文今且從容不迫略斥之日恐未稱不二門之文旨何者下徵釋且摩下示止觀前六章廣開妙解明一切諸法無非真性何獨一念今之一念為成妙觀須就迷就事而辨若敻指真心初心如何造趣諸文觀己心者如籤云己心生佛別行玄云他者謂衆生佛自者即心而具文若論真性生佛平等無間己他更有人者忠法師云昱師唯觀不思議境消一念三千文若據注文本無此語但云介爾起心三千性相即非縱橫並別之旨故云總在一念文既云三千性相非縱橫並別豈非不思議境故四明約義引而破之此之下總斥二師灼然違背一家教文觀真妄問一家圓觀觀一念心為真為妄若云觀真止觀揀境修觀唯觀識陰若云觀妄止觀何云繫緣法界妙樂何云但觀理是等耶答示珠指謂心唯是理如云一念即一性也一念靈知等又云心即生佛之心非離生佛外別有心為生佛之本文謂心是非迷非悟之真心究其弊源始因慈光恩師兼講華嚴見清涼大疏以心法是理為能造生佛是事為所造既不深本教濫用他宗故定一念屬真清昭諸師謬有承襲咸謂觀真須知克論此心真妄同源衆生無始在迷未嘗離念約修門說必須達妄即真若敻指真心則杜初心入理之門起觀之處凡論諸法皆是真性自是開解奈何山外境觀不明將解為觀慈雲所謂不知啓發之所四明定所觀境的屬妄心只由凡夫衆生迷真逐妄見前一念全體是陰欲令返本還源故須從近從要令達妄以顯真方是佛祖為人之意若敻指真心真心已是顯悟何須修觀耶然雖定境屬妄畢竟圓頓行者正用觀時觀一切法為真為妄當知直觀此一念妄心當體具足三千諸法皆不思議所謂造境即中無不真實止菴曰直觀一念心體是三千譬如見冰不問融與不融直作水會先達云山外觀真即同觀妄四明觀妄即同觀真斯言得矣梵天昭師孤山圓師本承襲清師之說孤山見四明立義定境屬妄遂轉計云昔人觀真今人觀妄鷸蚌相扼我乘其弊達六識之妄心顯三諦之妙理文昭師因被四明往復徵詰巧作救義云觀六識之妄心成三諦之真心文義書云豫聞此救喜躍不勝蓋豫義論有益能轉人心改迷從悟也上人因誰得解若謂奉先座下得聞且示珠全不約妄釋心亦無觀妄成真之說文是知觀妄成真出自四明如云乃依此心觀不思議顯三千法又云以依陰心顯妙理故孤山何得竊取以為己說却乃妄破直云觀妄耶昭師縱能轉計巧救為觀妄顯真但有其言全迷其義也立陰止觀第五初正修章列所觀十境陰乃居初文云此十境通能覆障陰在初者一現前二依經大品云聲聞依四念處行道菩薩初觀色乃至一切種智章章皆爾故不違經又行人受身雖不陰入重擔現前是故初觀輔行云今家用此十法為境不同常途別立清淨真如無生無漏文據此則圓頓行者陰境現前恆得為觀何須言立蓋由山外不立陰等為境直觀不思議境今對彼不立故云立耳問圓頓行人必須觀陰釋籤何云陰等十境唯在三教答若論陰體所屬在前三教如止觀五二云此十種境始自凡夫正報終至聖人方便陰入一境常自現前方便即別教道則別教教道已還三教九界背性成迷無非三障四魔皆屬陰境所攝圓人了知無非性具法門荊溪據陰體而判故云惟在三教圓人既了此陰無非法界即此便是圓人所觀之境故連文云今是圓人所觀境界文蓋前輩有讀文不盡之過但以陰境在三教為難殊不知今是圓人所觀境也鈔且摩訶止觀先於六章廣示妙解豈不論諸法本真皆不思議然欲立行造修須揀入理之門起觀之處故於三科揀却界入復於五陰又除前四的取識陰輔行又揀能招報心及以發得屬於下境此是去丈就尺去尺就寸如灸得穴也乃依此心觀不思議顯三千法乃至貪嗔等心及諸根塵皆云觀陰入界及下九境文中揀判毫末不差豈是直云真性及不思議解引止觀依解立行揀境修觀皆觀陰妄結斥觀真不立陰境之非初明前六章開解然欲下明第七正修至觀陰入界總是初境及下去明下之九境豈是下結斥前六章開解者止觀五初云前六重依修多羅以開妙解今依妙解以立妙行文輔行問五略中有行有解有因有果何故但云六重是解答言大意者冠於行解自他因果意既難顯還作行解因果等釋非謂已有行果等也若論文意但屬於解於屬解中恐解不周故須委明名體及攝法等方便望五稍似行始若望正觀全未論行亦歷二十五法約事生解方乃堪為正修方便是故前六並屬於解文然欲等者既能解了法法本真皆不思議若欲起行造修入此真理須得其門欲觀此不思議境須知起觀之處所以吾祖於正修章中廣明十境十乘行相三科揀卻界入者止觀云依毗婆沙明三科開合若迷心開心為四陰色為一陰若迷色開色為十入及一入少分心為意入及法入少分若俱迷者開為十八界也十界少分屬色七界少分屬心以此法界中亦有四類法故言二少分者以法入中有四類法謂無表色心所法不相應行三無為則無表色屬色心所法屬心不相應行非色非心三無為非三聚攝文次克示境體云若欲觀察須伐其根如灸病得穴今當去丈就尺去尺就寸但觀識陰識陰者心是也文輔行云從廣之狹正示境體陰入界三並可為境寬漫難示故促的指略二就陰如去丈就尺略四從識如去尺就寸以由界入所攝寬多陰唯有為有為之中義兼心色故置色存心心名復含心及心所今且觀王置於心所故初觀識餘下例之文輔行又揀等者彼云於第六中取能招報者仍須發得屬煩惱境餘之分別方是今境文彼云取取去也今文云揀其義是同能招報心有二一見行二發得並須揀去故四明用及以二字代彼仍須文義易曉發得能招報屬下煩惱境中見行能招報乃受想行三心雖五陰中揀去界入中未分王數故須此揀在後文例餘陰入中觀乃依等者正指所揀克示境體總無明心也貪嗔等心即歷餘一心如破遍文後云歷餘一心三觀者若總無明心未必是宜更歷餘心或欲心嗔心慢心此等心起即空即假即中還如總中所說文輔行云今此但觀欲等心王文及根塵者破法遍文末例餘陰入及十乘文後歷緣對境故云皆也止觀云前來所說但觀識陰作如此說餘四陰亦如是十二入十八界亦如是輔行云此文應在第七卷末十乘文後何故於此即例餘耶答以義便故從初至此單約識心從此已去乃至離愛具約五陰方成行相故須於此例餘陰入輔行云欲融諸法示觀境遍文歷緣對境者止觀云端坐觀陰入如上說歷緣對境觀陰界者緣謂六作境謂六塵文更有淨心歷法以示妙境在第五卷不思議境說教大體科後及下九境謂煩惱病患業相魔事禪定諸見現文六境也兼上慢二乘菩薩三境託緣不說前開章明於十境今亦通言文中揀別分判如云煩惱心病心等皆屬迷妄之事毫𨤲無有差忒也揀境止觀正修章先示三科色心為境次克示境體揀去界入及前四陰唯觀識陰文云若欲觀察須伐其根等并輔行釋並如前引但南屏已來謂識中有善惡無記三性為通觀三性別觀無記若別觀無記止觀不揀善惡總觀識陰若通觀三性輔行何云在無記故竹菴草録釋出此義云摩訶止觀所立觀境通陰界入初心通漫難可用觀的揀見前無始日用能造諸法識陰心王為所觀境若乃善惡無記三心屬所起心相非能造識體非所揀境歷緣對境隨自意三昧方能觀境荊溪云在無記故通約五陰色心屬報陰法對下所發煩惱九境非善即惡以分三心本自分明初無難見文但輔行料揀自來謂文無生起止觀揀境已自分明荊溪何故孤然立問況五識五意識乃是界入中法相大師既揀荊溪又却取來為問至答文中又云定是今境豈非師資相違止菴約二義斷之曰界入無歸識名通濫由止觀揀去界入諸識唯取第六識心荊溪謂五識五意識既皆揀去在何處得為觀境又五識五意識通名為識何等識心是今觀境正對止觀設問初不相違今但直消輔行料揀之文則揀境之義從而可了問五識五意識及第六識並能生於受等三心何等識心及所生三心是今觀境初且定能生所生何等下徵問此據上文引有宗所計以下界入二科對今五陰揀示境體識心而問上文既云今初且觀諸識為境又云若以識界而為觀初何往不得但識名多故陰在初故又名略故是故先用文其義已明恐人迷故復設此問意謂三科既但開合之異若略二就陰十八界眼等五識及五意識及界入中第六識心十二入中雖無識名意根即第六識以前念為根後念為識也此等識心及所生三心是今所觀陰境否答五識五意識定是今境未屬煩惱在無記故先答界中五識等也五意識者即第六識與眼等五識同時取境名五意識亦名同時意識約用中相背故分五種既是報陰無記未屬所起煩惱心也判屬今陰境所觀在下當明於第六中取能招報者今文云輔行又揀能招報心彼文云取取去也此答第六識先答所生三心也能招報即受想行受想煩惱潤於行業遷流造作即能招報此有二種一者見行二者發得屬下煩惱境第八記云自此已下現文六境及略三境咸是發得此九境外所起煩惱乃至四弘但屬受等三陰所攝是故尋常非無煩惱乃至發心亦並通觀非不名境文雖在五陰中已揀三心由界入中未分王數故須此揀然此現起能招報心輔行既云非不名境亦並須觀今既揀去就何處觀須知例餘陰入中觀仍須發得屬下煩惱境今文云及心發得屬於下境現行能招報心如上已揀仍須更揀發得能招報心亦當揀去自屬下煩惱境中所觀然輔行的指煩惱一境今通云下境者以煩惱所起之心既是發得下諸境中所起之相亦不出此故也不答五識五意識中三心者以起惑造業皆第六識王數共造五識五意識但為助耳既揀第六餘五可知餘之分別方是今境謂第六中有乎三種除彼二種能招報者對境所有能分別者名之為餘故云方是又此五識五意識雖是今境仍在下文歷緣對境中明覆疏初答文止觀第七十乘文末歷六作緣對六塵境修觀然語不頓疏說非行時前判定在今所觀境乃是修觀行者歷經行等緣對色香等境以正觀心攬彼緣境攝入一心總為觀境妙觀觀之令成妙境故止觀云若不於行中習觀云何速與道理相應又云懷道之賢觸處用觀文行緣既爾餘之緣境用觀亦然己丁並依桐洲注釋五識五意識第六識相狀智湧云今且約於眼根見煙以示其義由勝義根引生眼識見於前塵分別是煙屬現量境既見其煙比知有火即眼意識屬比量境境謝緣念即存屬第六識緣法塵中落謝色塵竹菴云剎那有初後境界有現比並能生三心之相鑑堂約親疏說今謂只是空有二宗宗計不同荊溪挾有宗立難不必苦求相狀也鈔問常坐中云以法界對法界起法界安心中云但信法性不信其諸及節節云不思議境今何不許答此等諸文皆是能觀觀法復是所顯法門豈不讀輔行中分科之文先重明境即去尺就寸文也次明修觀即觀不思議境等十乘文也況輔行委示二境之相非不分明豈得直以一念名真理及不思議耶解料簡法界法性不思議等第二卷常坐中但云一念法界繫緣法界今是第一卷弘誓中文云佛法界對法界起法界輔行釋云佛法界根也對法界塵也起法界識也仍本迷說故云根等得名法界更無差別文義例作弘誓文引二文俱有法界之言約義引之安心中者止觀云惟取此心但是法性起是法性起滅是法性滅文今是發大心科六即顯是中文義例亦云安心者二文皆云法性文意相似約義引也二文法界法性正符山外之見今何不許而觀妄耶答中二句總判上諸文不出能觀所顯下文一一對釋義例云體達若起若對不出法界止觀云繫緣法界是止一念法界是觀即法界是能觀所顯止觀云若未聞時處處馳求既得聞已攀緣心息名止但信法性不信其諸名之為觀即法性是能觀所顯重明境者前於生起互發中具明十境已竟今復明之故云重明於此陰境委明三科色心正是定境未論修觀次明修觀即不思議境十乘觀法義書亦云輔行於陰入境文分兩段謂先重明境即指三科內唯取識心去尺就寸文也次明修觀即十法成乘之文也文委示二境者揀示陰境及不思議境也豈得下結斥二師鈔應知不思議境對觀智邊不分而分名所觀境若對所破陰等諸境故不思議境之與觀著名能觀故止觀云譬如賊有三重一人器械鈍身力羸智謀少先破二重更整人物方破第三所以遲回日月有人身壯兵利權多一日之中即破三重輔行釋云約用兵以譬能所今以身壯譬圓三諦兵利譬圓三止權多譬圓三觀械等並依身力故也上皆輔行文也豈非諦觀俱為能觀耶今更自立一譬雙明兩重能所如器諸淳朴豈單用槌而無砧耶故知槌砧自分能所若望淳朴皆屬能也智者以喻得解幸可詳之皆為不辨兩重所觀故述斯旨解由山外不曉兩重所觀直將不思議境為所觀境不知若對陰等諸境則不思議自屬能觀以對觀智邊忘能所故從境受名耳故此特以兩重能所示之令知所觀決然屬妄如義書云故不思議境望下九乘名所觀境望前識陰則妙境并下九乘同是能觀之三觀也大意云諦觀名別體復同是故能所二非二文然此兩重在於一心更無前後譬如等者止觀約別圓對揀修證遲速之殊含於兩重能所之義故引為證彼云別教初知中道前破兩惑奢促有異何以故別除兩惑歷三十心動經劫數然後始破無明圓教不爾只於是身即破兩惑即入中道一生可辨譬如賊有三重等止觀六二十六紙賊有三重三惑一人別教行人器械鈍次第三止械者兵器通名身力羸次第三諦智謀少次第三觀先破二重別教歷三十心方破二惑十住修空破見思十行修假破塵砂更整人物十向修中方破第三無明歷劫修行故云遲回日月有人身壯圓教行人一日一生一生能入初住故曰一日之中即破三重兵智譬三止三觀並是能觀身譬三諦此語所觀械等並依身力等者三止三觀皆依三諦譬智械並依身力而有輔行云智械並依身力故也文兵器智謀是能依譬能觀妙止妙觀身力是所依譬所觀不思議境此一重也賊譬所破陰妄之惑前之諦觀若望所破皆屬能破此一重也今更等者復加砧槌一喻的譬圓教兩重能所兩重用在一時故曰雙明器諸淳朴者妙樂云本以古質為淳朴今以未治為淳朴令其成器故名為器淳朴不一故名為諸文兩重能所舊云初重以一心三觀為能觀一境三諦為所觀次重合上境觀俱為能觀一念妄心為所觀問兩重能所約何義而立答初重約圓詮開解而說次重約立行造修而說文讀教記云定境用觀一家要宗必先詳於解行之文解行詳則境觀明矣止觀一部其要在乎解之與行解則圓解諸法本真行則立行定境用觀第五文云前六重依修多羅以開妙解今依妙解以立妙行此解行之分也余嘗斷曰開妙解於定境之前用妙觀於定境之後故知定境用觀盡在立行文中與開解文了不相涉荊溪義例十不二門大槩同然皆先開解而後立行也立行有二先定境後用觀定境者何立陰是也若不立陰妙觀就何處用妙境於何處顯故十義書云定境修觀乃是止觀一部綱格進道要宗輔行於陰入境文分兩段謂先重明境即指三科內唯取識心去尺就寸文也次明修觀即十法成乘文也山外之失可知矣近代有謂定境之後方用妙解蓋不究此解行之文如其說則定境在前開解在後矣又謂先以不思議觀觀不思議境為初重能所却合不思議境觀而觀於陰為次重能所如其說則修觀在前定境在後矣顛倒錯亂不足評也文私謂開解立行定境用觀如上所明可謂詳矣須知圓頓行者正用觀時的觀現前一念妄心具三千法三千即一念一念即三千不縱不橫不前不後觀之不已則陰境轉成不思議境矣不思議境境即是觀兩重能所歷歷分明以要言之但觀心是不可思議境則兩重能所妙在其中此義蘊之止觀輔行四明因山外境觀不明不許立陰入為境唯觀不思議境因示之曰不思議境是能觀觀法所顯法門復以兩重能所示之云云遂引止觀輔行明文為證復自立槌砧淳朴之譬詳夫祖師文意說有次第用在一心稱性而觀絶待而照焉有初重次重之分又何得謂之初重約解次重約行又何得謂先以不思議觀觀不思議境為初重却合不思議境觀而觀於陰為次重解行倒置境觀前後如上所評義學不可不精究之鈔又若不立陰等為境妙觀就何處用妙境於何處顯故知若離三道即無三德如煩惱即菩提生死即涅槃玄文略列十乘皆約此立又止觀大意以此二句為發心立行之體格豈有圓頓更過於此若如二師所立合云菩提即菩提涅槃即涅槃也解明圓人離陰無德若如山外直觀真心不立陰妄為境反顯觀非即境而立故曰觀無處用境非達陰而成故曰於何處顯離三道別求三德如棄冰求水豈可得耶如煩惱即菩提等不言結業即解脫者乃順四諦法相生死即涅槃生死是苦涅槃是滅煩惱即菩提煩惱是集菩提是滅意令行人翻苦為滅翻集為道以苦集二諦束為三道結業收在集諦鈔云集既兼業以惑業俱屬故因於兼之耳玄文略列十乘者玄八末辨體章入體之門四教皆列十乘至第九卷初明圓十乘一一乘皆依此二句而立不思議境云即生死之苦諦是無作之滅諦即煩惱之集諦是無作之道諦發心云一切生死即大涅槃一切煩惱即是菩提安心云體生死即涅槃名為定達煩惱即菩提名為慧破遍云若生死即涅槃者分段變易苦諦皆破若煩惱即菩提者四住五住集諦皆破通塞云知生死過患名為塞即涅槃為通知煩惱惱亂為塞即菩提為通道品云觀生死即涅槃治報障觀煩惱即菩提治業障煩惱障次位中云生死之法本即涅槃理涅槃也乃至盡生死底即究竟涅槃也觀煩惱即菩提亦如是安忍中云若觀生死即涅槃不為陰入等境所動若觀煩惱即菩提不為見慢境所動離愛中云觀生死即涅槃故諸禪三昧功德生觀煩惱即菩提故諸陀羅尼等生文止觀大意者荊溪所述文中發心文云衆生無邊誓願度生死即涅槃故煩惱無數誓願斷煩惱即菩提故安心中云若知煩惱生死本性清淨名之為寂此煩惱生死本性如空名之為照通塞中云雖知生死煩惱為塞菩提涅槃為通文鈔又引常坐中起對俱法界者今問法界因何有起對邪須知約根塵識故方云起對法界故義例釋此文云體達修觀若起若對陰入不出法界成不思議彼有約理約觀約果三義此文正約觀行辨也又安心文云唯信法性者未審信何法為法性邪而不知此文正是於陰修乎止觀故起信論云一切衆生從本已來未曾離念又下文云濁成本有若不觀三道即妙便同偏觀清淨真如荊溪還許不故輔行解安住世諦云以正觀安故世諦方成不思議又云安即觀也故談玄妙不違現文方為正說今釋一念乃是趣舉根塵和合一剎那心若陰若惑若善若惡皆具三千皆即三諦乃十妙之大體故云咸爾斯之一念為成觀故今文專約明乎不二不可不曉故茲委辨解前問答中直分判其能觀所顯今出其意故云因何有起對等耶約根等者輔行釋云佛法界根也對法界塵也起法界識也文義例釋者心境釋疑例問第一卷弘誓境中云對法界起法界法界如何有起有對答一者約理心佛無殊雖起雖對奚嘗非理二者夫念起依理體達若起若對不出法界三者稱理理既法界起對稱理無非法界文即約理等三義也雖有三釋今欲顯法界之言是所顯故但引約觀一義唯信法性者正是達妄成真真外無法故云唯信法性山外引此為觀真心而不知乃於陰妄修乎止觀二文並答上能觀所顯引起信并染淨門並證一念屬妄論云是故一切衆生從本以來念念相續未曾離念故說無始無明文偏觀等者輔行云今家用此十法為境不同常途別立清淨真如無生無漏文金錍云傍遮偏指清淨真如知荊溪不許也安住等者因止觀五二十八引大經不生等四句於不生生中云安住世諦名不生生止觀釋云無明共法性能生一切隔歷分別故名世諦安住者以止觀安於世諦即是不可思議境輔行五下二釋云以止觀安故世諦方成不思議境安即觀也文豈可直云不思議耶今釋文中一念乃是意根為因法塵為緣因緣和合起一念心輔行云秪觀根塵一念心起文此心的屬於妄也陰是苦道惑是煩惱善惡是業此之三道皆具三千皆即三諦舊謂一念三道正當揀境今謂不然須知正釋理境乃至利益咸爾意謂此之三道趣舉一法皆具三千皆即三諦為今十妙大體故云咸爾若爾何故文云不出一念故繼之曰斯之一念為成觀故與上文諸法皆具為成妙觀的指一念義同鈔問相傳云達磨門下三人得法而有淺深尼總持云斷煩惱證菩提師云得吾皮道育云迷即煩惱悟即菩提師云得吾肉慧可云本無煩惱元是菩提師云得吾髓今煩惱即菩提等稍同皮肉之見那云圓頓無過解上因山外不立陰境直觀真心遂引玄觀以生死即涅槃煩惱即菩提為一家宗極之說又恐他人以禪宗名同義異之文惑亂正說故料簡之相傳云者不欲指其異說之人故須知此出圭峯後集裴相國問禪法宗徒源流淺深圭峯答釋云達磨直出可師傍傳道育及尼總持及示三人見解親疏故有此語印本見行詳四明意恐當時有人引此為難故今斥之如往復書云圭峯後集流衍來吳禪講之徒多所宗尚咸云達磨印於二祖本無煩惱元是菩提方為得髓智者所說即同持育二人之解乃成得肉之言鄙僧忝嗣台宗得不傷痛遂於指要文中對揚厥旨文今煩下結成難勢鈔答當宗學者因此語故迷名失旨用彼格此陷墜本宗良由不窮即字之義故也解當宗學者不得今家正傳因見迷即煩惱等說便同今家煩惱即菩提之語即迷名也但有即名而無即義雖云迷即煩惱悟即菩提乃背面相翻之義非今家當體全是之義故云失旨若用彼禪宗格量吾教則使抗折百家之說同彼得肉之言故云陷墜皆為不明即義故也鈔應知今家明即永異諸師以非二物相合及非背面相翻直須當體全是方名為即何者煩惱生死既是修惡全體即是性惡法門故不須斷除及翻轉也諸家不明性惡遂須翻惡為善斷惡證善故極頓者仍云本無惡元是善既不能全惡是惡故皆即義不成故第七記云忽都未聞性惡之名安能信有性德之行若爾何不云煩惱即煩惱等而云菩提涅槃邪答實非別指秪由性惡通融寂滅自受菩提涅槃之名蓋從勝立也此則豈同皮肉之見乎又既煩惱等全是性惡豈可一向云本無邪解今家所明即義永異諸宗人師此通總言之下云諸家諸宗是同二物相合對總持斷惑證理背面相翻對道育迷惑悟道當體全是正示今家即義輔行云即者廣雅云合也若依此釋仍似二物相合其理猶疏今以義求體不二故方名為即文雖不對可師本無元是今既云煩惱當體全是菩提豈可謂本無煩惱是知可師亦無即義往復書云智者立法華待絶二妙止觀圓頓十乘以生死即涅槃煩惱即菩提二句文以為綱格誠非二物相合名即不可以斷證明之亦非一法翻轉名即故不可以迷悟分之煩惱非定本無菩提非定本有故用煩惱即菩提絶其言詮寂其思慮俾妙解圓明妙行頓顯者也文何者下徵釋即義發明即具宗旨點示性惡法門修惡性惡對修善性善得名克論法體不出十界九一對分善惡別行玄記云九界望佛皆名為惡文煩惱生死是九界法故屬修惡圓人解了九界修惡當體即性性名不改復是法門豈可斷除翻轉斷對總持翻對道育別行玄云性之善惡但是善惡之法門性不可改歷三世無誰能毀復不可斷壞記云善惡是性性不可改安可斷耶既不可改但是善惡之法門也法名可軌軌持自體不失不壞復能軌物而生於解門者能通可出可入等諸家下明諸宗失即義別行玄記云以性具善諸師亦知具惡緣了他皆莫測文言雖兼指意破禪宗三師翻破道育斷證破總持極頓破可師可師既云本無元是不能全煩惱修惡當體即是性惡故三師皆即義不成第七記者妙樂七二十二因文句釋經一相一味謂解脫相離相滅相即本有三道性惡法門記云若不爾者徒開浪會虗說漫行止對此終窮焉能昧實忽都未聞等謂忽若都未曾聞性德三道之名安能信有一乘性德之行光記一云須聞性惡者以知性惡故修惡本虗三觀十乘無惑可破無理可顯修德功寂是無作行故以性德召此行也文問摩訶止觀無性惡之名應非性德之行竹菴曰荊溪出語各有所對自有對山家學者自有對他宗學者今文乃對他宗而言也止觀性具三千與今談性惡廣略異耳若爾下徵釋即義由上云不能全惡是惡謂斷除翻轉本無皆不能全修是性今徵云何不云煩惱即煩惱生死即生死耶答實非煩惱生死之外別指他法為菩提涅槃只由生死等雖是惡法以即性故法體通融故煩惱受菩提之名法體寂滅故生死受涅槃之號從勝立名名雖勝劣體無優降但約化他修門邊說言煩惱生死則生厭離言菩提涅槃則生欣樂為此義故從勝立名名雖轉而體不轉也若名體俱不轉謂生死即生死亦應無妨煩惱即菩提等體既不轉豈同持育斷除翻轉得皮得肉之見又既修惡全是性惡豈同可師云本無耶名體轉不轉四句分別一名轉體不轉三道即三德三道之名雖轉為三德體實不轉生死即涅槃即此句二體轉名不轉大論云轉生死五陰為法性五陰而猶有五陰之名三名體俱不轉如云十二因緣非佛天人修羅所作本自有之此名體俱不轉今云全惡是惡亦爾四名體俱轉止觀云無明復為法性明即名體俱轉性惡問天台諸部不談性惡獨在別行言之何耶答玄約人法十雙總釋品題初人法至第八乃順論自他九明緣了是却討根本上之八雙皆是緣了二因而為種子至料揀中問緣了既有性德善亦有性德惡不答具文以此義故在彼文明諸部不明者記云摩訶止觀明具三千妙玄文句明示千法微乎修性其文既廣具義難彰是故此中略斷善惡明性本具名言既略學者易尋若知善惡皆性本具性無不融則十界百界一千三千以此所談望止觀文不多不少文據此則玄句止觀非不明之但是廣談一千三千別行略說性具善惡也問修性善惡其相何如答性具佛界為性善性具九界為性惡修中佛界為修善修起九界為修惡四明云本具三千為性善性惡緣起三千為修善修惡文問緣起三千為修善惡則三千法體不可斷破指要云煩惱生死既是修惡全體即是性惡法門故不須斷除及翻轉也若云不斷別行玄又云闡提斷修善盡佛斷修惡盡北峯曰今言斷者約即論斷四明云障體即德無障可論斯為斷義文今亦可疑既即是了有何可斷曰以由即故而顯於離以由離故全顯於斷離謂離情即謂即法以離情故即是於斷以即法故故言不斷應知但斷能執之情病故云諸佛斷修惡盡不破所執之法故云修善修惡即事造三千也問性惡斷不答性具善惡實不斷破故云性之善惡但是法門性不可改復不可斷壞如云若斷性惡普現色身從何而起若云拔性德苦即理毒害為所消伏此乃體是修惡以就圓論指修即性故受理性之稱亦約即論斷義也應知性惡有起有具具者性具九界也起者乃全性起惡此是修惡以圓詮故即性而起受理性稱如云法界無染即理性之毒玄云破無明理惡別行云拔性惡苦皆此類也既指修即性以修為性也鈔然汝所引達磨印於可師本無煩惱元是菩提等斯乃圭峯異說致令後人以此為極便棄三道唯觀真心若據祖堂自云二祖禮三拜依位立豈可言煩惱菩提一無一有耶故不可以圭峯異說而格今家妙談爾解此一節元本自云此乃又超得髓之說也可師之見意縱階此語且未圓問今明圓教豈不論斷惑證理及翻迷就悟耶若論者何異持育之解答只如可師豈不斷惑翻迷豈亦同前二耶故知凡分漸頓蓋論能斷能翻之所以爾文時天童凝禪師有書於四明謂不可以道聽塗說將為正解凡往復二十來番諍之不已太守直閣林公勸四明下和融之語辭不獲已遂改數行云然汝等汝字正指前相傳云者蓋當時禪講之徒咸謂台教宗旨只齊持育之見尊者救時之蔽故此闢之往復書云人據圭峯以難台教豈不依教而反破之文能斷能翻之所以者其實漸頓二教咸皆斷證迷悟蓋約能斷能翻之觀智即不即次不次以分漸頓之別爾鈔今既約即論斷故無可滅約即論悟故無可翻煩惱生死乃九界法既十界互具方名圓佛豈壞九轉九邪如是方名達於非道魔界即佛故圓家斷證迷悟但約染淨論之不約善惡淨穢說也諸宗既不明性具十界則無圓斷圓悟之義故但得即名而無即義也此乃一家教觀大途能知此已或取或捨自在用之故止觀亦云唯信法性不信其諸語似棄妄觀真元云豈異可師之說而義例判云破昔計故約對治說故知的示圓觀須指三道即是三德故於陰等觀不思議也若不精揀何稱圓修此義難得的當至因果不二門更為甄之解此下對前斷證迷悟二義以明今家正意若得前來修惡即性之義則斷與不斷二皆無在今家約即論斷不同尼總持約即論悟不同道育當知煩惱生死乃九界修惡之法既十界互具界界具十則九界當處即是佛界是名圓佛豈斷壞九界而證佛界又豈轉九界之迷為佛界之悟耶如是論之方名達九界非道即是佛道魔界如佛界如也四明云佛之與魔相去幾何文圓論斷證迷悟但約情理以說情著則十界俱染有惑可斷為惑所迷理融則十界俱淨不斷而證了迷即悟但約此論不約三善三惡六穢四淨法體而說以善惡淨穢皆性本具不可斷除翻轉故也此乃等者指上即具之旨是教觀大途教不明此非圓頓妙教行不明此非圓頓妙觀苟能知此旨取捨自在無不圓極取捨即斷否義光記云秪就即之一字明於二義障體即德無障可論斯為斷義障既即德障何嘗斷斯不斷義斷與不斷妙在其中文止觀亦云者對前第三師說非特彼云本無元是而止觀亦云唯信法性然義例云約對治文云以衆生久劫但著諸法不信法性破昔計故約對治說令於諸法純見法性若見法性則見諸法純是法性文故知下通結上文所明即義一家極談難於的當至下釋三千並常更為甄別鈔云體用之名等二則止下示成由行則止觀十乘成今自行因果起教一章成今化他能所解科示成由行者欲成顯此十妙因果自他當修妙行止觀凡十章大意釋名體相攝法偏圓方便正觀果報起教指歸此十亦即因果自他於十章中唯舉十乘起教者前六是十乘之解果報是三法之相旨歸是息化之理今故不言但舉正觀成前五妙起教成後五妙鈔已約心法顯乎妙旨雖知十妙不離一念若非妙行何能成之故玄文雖立觀心而且託事附法蓋非部意故多闕略若具論能成之功須指摩訶止觀也故境等五妙且論諸聖及佛世當機所觀所發所行所歷所究盡法而於我曹稟教行人如何成就故令修止觀用十法成乘方能親觀妙境發智立行歷位登果故彼十乘能令行人成就自行因果也解將欲正出今文之意先重指前科指妙歸心乃約一念心法顯示三千妙旨則了十妙法相不離一心雖能解知若欲成就須修妙行故玄下釋出相成之意玄文縱有觀心但是託事附法以其解正行傍非部正意故乘境不備若欲具足論於能成須指止觀以止觀正明觀法行正解傍乘境悉備故須修十乘起教成就玄文十妙因果自他之法故境下釋十乘成自行因果玄文所談境等五妙乃佛世諸聖當機修證之法於我輩今日稟教修行之人何能成就故荊溪令學者依止觀十乘修之方能成顯也所觀境所發智所行行所歷位究盡三法鈔言起教一章成今化他能所者彼文起教雖即弗宣而且不出裂網之意此裂網文泛論生起雖在果後化他細尋其意多明初心自行故文云種種經論開人眼目執此疑彼是一非諸今融通經論解結出籠豈非始行能裂他網又文云若人善用止觀觀心則心慧明了通達漸頓諸教如破微塵出大千經卷河沙佛法一心中曉豈非自行起教又云若欲外益衆生逗機設教等此文方是果後化他也輔行二釋謂化他裂網自行裂網但自行文略故讀者多暗至於歸大處文亦為初心修觀而說故云膠手易著寱夢難醒封文齊意自謂為是乃至云為此意故須論指歸故知五略十廣雖該自他始終而盡是行者修法若了彼文方可銷今相成之意故今十門從染淨不二已去皆指果後設化之相悉在初心剎那一念而必須三觀功成此用方顯故文云故須初心而遮而照等故知能修起教之觀則能成就應機現通說法之用也此意稍隱解者方知不作此解則止觀裂網指歸之文記中自行之釋及今相成之語如何銷之若云但修十乘果用自顯者則合云十乘成今化他能所爾解桐洲私科分四初標起教章二示止觀文意三示今門文意四結迷解得失次文分三初正示起教文意二初引止觀文二初示意弗宣者天台說摩訶止觀至第七正修才至見境時逼夏終法輪停轉後三章不說起教不出五略中裂網之意起教本為除他疑網其意是同故輔行云雖缺餘文行門非要略中已具足表其心文此裂等者若以止觀文相生起次第言之則裂網在感果之後須至果後化他方能裂他疑網若委細推尋文中元意必自行修之後方化他則一部始終盡是行者修法故深求文意多明初心自行少論果後化他淨覺謂自裂網則通初心裂他網須至果後但得泛論生起之義二引文凡三節北峯謂初文乃初心為他通經非修觀也第三是果後化他亦非修觀今起教觀正是第二自行起教之文由善用止觀觀心發悟通達諸教名自行起教未是破無明果上起教又非初心為他說起教若初心為他說名初心裂網非正修起教觀義也文初始行裂網文云種種等者第二卷五略生起中標裂網文云云何裂大網種種經論開人眼目執此疑彼是一非諸聞雪謂冷聞鶴謂動今融通經論解結出籠文大小乘教本是開明智眼逗物不同種種各說不曉如來悉檀被物之意於四門互相執著是一非諸今融通經論解結出籠既云融通經論即初心能裂他網也輔行釋云雖本為開衆生智眼實機未顯如法華前衆生於教權實空有事理互迷若為判已開權顯實使權實不濫令識教本意破執教疑網達一理無外了法門大體知衆教有歸文今融通等者理本無說說必被機四悉四門諸觀諸諦適時利物未及通方便各計一隅情執未破今為融會重疑颯然如繫鳥在籠情無所適解執滯結開權教籠如游太虗縱曠無礙文此是始行裂他網之文初心便能解釋經論教示來學淨覺謂若自裂網則通初心裂他網須至果後者不究融通經論之言與釋裂網中通除自他疑網之說又籤云自行則從因至果化他則位位有之文淨覺見據初心依理生解與果上起教不同者輔行自揀初心觀化他境是內心觀解與果上起教不同於今始行裂他網了無關涉又文云等者第二卷釋裂網文云第四為通裂大網諸經論故說是止觀者若人善用止觀觀心等文此正明修起教觀故云用觀觀心通達諸教輔行明作自行釋之言善用者用不思議觀觀於妙境則攬果上偏圓漸頓不出一心用觀觀之則河沙佛法一心中曉輔行云初文通除自他疑網故云通裂乃至須曉漸頓諸教出自一心若不善用不思議觀觀於一心不思議境何由可裂執教大疑文科云初約觀心自除疑網豈非正明初心修起教觀耶破塵出卷者華嚴如來性品譬如有一經卷如大千界所有一切無不記録時有異人具足天眼見此經卷在一塵內作是念言云何經卷在一塵內遂破塵出卷輔行引寶性論云有神通人見佛法滅以大千經卷藏一塵中後有人破塵出卷文三果後化他連文云若欲外益衆生逗機設教者隨人堪任稱彼而說等文四明斷為果後起教二明輔行釋二釋者通指上兩文初作自行釋故云須曉等次作化他釋故曰為利他故裂他疑網自行文略者輔行自行釋中文甚簡略只由淨覺引文不備專據若不善用不思議觀等文謂但修十乘果上自顯不許四明修起教觀而不看上文云須曉漸頓諸教出自一心此正當修起教觀之義淨覺昧此故云讀者多暗又謂自裂通初心裂他須果後不許初心裂他及修起教故四明備引三文一一結示使初心有裂他網義有修起教義有果後起教義初文有融通之言即始行裂他網也次文有善用止觀之言即初心修起教也第三有逗機之言即果後施化也二例示指歸文意云至于等旨歸三德名為大處自他同歸三德雖是息化之理亦為初心故止觀二二十二云第五歸大處諸法畢竟空故說是止觀者夫膠手易著夢難醒封文齊意自謂為是競執瓦礫為琉璃珠近事顯語猶尚不知況遠理密教寧當不惑為此意故須論旨歸文輔行釋云心性如手惑著如膠隨文封滯迷於旨趣不達教相不曉旨歸隨文生著互相是非非但不至三德旨歸為陰集魔而擔將去寱夢等者夢甚故寱寱故難醒法性如眠無明如夢僻執如寱執重難除名為難醒封文等者封閉也塞也諸教諸門諸諦諸悉隨一各執故云齊意文三通一部文意五略中發心修行即自行始感果即自行終裂網即化他始歸處即自他同歸亦自他終三示今門文意謂若了止觀裂網文意通於初心方可消今之起教成化他能所後之五妙也故今十門前四門為十乘觀體後六門為起教觀體也從染淨門去純談化他悉在初心修觀由因中修觀之功至果顯化他之用故引染淨門能顯妙觀文證空中名遮假觀名照三觀圓修淨用方顯故知因修起教能成就應機等用也感應妙中之應神通說法二妙皆是能化之用所化即感及眷屬利益二妙也後六門中染淨謂所顯淨法依正謂果用由因本具自他謂感應之體本同三業謂所顯果用皆果後化他也若染淨云能顯妙觀依正云理顯以觀為功自他云觀行之功方顯三業云能顯觀體皆因中修起教觀之相也四結迷解得失若云等者結斥淨覺偏見之失彼謂四明離十乘別修起教自立義云但修十乘果用自顯今反質云如其說則荊溪合云十乘成化他爾起教觀輔行二下十八云問大章名起教五略名裂網云何得同答對揚利物名為起教令他除疑名為裂網起教本為除他疑網是故同也文止觀大意敘五略中云起八教是則裂網起教名異義同四明深得此意乃云彼文起教雖即弗宣而且不出裂網之意文以五略略於九廣九廣廣上五略文心解云起教之言須起八教遍逗群機而反用自裂之文作自行起教不亦謬濫乎文彼迷於義同名異反顯廣略義不相關況復止觀明指第九重當廣說是知五略裂網即大章起教也今文云此裂網文泛論生起雖在果後化他細尋其意多明初心自行文尊者立義果後化他法門須在初心修觀因若不修果何能顯初心行人必須遍攬果上偏圓漸頓權實法門入一念心修之方能果後遍逗群機也止觀明指第九重當廣說攝法中亦略示文起教雖即弗宣攝法之文可考止觀三云如來曾作漸頓觀心偏圓具足依此心觀為衆生說教化弟子令學如來破塵出卷仰寫空經文又釋裂網文如前引並初心修起教觀之明文也然初心修起教為離十乘外別修耶即十乘而修耶若別修者則顯十乘觀體一念三千攝法不盡況自行初心修不思議境又修起教應兩重用觀耶若即十乘而修不二門那云十乘成自行起教成化他耶答若以觀體言之十乘起教只一三千三諦何法不具但修觀行者須精識果上偏圓漸頓諸教出自一心攬此等法入一念心而修名起教觀北峯曰法理已備修相未明是知說有次第修在一心善修止觀者攬化他法融入一心焉有起教在十乘外荊溪云須曉漸頓諸教出自一心至執教大疑如此自他並由妙觀契於妙境是故能有如是妙用文草菴云終日十乘終日起教但文義主對解行相當則妙玄十妙止觀十章各具自行化他之法妙玄前五妙須修止觀十乘自行之觀成之後五妙須修止觀起教之觀成之此關節也若以旨趣言之十乘不離起教起教不離十乘草菴曰止觀雖十乘不思議境觀一也初心雖起教而不思議境觀亦一也文心解引輔行云若不善用不思議觀等文豈非但修十乘耶若謂十乘不該果用後之五妙更須別修則衆寶之車成壞驢之運文此以旨趣而難關節抑亦四明何嘗云別修耶若云起教不通初心修者籤文云撮十妙為觀法大體應云撮五妙為觀體只合云重述四門令觀行可識淨覺不許初心修起教觀如何消今相成之意耶文心解曰但以起教之義正明感應等事彼此相顯故云成今文荊溪謂十乘成前五妙起教成後五妙故重述十門令觀行可識是知十乘起教俱是觀法若以彼此教觀相顯以釋相成却見十門徒施觀法無用矣問鈔云互相顯映與彼此相顯何異答淨覺但約彼觀此教而言相顯不知以行成解四明約教廣觀略行正解傍而論相顯即解行相成也問初心修起教與化他境為同為異答起教觀乃攬果後化他法門入初心修化他境明三千法離性執己無妨四說不可會同
